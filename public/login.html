<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RunCity — Entrar</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --p:      #7c5cfc;
      --p-l:    #a084fd;
      --p-ll:   #c4b5fd;
      --p-d:    #5b3fd8;
      --p-dim:  rgba(124,92,252,.1);
      --p-mid:  rgba(124,92,252,.22);
      --p-glow: rgba(124,92,252,.38);
      --ok:     #22c55e;
      --err:    #ef4444;
      --bg:     #08061a;
      --c0:     #100e24;
      --c1:     #170f32;
      --brd:    #231848;
      --brd2:   #190e38;
      --t1:     #ede8ff;
      --t2:     #5e5280;
      --t3:     #9488c0;
      --ff-d:   'Bebas Neue', sans-serif;
      --ff-b:   'Outfit', sans-serif;
    }

    [data-theme="light"] {
      --bg:  #f8f7ff;
      --c0:  #eeebff;
      --c1:  #e4dfff;
      --brd: #cdc5f0;
      --brd2:#d8d0f8;
      --t1:  #160f38;
      --t2:  #6e60a0;
      --t3:  #453880;
    }

    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

    body {
      background: #050410;
      font-family: var(--ff-b);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    [data-theme="light"] body { background: #eae7f8; }

    /* ── PHONE ── */
    .phone {
      width: 390px;
      height: 844px;
      background: var(--bg);
      border-radius: 46px;
      border: 1.5px solid var(--brd);
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 0 1px rgba(124,92,252,.05), 0 40px 100px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.04);
      animation: slideUp .5s cubic-bezier(.08,.82,.17,1) both;
      flex-shrink: 0;
      transition: border-color .3s;
    }

    .pscroll { width:100%; height:100%; overflow-y:auto; overflow-x:hidden; }
    .pscroll::-webkit-scrollbar { width:2px; }
    .pscroll::-webkit-scrollbar-thumb { background:var(--brd); border-radius:2px; }
    .pbody { padding: 0 24px 32px; min-height:100%; display:flex; flex-direction:column; }

    /* ── LOGO/HERO ── */
    .hero { padding: 48px 0 28px; text-align:center; position:relative; }
    .hero::before {
      content:''; position:absolute; top:-30px; left:50%; transform:translateX(-50%);
      width:340px; height:240px;
      background:radial-gradient(ellipse, var(--p-glow) 0%, transparent 65%);
      opacity:.18; pointer-events:none;
    }

    .logo-mark {
      width:78px; height:78px; border-radius:22px;
      background: linear-gradient(160deg, var(--p) 0%, var(--p-d) 100%);
      display:inline-flex; align-items:center; justify-content:center;
      margin-bottom:18px; position:relative;
      box-shadow: 0 0 0 6px var(--p-dim), 0 18px 38px rgba(124,92,252,.4);
      animation: pulseGlow 3s ease-in-out infinite;
    }
    @keyframes pulseGlow {
      0%,100% { box-shadow: 0 0 0 6px var(--p-dim), 0 18px 38px rgba(124,92,252,.35); }
      50%     { box-shadow: 0 0 0 9px var(--p-dim), 0 18px 50px rgba(124,92,252,.6); }
    }

    .logo-title {
      font-family: var(--ff-d);
      font-size: 42px;
      letter-spacing: 4px;
      color: var(--t1);
      line-height: 1;
    }
    .logo-title span { color: var(--p-l); }
    .logo-sub {
      font-size: 12px;
      font-weight: 500;
      color: var(--t2);
      margin-top: 8px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* ── TABS ── */
    .tabs {
      display:flex; background:var(--c0);
      border-radius:12px; padding:4px;
      border:1px solid var(--brd2);
      margin-bottom: 22px;
      gap: 2px;
    }
    .tab {
      flex:1; text-align:center;
      padding: 11px 8px; border-radius: 9px;
      font-size: 13px; font-weight: 700;
      letter-spacing: .4px;
      cursor: pointer; transition: all .2s;
      color: var(--t2); border: 1px solid transparent;
    }
    .tab.active {
      background: var(--p-dim); color: var(--p-ll);
      border-color: var(--p-mid);
    }

    /* ── FORM ── */
    .form { display:none; flex-direction:column; gap:14px; animation: fadeIn .25s ease; }
    .form.active { display:flex; }
    @keyframes fadeIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }

    .field { position:relative; }
    .field svg.lead {
      position:absolute; left:14px; top:50%;
      transform: translateY(-50%);
      color: var(--t2); pointer-events:none;
    }
    .field input {
      width:100%; height:48px;
      background: var(--c0);
      border: 1.5px solid var(--brd2);
      border-radius: 12px;
      padding: 0 44px 0 42px;
      font-family: var(--ff-b);
      font-size: 14px; color: var(--t1);
      transition: border-color .2s, background .2s;
    }
    .field input::placeholder { color: var(--t2); }
    .field input:focus {
      outline: none;
      border-color: var(--p-mid);
      background: var(--c1);
    }
    .field .toggle-eye {
      position:absolute; right:8px; top:50%;
      transform: translateY(-50%);
      width:32px; height:32px; border-radius:8px;
      display:flex; align-items:center; justify-content:center;
      background:transparent; border:none; cursor:pointer;
      color: var(--t2); transition: color .2s;
    }
    .field .toggle-eye:hover { color: var(--p-l); }

    .row-mini {
      display:flex; align-items:center; justify-content:space-between;
      font-size: 12px; margin-top: -2px;
    }
    .check {
      display:inline-flex; align-items:center; gap:7px;
      color: var(--t3); cursor:pointer; user-select:none;
    }
    .check input { display:none; }
    .check .box {
      width:16px; height:16px; border-radius:5px;
      border: 1.5px solid var(--brd);
      background: var(--c0);
      display:flex; align-items:center; justify-content:center;
      transition: all .2s;
    }
    .check input:checked + .box {
      background: var(--p);
      border-color: var(--p);
    }
    .check input:checked + .box::after {
      content:''; width:8px; height:4px;
      border-left: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(-45deg) translate(1px,-1px);
    }
    .link {
      color: var(--p-l); font-weight: 600;
      text-decoration: none; cursor: pointer;
      font-size: 12px;
    }
    .link:hover { color: var(--p-ll); }

    .err-msg {
      font-size: 12px;
      color: var(--err);
      padding: 8px 12px;
      background: rgba(239,68,68,.08);
      border: 1px solid rgba(239,68,68,.25);
      border-radius: 8px;
      display:none;
    }
    .err-msg.show { display:block; }

    .nota-cripto {
      display: flex; align-items: flex-start; gap: 8px;
      font-size: 11px;
      color: var(--t3);
      padding: 9px 12px;
      background: var(--p-dim);
      border: 1px solid var(--p-mid);
      border-radius: 9px;
      line-height: 1.4;
    }
    .nota-cripto svg { flex-shrink: 0; margin-top: 1px; color: var(--p-l); }
    .nota-cripto strong { color: var(--p-ll); font-weight: 700; }

    .field select {
      width:100%; height:48px;
      background: var(--c0);
      border: 1.5px solid var(--brd2);
      border-radius: 12px;
      padding: 0 14px 0 42px;
      font-family: var(--ff-b);
      font-size: 14px; color: var(--t1);
      transition: border-color .2s, background .2s;
      appearance: none;
      cursor: pointer;
    }
    .field select:focus {
      outline: none;
      border-color: var(--p-mid);
      background: var(--c1);
    }
    .field select option { background: var(--c1); color: var(--t1); }
    .field-row { display: flex; gap: 10px; }
    .field-row .field { flex: 1; }

    .username-status {
      font-size: 11px; font-weight: 600;
      padding: 5px 10px; border-radius: 7px;
      margin-top: -6px; display: none;
    }
    .username-status.ok  { display:block; color: var(--ok);  background: rgba(34,197,94,.08);  border: 1px solid rgba(34,197,94,.2); }
    .username-status.err { display:block; color: var(--err); background: rgba(239,68,68,.08);  border: 1px solid rgba(239,68,68,.2); }
    .username-status.chk { display:block; color: var(--t2);  background: var(--c0);             border: 1px solid var(--brd2); }

    .ok-msg {
      font-size: 12px; color: var(--ok);
      padding: 8px 12px;
      background: rgba(34,197,94,.08);
      border: 1px solid rgba(34,197,94,.25);
      border-radius: 8px;
      display:none;
    }
    .ok-msg.show { display:block; }

    .dev-link {
      font-size: 10px; color: var(--t3);
      padding: 8px 12px;
      background: var(--c0);
      border: 1px dashed var(--brd);
      border-radius: 8px;
      word-break: break-all;
      display: none;
    }
    .dev-link.show { display: block; }
    .dev-link strong { color: var(--p-l); display: block; margin-bottom: 4px; }
    .dev-link a { color: var(--p-ll); text-decoration: underline; }

    .btn-voltar {
      width: 100%;
      background: transparent;
      border: 1px solid var(--brd2);
      color: var(--t2);
      padding: 11px;
      border-radius: 12px;
      font-family: var(--ff-b);
      font-size: 12px; font-weight: 600;
      cursor: pointer;
      transition: all .2s;
    }
    .btn-voltar:hover { color: var(--t1); border-color: var(--brd); }

    .btn-primary {
      height: 50px;
      background: linear-gradient(135deg, var(--p) 0%, var(--p-d) 100%);
      color: #fff;
      border: none; border-radius: 12px;
      font-family: var(--ff-b);
      font-size: 14px; font-weight: 700;
      letter-spacing: .8px; text-transform: uppercase;
      cursor: pointer;
      transition: transform .15s, box-shadow .2s, opacity .2s;
      box-shadow: 0 8px 24px rgba(124,92,252,.35);
      margin-top: 4px;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 12px 32px rgba(124,92,252,.5); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity:.6; cursor: wait; }

    /* ── DIVIDER + SOCIAL ── */
    .divider {
      display:flex; align-items:center; gap:12px;
      margin: 22px 0 16px;
      font-size: 11px; font-weight: 600;
      color: var(--t2); letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .divider::before, .divider::after {
      content:''; flex:1; height:1px; background: var(--brd2);
    }

    .btn-social {
      width:100%; height:46px;
      background: var(--c0);
      border: 1.5px solid var(--brd2);
      border-radius: 12px;
      display: flex; align-items:center; justify-content:center; gap: 10px;
      font-family: var(--ff-b);
      font-size: 13px; font-weight: 600;
      color: var(--t1);
      cursor: pointer; transition: all .2s;
    }
    .btn-social:hover { border-color: var(--p-mid); background: var(--c1); }

    /* ── FOOTER ── */
    .foot {
      margin-top: auto;
      padding-top: 24px;
      text-align:center;
      font-size: 11px;
      color: var(--t2);
      letter-spacing: .3px;
    }
    .foot a { color: var(--p-l); text-decoration:none; font-weight:600; }

    /* ── TOAST ── */
    .toast { position:fixed; bottom:36px; left:50%; transform:translateX(-50%) translateY(10px); background:var(--c1); border:1px solid var(--p-mid); color:var(--p-ll); padding:10px 22px; border-radius:30px; font-size:12px; font-weight:600; z-index:9999; white-space:nowrap; pointer-events:none; opacity:0; transition:all .28s; box-shadow:0 8px 30px rgba(0,0,0,.5); }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    .toast.err { border-color: rgba(239,68,68,.45); color: #fecaca; }

    @keyframes slideUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }

    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; }
    }

    @media (max-width:440px) {
      .phone { width:100vw; height:100vh; border-radius:0; border:none; }
      body { padding:0; }
    }
  </style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="phone">
  <div class="pscroll">

    <!-- Status bar -->
    <div class="pbody">

      <!-- Hero -->
      <div class="hero">
        <div class="logo-mark">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 4l-2 5 4 2-3 9 8-12-5-1 2-3z"/>
          </svg>
        </div>
        <div class="logo-title">RUN<span>CITY</span></div>
        <div class="logo-sub">Conquiste sua cidade</div>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <div class="tab active" data-form="login" onclick="trocarAba(this)">Entrar</div>
        <div class="tab" data-form="cadastro" onclick="trocarAba(this)">Criar conta</div>
      </div>

      <!-- Form: entrar -->
      <form class="form active" id="form-login" onsubmit="entrar(event)" novalidate>
        <div class="field">
          <svg class="lead" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input type="email" name="email" placeholder="E-mail" autocomplete="email" required>
        </div>

        <div class="field">
          <svg class="lead" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0110 0v4"/>
          </svg>
          <input type="password" name="senha" placeholder="Senha" autocomplete="current-password" required>
          <button type="button" class="toggle-eye" onclick="verSenha(this)" aria-label="Mostrar senha">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <div class="row-mini">
          <label class="check">
            <input type="checkbox" name="lembrar" checked>
            <span class="box"></span>
            Lembrar de mim
          </label>
          <a class="link" onclick="abrirRecuperar()">Esqueci a senha</a>
        </div>

        <div class="err-msg" id="erro-login"></div>
        <button class="btn-primary" type="submit">Entrar</button>
      </form>

      <!-- Form: criar conta -->
      <form class="form" id="form-cadastro" onsubmit="cadastrar(event)" novalidate>
        <div class="field">
          <svg class="lead" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input type="text" name="nome" placeholder="Nome" autocomplete="name" required>
        </div>

        <div class="field">
          <svg class="lead" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input type="email" name="email" placeholder="E-mail" autocomplete="email" required>
        </div>

        <div class="field">
          <svg class="lead" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 20h.01"/><path d="M7 20v-4"/><path d="M12 20v-8"/><path d="M17 20V8"/><path d="M22 4v16"/>
          </svg>
          <input type="text" name="username" id="input-username" placeholder="@username (ex: joao_silva)" autocomplete="off" required oninput="onUsernameInput(this.value)">
        </div>
        <div class="username-status" id="username-status"></div>

        <div class="field-row">
          <div class="field">
            <svg class="lead" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
              <path d="M12 2a15.3 15.3 0 010 20M12 2a15.3 15.3 0 000 20"/>
            </svg>
            <select name="pais" id="select-pais" onchange="onPaisChange(this.value)" required>
              <option value="" disabled selected>País</option>
              <option value="Brasil">🇧🇷 Brasil</option>
              <option value="Portugal">🇵🇹 Portugal</option>
              <option value="Estados Unidos">🇺🇸 Estados Unidos</option>
              <option value="Argentina">🇦🇷 Argentina</option>
              <option value="Espanha">🇪🇸 Espanha</option>
              <option value="França">🇫🇷 França</option>
              <option value="Alemanha">🇩🇪 Alemanha</option>
              <option value="Reino Unido">🇬🇧 Reino Unido</option>
              <option value="Itália">🇮🇹 Itália</option>
              <option value="Japão">🇯🇵 Japão</option>
              <option value="China">🇨🇳 China</option>
              <option value="Outro">🌍 Outro</option>
            </select>
          </div>
          <div class="field">
            <svg class="lead" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/>
            </svg>
            <input type="text" name="cidade" id="input-cidade" placeholder="Cidade" autocomplete="off" required list="cidades-list">
            <datalist id="cidades-list"></datalist>
          </div>
        </div>

        <div class="field">
          <svg class="lead" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0110 0v4"/>
          </svg>
          <input type="password" name="senha" placeholder="Senha (mín. 6 caracteres)" autocomplete="new-password" minlength="6" required>
          <button type="button" class="toggle-eye" onclick="verSenha(this)" aria-label="Mostrar senha">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <div class="field">
          <svg class="lead" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          <input type="password" name="confirmar" placeholder="Confirmar senha" autocomplete="new-password" required>
        </div>

        <div class="nota-cripto">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0110 0v4"/>
          </svg>
          Sua senha é protegida com criptografia <strong>bcrypt</strong>. Nem nós conseguimos ver.
        </div>

        <div class="err-msg" id="erro-cadastro"></div>
        <button class="btn-primary" type="submit">Criar conta</button>
      </form>

      <!-- Form: recuperar senha -->
      <form class="form" id="form-recuperar" onsubmit="recuperar(event)" novalidate>
        <p style="font-size:13px; color:var(--t2); line-height:1.5; margin-bottom:4px;">
          Informe o e-mail da sua conta. Vamos enviar um link para você redefinir sua senha.
        </p>
        <div class="field">
          <svg class="lead" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input type="email" name="email" placeholder="E-mail" autocomplete="email" required>
        </div>
        <div class="err-msg" id="erro-recuperar"></div>
        <div class="ok-msg"  id="ok-recuperar"></div>
        <div class="dev-link" id="dev-link"></div>
        <button class="btn-primary" type="submit">Enviar link</button>
        <button type="button" class="btn-voltar" onclick="trocarParaLogin()">← Voltar</button>
      </form>

      <div class="foot">
        Ao entrar você aceita os <a onclick="showToast('Termos em breve')">Termos</a> e a <a onclick="showToast('Política em breve')">Política de Privacidade</a>.
      </div>

    </div>
  </div>
</div>

<script src="auth.js"></script>
<script>
  /* ── Tabs ── */
  function trocarAba(el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('form-' + el.dataset.form).classList.add('active');
    document.querySelectorAll('.err-msg').forEach(e => e.classList.remove('show'));
    document.querySelectorAll('.tabs').forEach(t => t.style.display = '');
  }

  function abrirRecuperar() {
    document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
    document.getElementById('form-recuperar').classList.add('active');
    document.querySelector('.tabs').style.display = 'none';
    document.querySelectorAll('.err-msg, .ok-msg, .dev-link').forEach(e => e.classList.remove('show'));
  }

  function trocarParaLogin() {
    document.querySelector('.tabs').style.display = '';
    document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
    document.getElementById('form-login').classList.add('active');
    // reativa visualmente a aba "Entrar"
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.dataset.form === 'login');
    });
  }

  async function recuperar(ev) {
    ev.preventDefault();
    const f = ev.target;
    const email = f.email.value.trim().toLowerCase();
    const erro = document.getElementById('erro-recuperar');
    const ok   = document.getElementById('ok-recuperar');
    const dev  = document.getElementById('dev-link');
    erro.classList.remove('show'); ok.classList.remove('show'); dev.classList.remove('show');

    if (!email) { mostrarErro('erro-recuperar', 'Informe seu e-mail.'); return; }

    const btn = f.querySelector('.btn-primary');
    btn.disabled = true; btn.textContent = 'Aguarde…';

    try {
      const res = await fetch('/api/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      const data = await res.json();

      ok.textContent = data.mensagem;
      ok.classList.add('show');

      if (data.token) {
        const link = location.origin + '/redefinir.html?token=' + data.token;
        dev.innerHTML = '<strong>Modo demo — link direto:</strong><a href="' + link + '">' + link + '</a>';
        dev.classList.add('show');
      }
    } catch {
      mostrarErro('erro-recuperar', 'Erro ao processar. Tente novamente.');
    } finally {
      btn.disabled = false; btn.textContent = 'Enviar link';
    }
  }

  /* ── Mostrar/esconder senha ── */
  function verSenha(btn) {
    const input = btn.parentElement.querySelector('input');
    input.type = input.type === 'password' ? 'text' : 'password';
  }

  /* ── Submissão ── */
  function travar(form, travado) {
    const btn = form.querySelector('.btn-primary');
    btn.disabled = travado;
    btn.textContent = travado ? 'Aguarde…' : (form.id === 'form-login' ? 'Entrar' : 'Criar conta');
  }

  function mostrarErro(idErro, msg) {
    const e = document.getElementById(idErro);
    e.textContent = msg;
    e.classList.add('show');
  }

  async function entrar(ev) {
    ev.preventDefault();
    const f = ev.target;
    const email = f.email.value.trim().toLowerCase();
    const senha = f.senha.value;
    document.getElementById('erro-login').classList.remove('show');

    if (!email || !senha) {
      mostrarErro('erro-login', 'Preencha e-mail e senha.');
      return;
    }

    travar(f, true);
    try {
      const user = await RC.login(email, senha);
      showToast('Bem-vindo, ' + user.nome.split(' ')[0] + '!');
      setTimeout(() => { window.location.href = 'index.html'; }, 500);
    } catch (e) {
      mostrarErro('erro-login', e.message);
    } finally {
      travar(f, false);
    }
  }

  /* ── Username check ── */
  let _usernameTimer = null;
  let _usernameValido = false;

  function onUsernameInput(val) {
    clearTimeout(_usernameTimer);
    const status = document.getElementById('username-status');
    const limpo = val.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');

    if (!limpo) {
      status.className = 'username-status';
      _usernameValido = false;
      return;
    }
    if (limpo.length < 3) {
      status.className = 'username-status err';
      status.textContent = 'Username muito curto (mínimo 3 caracteres)';
      _usernameValido = false;
      return;
    }
    if (limpo.length > 30) {
      status.className = 'username-status err';
      status.textContent = 'Username muito longo (máximo 30 caracteres)';
      _usernameValido = false;
      return;
    }

    status.className = 'username-status chk';
    status.textContent = 'Verificando disponibilidade…';
    _usernameValido = false;

    _usernameTimer = setTimeout(() => checarUsername(limpo), 400);
  }

  async function checarUsername(username) {
    const status = document.getElementById('username-status');
    try {
      const res = await fetch(`/api/users/buscar?q=${encodeURIComponent(username)}`);
      if (!res.ok) throw new Error();
      const users = await res.json();
      const ocupado = users.some(u => u.username === username);
      if (ocupado) {
        status.className = 'username-status err';
        status.textContent = `@${username} já está em uso`;
        _usernameValido = false;
      } else {
        status.className = 'username-status ok';
        status.textContent = `@${username} está disponível ✓`;
        _usernameValido = true;
      }
    } catch {
      // Se a API falhar, deixa passar e o backend valida
      status.className = 'username-status chk';
      status.textContent = 'Não foi possível verificar — continuaremos na criação';
      _usernameValido = true;
    }
  }

  /* ── País → sugestões de cidade ── */
  const CIDADES_POR_PAIS = {
    'Brasil': ['São Paulo','Rio de Janeiro','Belo Horizonte','Curitiba','Porto Alegre','Fortaleza','Salvador','Recife','Manaus','Brasília','Campinas','Goiânia','Belém','São Luís','Maceió'],
    'Portugal': ['Lisboa','Porto','Braga','Coimbra','Aveiro','Faro','Funchal','Setúbal','Évora','Viseu'],
    'Estados Unidos': ['New York','Los Angeles','Chicago','Houston','Phoenix','Philadelphia','San Antonio','San Diego','Dallas','San Francisco'],
    'Argentina': ['Buenos Aires','Córdoba','Rosario','Mendoza','La Plata','Mar del Plata','Tucumán','Salta','Santa Fe','Bahía Blanca'],
    'Espanha': ['Madrid','Barcelona','Valencia','Sevilla','Zaragoza','Málaga','Murcia','Bilbao','Alicante','Córdoba'],
    'França': ['Paris','Marseille','Lyon','Toulouse','Nice','Nantes','Strasbourg','Montpellier','Bordeaux','Lille'],
    'Alemanha': ['Berlin','Hamburg','Munich','Cologne','Frankfurt','Stuttgart','Düsseldorf','Leipzig','Dortmund','Essen'],
    'Reino Unido': ['London','Birmingham','Manchester','Leeds','Glasgow','Liverpool','Newcastle','Sheffield','Bristol','Edinburgh'],
    'Itália': ['Roma','Milano','Napoli','Torino','Palermo','Genova','Bologna','Firenze','Bari','Venezia'],
    'Japão': ['Tokyo','Osaka','Yokohama','Nagoya','Sapporo','Fukuoka','Kobe','Kyoto','Kawasaki','Saitama'],
    'China': ['Shanghai','Beijing','Guangzhou','Shenzhen','Chengdu','Chongqing','Hangzhou','Wuhan','Xi\'an','Nanjing'],
  };

  function onPaisChange(pais) {
    const datalist = document.getElementById('cidades-list');
    const cidades = CIDADES_POR_PAIS[pais] || [];
    datalist.innerHTML = cidades.map(c => `<option value="${c}">`).join('');
    document.getElementById('input-cidade').value = '';
    document.getElementById('input-cidade').placeholder = pais ? 'Cidade' : 'Selecione o país primeiro';
  }

  async function cadastrar(ev) {
    ev.preventDefault();
    const f = ev.target;
    const nome     = f.nome.value.trim();
    const email    = f.email.value.trim().toLowerCase();
    const username = f.username.value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
    const pais     = f.pais.value.trim();
    const cidade   = f.cidade.value.trim();
    const senha    = f.senha.value;
    const conf     = f.confirmar.value;
    document.getElementById('erro-cadastro').classList.remove('show');

    if (!nome || !email || !username || !pais || !cidade || !senha) return mostrarErro('erro-cadastro', 'Preencha todos os campos.');
    if (username.length < 3)  return mostrarErro('erro-cadastro', 'Username deve ter pelo menos 3 caracteres.');
    if (!_usernameValido)     return mostrarErro('erro-cadastro', 'Escolha um username disponível.');
    if (senha.length < 6)     return mostrarErro('erro-cadastro', 'A senha precisa ter pelo menos 6 caracteres.');
    if (senha !== conf)       return mostrarErro('erro-cadastro', 'As senhas não conferem.');

    travar(f, true);
    try {
      const user = await RC.register(nome, email, senha, username, pais, cidade);
      showToast('Conta criada! Bora correr.');
      setTimeout(() => { window.location.href = 'index.html'; }, 600);
    } catch (e) {
      mostrarErro('erro-cadastro', e.message);
    } finally {
      travar(f, false);
    }
  }

  /* se já tiver sessão válida, pula a tela */
  if (RC.getToken() && RC.getUser()) {
    window.location.replace('index.html');
  }

  /* ── Toast ── */
  let _tt;
  function showToast(msg, tipo) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.toggle('err', tipo === 'err');
    t.classList.add('show');
    clearTimeout(_tt);
    _tt = setTimeout(() => t.classList.remove('show'), 2200);
  }

  /* ── Tema ── */
  try {
    if (localStorage.getItem('rc_theme') === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  } catch(e) {}
</script>
</body>
</html>
