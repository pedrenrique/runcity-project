<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RunCity — Mapa da Cidade</title>
  <link rel="stylesheet" href="libs/leaflet.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/mapa-cidade.css">
</head>
<body>

<div class="phone">

  <div class="shdr">
    <a class="back" href="index.html" title="Início">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5"/><path d="M12 5l-7 7 7 7"/>
      </svg>
    </a>
    <div class="shdr-title">MAPA DA CIDADE</div>
  </div>

  <div class="resumo">
    <div class="res-card">
      <div class="res-val" id="rTotalArea">0</div>
      <div class="res-lbl">m² dominados</div>
    </div>
    <div class="res-card">
      <div class="res-val" id="rTotalDonos">0</div>
      <div class="res-lbl">jogadores</div>
    </div>
    <div class="res-card">
      <div class="res-val" id="rTotalAreas">0</div>
      <div class="res-lbl">áreas</div>
    </div>
  </div>

  <div class="map-wrap">
    <div id="mapa"></div>
    <div class="legenda-flutua">
      <div class="legenda-titulo">Donos no mapa</div>
      <div id="legenda"></div>
    </div>
  </div>

  <nav class="nav">
    <a class="nit" href="index.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><div class="nlbl">Início</div></a>
    
    <a class="nit" href="lobby.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><div class="nlbl">Jogar</div></a>
    <a class="nit" href="ranking.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><div class="nlbl">Ranking</div></a>
    <a class="nit" href="perfil.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><div class="nlbl">Perfil</div></a>
  </nav>

</div>

<script src="libs/leaflet.js"></script>
<script src="auth.js"></script>
<script>
  RC.requerLogin();

  const params = new URLSearchParams(location.search);
  const focar = params.get('u'); // se vier ?u=X, dá zoom no território desse jogador

  // territórios mock — virão do backend depois
  const territorios = [
    {
      dono: 'Você', donoId: 'me', cor: '#7c5cfc', area: 4120,
      capturadoEm: '24 Mar 2026', regiao: 'Vila Madalena',
      coords: [
        [-19.9162, -43.9352],
        [-19.9159, -43.9344],
        [-19.9162, -43.9337],
        [-19.9168, -43.9338],
        [-19.9170, -43.9347],
        [-19.9166, -43.9354]
      ]
    },
    {
      dono: 'Mariana Rocha', donoId: 'u-mariana', cor: '#f97316', area: 3210,
      capturadoEm: '22 Mar 2026', regiao: 'Pampulha',
      coords: [
        [-19.9145, -43.9340],
        [-19.9140, -43.9332],
        [-19.9144, -43.9325],
        [-19.9152, -43.9329],
        [-19.9152, -43.9337]
      ],
      roubadoDe: 'Carlos Melo', roubadoEm: '20 Mar 2026'
    },
    {
      dono: 'Carlos Melo', donoId: 'u-carlos', cor: '#38bdf8', area: 2830,
      capturadoEm: '18 Mar 2026', regiao: 'Centro',
      coords: [
        [-19.9180, -43.9352],
        [-19.9176, -43.9347],
        [-19.9181, -43.9342],
        [-19.9186, -43.9348],
        [-19.9186, -43.9355]
      ]
    },
    {
      dono: 'Fernanda Dias', donoId: 'u-fernanda', cor: '#c084fc', area: 1980,
      capturadoEm: '15 Mar 2026', regiao: 'Savassi',
      coords: [
        [-19.9170, -43.9325],
        [-19.9165, -43.9318],
        [-19.9172, -43.9312],
        [-19.9178, -43.9320]
      ]
    },
    {
      dono: 'Luiza Neves', donoId: 'u-luiza', cor: '#2dd4bf', area: 1450,
      capturadoEm: '12 Mar 2026', regiao: 'Lourdes',
      coords: [
        [-19.9192, -43.9335],
        [-19.9188, -43.9328],
        [-19.9195, -43.9322],
        [-19.9200, -43.9332]
      ]
    },
    {
      dono: 'Você', donoId: 'me', cor: '#7c5cfc', area: 1820,
      capturadoEm: '10 Mar 2026', regiao: 'Funcionários',
      coords: [
        [-19.9155, -43.9362],
        [-19.9150, -43.9356],
        [-19.9156, -43.9350],
        [-19.9162, -43.9356]
      ],
      roubadoDe: 'Bruno Alves', roubadoEm: '08 Mar 2026'
    }
  ];

  const mapa = L.map('mapa', { zoomControl: true })
    .setView([-19.9170, -43.9342], 15);
  mapa.zoomControl.setPosition('bottomright');

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap, © CARTO',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(mapa);

  const polígonos = [];

  territorios.forEach((t, i) => {
    const poli = L.polygon(t.coords, {
      color: t.cor,
      weight: 2.5,
      fillColor: t.cor,
      fillOpacity: 0.32
    }).addTo(mapa);

    let html = `
      <div class="pop-titulo">${t.regiao}</div>
      <div class="pop-linha"><strong>Dono:</strong><span>${t.dono}</span></div>
      <div class="pop-linha"><strong>Área:</strong><span>${t.area.toLocaleString('pt-BR')} m²</span></div>
      <div class="pop-linha"><strong>Capturado:</strong><span>${t.capturadoEm}</span></div>
    `;
    if (t.roubadoDe) {
      html += `<div class="pop-roubo">⚡ Roubado de <strong>${t.roubadoDe}</strong> em ${t.roubadoEm}</div>`;
    }
    if (t.donoId !== 'me') {
      html += `<a class="pop-link" href="perfil.html?id=${encodeURIComponent(t.donoId)}">Ver perfil →</a>`;
    }

    poli.bindPopup(html);
    polígonos.push({ poli, t });
  });

  // resumo
  const totalArea = territorios.reduce((s, t) => s + t.area, 0);
  const donosUnicos = new Set(territorios.map(t => t.donoId)).size;
  document.getElementById('rTotalArea').textContent  = totalArea > 1000
    ? (totalArea / 1000).toFixed(1).replace('.', ',') + 'k'
    : totalArea.toLocaleString('pt-BR');
  document.getElementById('rTotalDonos').textContent = donosUnicos;
  document.getElementById('rTotalAreas').textContent = territorios.length;

  // legenda — agrega por dono
  const porDono = {};
  territorios.forEach(t => {
    if (!porDono[t.donoId]) porDono[t.donoId] = { dono: t.dono, cor: t.cor, area: 0 };
    porDono[t.donoId].area += t.area;
  });
  const ordenado = Object.values(porDono).sort((a, b) => b.area - a.area);
  document.getElementById('legenda').innerHTML = ordenado.slice(0, 5).map(d => `
    <div class="leg-item">
      <span class="leg-dot" style="background:${d.cor}"></span>
      <span class="leg-nome">${d.dono === 'Você' ? 'Você' : d.dono.split(' ')[0]}</span>
      <span class="leg-area">${(d.area/1000).toFixed(1).replace('.',',')}k</span>
    </div>
  `).join('');

  // se veio ?u=X, dá zoom nos polígonos desse dono
  if (focar) {
    const meus = polígonos.filter(p => p.t.donoId === focar);
    if (meus.length > 0) {
      const grupo = L.featureGroup(meus.map(p => p.poli));
      mapa.fitBounds(grupo.getBounds().pad(0.5));
      meus[0].poli.openPopup();
    }
  }

  try {
    if (localStorage.getItem('rc_theme') === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  } catch(e) {}
</script>

</body>
</html>
