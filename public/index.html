<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RunCity — Feed</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --p:#7c5cfc; --p-l:#a084fd; --p-ll:#c4b5fd; --p-d:#5b3fd8;
      --p-dim:rgba(124,92,252,.1); --p-mid:rgba(124,92,252,.22); --p-glow:rgba(124,92,252,.38);
      --gold:#e8a020; --ok:#22c55e; --err:#ef4444;
      --bg:#08061a; --c0:#100e24; --c1:#170f32; --brd:#231848; --brd2:#190e38;
      --t1:#ede8ff; --t2:#5e5280; --t3:#9488c0;
      --ff-d:'Bebas Neue',sans-serif; --ff-b:'Outfit',sans-serif;
    }
    [data-theme="light"] {
      --bg:#f8f7ff; --c0:#eeebff; --c1:#e4dfff; --brd:#cdc5f0; --brd2:#d8d0f8;
      --t1:#160f38; --t2:#6e60a0; --t3:#453880;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:#050410;font-family:var(--ff-b);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;}
    [data-theme="light"] body{background:#eae7f8;}

    /* PHONE */
    .phone{width:390px;height:844px;background:var(--bg);border-radius:46px;border:1.5px solid var(--brd);overflow:hidden;position:relative;box-shadow:0 0 0 1px rgba(124,92,252,.05),0 40px 100px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.04);animation:slideUp .5s cubic-bezier(.08,.82,.17,1) both;flex-shrink:0;}
    .pscroll{width:100%;height:100%;overflow-y:auto;overflow-x:hidden;}
    .pscroll::-webkit-scrollbar{width:2px;}
    .pscroll::-webkit-scrollbar-thumb{background:var(--brd);border-radius:2px;}
    .pbody{padding-bottom:84px;}

    /* HEADER */
    .hdr{
      display:flex;align-items:center;justify-content:space-between;
      padding:6px 20px 12px;
      position:sticky;top:0;z-index:50;
      background:var(--bg);border-bottom:1px solid var(--brd2);
      transition:background .3s;
    }
    @supports (backdrop-filter:blur(1px)){
      .hdr{backdrop-filter:blur(24px);background:color-mix(in srgb,var(--bg) 88%,transparent);}
    }
    .marca{font-family:var(--ff-d);font-size:24px;letter-spacing:2.5px;color:var(--t1);}
    .marca span{color:var(--p-l);}
    .hdr-actions{display:flex;align-items:center;gap:10px;}
    .notif-btn{
      width:36px;height:36px;border-radius:50%;background:var(--c0);border:1px solid var(--brd);
      display:flex;align-items:center;justify-content:center;color:var(--t2);
      cursor:pointer;transition:all .2s;position:relative;
    }
    .notif-btn:hover{border-color:var(--p-mid);color:var(--p-l);}
    .notif-dot{
      position:absolute;top:7px;right:7px;width:7px;height:7px;
      border-radius:50%;background:#ef4444;border:1.5px solid var(--bg);
      display:none;
    }
    .notif-panel{
      position:absolute;right:0;top:calc(100% + 8px);
      width:272px;background:var(--c1);border:1px solid var(--brd);
      border-radius:16px;z-index:200;overflow:hidden;
      box-shadow:0 12px 40px rgba(0,0,0,.6);
    }
    .notif-panel-hdr{
      padding:12px 16px 10px;font-size:10px;font-weight:800;
      color:var(--t2);letter-spacing:.8px;text-transform:uppercase;
      border-bottom:1px solid var(--brd2);display:flex;justify-content:space-between;align-items:center;
    }
    .notif-panel-hdr a{color:var(--p-l);cursor:pointer;font-size:10px;font-weight:700;letter-spacing:0;}
    .notif-item{padding:11px 16px;border-bottom:1px solid var(--brd2);font-size:12px;color:var(--t1);line-height:1.4;}
    .notif-item.nao-lida{background:var(--p-dim);}
    .notif-item-sub{font-size:10px;color:var(--t2);margin-top:3px;}
    .notif-vazia{padding:20px 16px;text-align:center;color:var(--t2);font-size:12px;}
    .hdr-actions{position:relative;}
    .notif-acoes{display:flex;gap:6px;margin-top:8px;}
    .notif-btn-aceitar{flex:1;padding:5px 0;border-radius:7px;border:none;background:var(--ok);color:#fff;font-size:11px;font-weight:700;cursor:pointer;font-family:var(--ff-b);}
    .notif-btn-recusar{flex:1;padding:5px 0;border-radius:7px;border:1px solid var(--brd);background:transparent;color:var(--t2);font-size:11px;font-weight:700;cursor:pointer;font-family:var(--ff-b);}
    .notif-btn-aceitar:hover{filter:brightness(1.1);}
    .notif-btn-recusar:hover{color:var(--err);border-color:var(--err);}

    /* BUSCA */
    .search-panel{position:absolute;right:0;top:calc(100% + 8px);width:300px;background:var(--c1);border:1px solid var(--brd);border-radius:16px;z-index:200;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.6);}
    .search-panel-hdr{padding:10px 12px;border-bottom:1px solid var(--brd2);display:flex;align-items:center;gap:8px;}
    .search-input{flex:1;background:var(--c0);border:1px solid var(--brd2);border-radius:8px;padding:7px 10px;font-size:12px;color:var(--t1);font-family:var(--ff-b);outline:none;transition:border-color .2s;}
    .search-input::placeholder{color:var(--t2);}
    .search-input:focus{border-color:var(--p-mid);}
    .search-results{max-height:280px;overflow-y:auto;}
    .search-results::-webkit-scrollbar{width:2px;}
    .search-results::-webkit-scrollbar-thumb{background:var(--brd);}
    .search-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--brd2);cursor:pointer;transition:background .15s;text-decoration:none;}
    .search-item:hover{background:var(--p-dim);}
    .search-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--ff-d);font-size:12px;border:2px solid;flex-shrink:0;}
    .search-info{flex:1;min-width:0;}
    .search-name{font-size:13px;font-weight:700;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .search-user{font-size:10px;color:var(--p-l);margin-top:1px;}
    .search-city{font-size:10px;color:var(--t2);margin-top:1px;}
    .search-add{width:26px;height:26px;border-radius:50%;background:transparent;border:1.5px solid var(--brd);color:var(--t2);font-size:16px;line-height:1;cursor:pointer;flex-shrink:0;transition:all .2s;display:flex;align-items:center;justify-content:center;padding:0;}
    .search-add:hover{border-color:var(--p-mid);color:var(--p-l);background:var(--p-dim);}
    .search-add:disabled{border-color:rgba(34,197,94,.3);color:var(--ok);cursor:default;}
    .search-vazia{padding:20px 16px;text-align:center;color:var(--t2);font-size:12px;}
    .av-link{
      width:36px;height:36px;border-radius:50%;background:var(--p-dim);border:2px solid var(--p);
      display:flex;align-items:center;justify-content:center;
      font-family:var(--ff-d);font-size:13px;color:var(--p-l);
      cursor:pointer;transition:all .2s;text-decoration:none;
    }
    .av-link:hover{box-shadow:0 0 14px var(--p-glow);transform:scale(1.06);}

    /* STORIES */
    .stories-wrap{padding:14px 20px 10px;}
    .stories-lbl{font-size:10px;font-weight:800;color:var(--t2);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;}
    .stories{display:flex;gap:14px;overflow-x:auto;padding-bottom:4px;}
    .stories::-webkit-scrollbar{display:none;}
    .story{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;flex-shrink:0;text-decoration:none;}
    .story-ring{
      width:54px;height:54px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      transition:transform .2s;
    }
    .story-ring.active{background:conic-gradient(var(--p) 0%,var(--p-l) 50%,var(--p) 100%);}
    .story-ring.inactive{background:var(--brd);}
    .story-ring.gold-ring{background:conic-gradient(var(--gold) 0%,#f5c842 60%,var(--gold) 100%);}
    .story:hover .story-ring{transform:scale(1.06);}
    .story-av{
      width:46px;height:46px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-family:var(--ff-d);font-size:15px;border:2px solid var(--bg);
    }
    .story-name{font-size:9px;font-weight:700;color:var(--t2);letter-spacing:.3px;max-width:54px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

    /* SECTION LABEL */
    .sec-lbl{padding:14px 20px 10px;font-size:10px;font-weight:800;color:var(--t2);letter-spacing:1.5px;text-transform:uppercase;}

    /* FEED CARD */
    .card{
      margin:0 0 14px;border-top:1px solid var(--brd2);border-bottom:1px solid var(--brd2);
      background:var(--bg);transition:background .3s;
      animation:fadeIn .4s ease both;
    }
    .card.mine{background:color-mix(in srgb,var(--p-dim) 40%,var(--bg));}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

    /* card header */
    .card-head{display:flex;align-items:center;gap:10px;padding:12px 20px 10px;}
    .card-av{
      width:40px;height:40px;border-radius:50%;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
      font-family:var(--ff-d);font-size:14px;border:2px solid;
    }
    .card-meta{flex:1;min-width:0;}
    .card-nome{font-size:14px;font-weight:700;color:var(--t1);display:flex;align-items:center;gap:6px;}
    .card-lv{font-size:9px;font-weight:800;padding:1px 6px;border-radius:4px;background:var(--p-dim);color:var(--p-ll);border:1px solid var(--p-mid);}
    .card-sub{font-size:11px;color:var(--t2);margin-top:2px;display:flex;align-items:center;gap:5px;}
    .card-tempo{font-size:11px;color:var(--t2);flex-shrink:0;}
    .badge{
      display:inline-flex;align-items:center;gap:4px;
      font-size:9px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
      padding:2px 8px;border-radius:5px;
    }
    .badge.partida{background:rgba(232,160,32,.12);color:var(--gold);border:1px solid rgba(232,160,32,.3);}

    /* route map */
    .card-map{
      width:100%;height:140px;
      background:var(--c0);
      position:relative;overflow:hidden;
    }
    .card-map svg{width:100%;height:100%;}
    .map-overlay{
      position:absolute;bottom:8px;left:12px;
      background:rgba(8,6,26,.75);backdrop-filter:blur(6px);
      border:1px solid var(--brd);border-radius:8px;
      padding:4px 10px;
      font-size:10px;font-weight:700;color:var(--t3);
      display:flex;align-items:center;gap:5px;
    }

    /* result banner */
    .card-result{
      padding:10px 20px 0;
      display:flex;align-items:center;gap:8px;
    }
    .result-badge{
      display:inline-flex;align-items:center;gap:5px;
      font-family:var(--ff-d);font-size:16px;letter-spacing:.8px;
    }
    .result-badge.gold{color:var(--gold);}
    .result-badge.silver{color:#8ca0b8;}
    .result-badge.bronze{color:#a0724a;}
    .result-badge.other{color:var(--t3);}
    .result-pts{
      margin-left:auto;font-size:11px;font-weight:700;
      color:var(--ok);background:rgba(34,197,94,.1);
      border:1px solid rgba(34,197,94,.25);border-radius:6px;
      padding:2px 8px;
    }

    /* stats row */
    .card-stats{
      display:grid;grid-template-columns:repeat(3,1fr);gap:0;
      padding:10px 20px 12px;border-bottom:1px solid var(--brd2);
    }
    .cs{text-align:center;position:relative;}
    .cs+.cs::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:1px;background:var(--brd2);}
    .cs-val{font-family:var(--ff-d);font-size:20px;letter-spacing:.5px;color:var(--t1);line-height:1;}
    .cs-lbl{font-size:9px;font-weight:700;color:var(--t2);margin-top:4px;letter-spacing:.6px;text-transform:uppercase;}

    /* reactions */
    .card-react{display:flex;align-items:center;gap:0;padding:8px 14px;}
    .react-btn{
      display:flex;align-items:center;gap:5px;
      padding:6px 10px;border-radius:8px;
      font-size:12px;font-weight:600;color:var(--t2);
      cursor:pointer;transition:all .18s;background:none;border:none;
      font-family:var(--ff-b);
    }
    .react-btn:hover{color:var(--p-l);background:var(--p-dim);}
    .react-btn.liked{color:var(--err);}
    .react-btn.liked svg{fill:var(--err);stroke:var(--err);}
    .react-sep{flex:1;}

    /* COMENTÁRIOS */
    .cmt-panel{border-top:1px solid var(--brd2);padding:0 0 4px;}
    .cmt-list{max-height:220px;overflow-y:auto;padding:8px 16px 0;}
    .cmt-list::-webkit-scrollbar{width:2px;}
    .cmt-list::-webkit-scrollbar-thumb{background:var(--brd);border-radius:2px;}
    .cmt-item{display:flex;gap:8px;margin-bottom:10px;}
    .cmt-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--ff-d);font-size:10px;border:1.5px solid;flex-shrink:0;}
    .cmt-body{flex:1;min-width:0;}
    .cmt-author{font-size:11px;font-weight:700;color:var(--p-l);}
    .cmt-text{font-size:12px;color:var(--t1);margin-top:2px;line-height:1.4;word-break:break-word;}
    .cmt-time{font-size:10px;color:var(--t2);margin-top:2px;}
    .cmt-vazia{text-align:center;color:var(--t2);font-size:12px;padding:16px 0;}
    .cmt-form{display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--brd2);}
    .cmt-input{flex:1;background:var(--c0);border:1.5px solid var(--brd2);border-radius:20px;padding:7px 14px;font-size:12px;color:var(--t1);font-family:var(--ff-b);outline:none;transition:border-color .2s;}
    .cmt-input::placeholder{color:var(--t2);}
    .cmt-input:focus{border-color:var(--p-mid);}
    .cmt-send{width:32px;height:32px;border-radius:50%;background:var(--p);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;flex-shrink:0;}
    .cmt-send:hover{background:var(--p-d);transform:scale(1.06);}
    .cmt-send:disabled{opacity:.5;cursor:default;transform:none;}
    .cmt-actions{display:flex;align-items:center;gap:4px;margin-top:4px;}
    .cmt-like-btn{display:flex;align-items:center;gap:3px;background:none;border:none;font-size:10px;font-weight:600;color:var(--t2);cursor:pointer;padding:2px 6px;border-radius:6px;font-family:var(--ff-b);transition:all .18s;}
    .cmt-like-btn:hover{color:var(--err);background:rgba(239,68,68,.08);}
    .cmt-like-btn.liked{color:var(--err);}
    .cmt-like-btn.liked svg{fill:var(--err);stroke:var(--err);}
    .cmt-act-btn{display:flex;align-items:center;background:none;border:none;font-size:10px;font-weight:600;color:var(--t2);cursor:pointer;padding:2px 6px;border-radius:6px;font-family:var(--ff-b);transition:all .18s;}
    .cmt-act-btn:hover{color:var(--p-l);background:var(--p-dim);}
    .cmt-act-btn.del:hover{color:var(--err);background:rgba(239,68,68,.08);}
    .cmt-edit-form{display:none;margin-top:6px;gap:6px;align-items:center;}
    .cmt-edit-form.show{display:flex;}
    .cmt-edit-input{flex:1;background:var(--c0);border:1.5px solid var(--p-mid);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--t1);font-family:var(--ff-b);outline:none;}
    .cmt-edit-save{padding:4px 12px;border-radius:8px;background:var(--p);border:none;color:#fff;font-size:11px;font-weight:700;cursor:pointer;font-family:var(--ff-b);}
    .cmt-edit-cancel{padding:4px 10px;border-radius:8px;background:transparent;border:1px solid var(--brd);color:var(--t2);font-size:11px;font-weight:700;cursor:pointer;font-family:var(--ff-b);}

    /* NAV */
    .nav{position:absolute;bottom:0;left:0;right:0;height:78px;background:var(--bg);border-top:1px solid var(--brd);display:flex;z-index:100;transition:background .3s,border-color .3s;}
    @supports (backdrop-filter:blur(1px)){.nav{backdrop-filter:blur(24px);background:color-mix(in srgb,var(--bg) 90%,transparent);}}
    .nit{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;transition:color .2s;color:var(--t2);position:relative;text-decoration:none;}
    .nit::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:2px;background:var(--p);border-radius:0 0 2px 2px;transition:width .22s;}
    .nit.active{color:var(--p-l);}
    .nit.active::after{width:22px;}
    .nit:hover{color:var(--t3);}
    .nlbl{font-size:9px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;}

    /* TOAST */
    .toast{position:fixed;bottom:36px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--c1);border:1px solid var(--p-mid);color:var(--p-ll);padding:10px 22px;border-radius:30px;font-size:12px;font-weight:600;z-index:9999;white-space:nowrap;pointer-events:none;opacity:0;transition:all .28s;box-shadow:0 8px 30px rgba(0,0,0,.5);}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

    @keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;}}
    @media (max-width:440px){.phone{width:100vw;height:100vh;border-radius:0;border:none;}body{padding:0;}}
  </style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="phone">
  <div class="pscroll">

    <!-- Status bar -->
    <!-- Header -->
    <div class="hdr">
      <div class="marca">RUN<span>CITY</span></div>
      <div class="hdr-actions">
        <!-- Busca -->
        <div class="notif-btn" id="searchBtn" onclick="toggleSearchPanel()" title="Buscar usuários">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </div>
        <div class="search-panel" id="searchPanel" style="display:none">
          <div class="search-panel-hdr">
            <input class="search-input" id="searchInput" type="text" placeholder="Buscar por nome ou @username" autocomplete="off" oninput="onSearchInput(this.value)">
          </div>
          <div class="search-results" id="searchResults">
            <div class="search-vazia">Digite para buscar</div>
          </div>
        </div>

        <div class="notif-btn" id="notifBtn" onclick="toggleNotifPanel()">
          <div class="notif-dot" id="notifDot"></div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 01-3.46 0"/>
          </svg>
        </div>
        <div class="notif-panel" id="notifPanel" style="display:none">
          <div class="notif-panel-hdr">
            Notificações
            <div style="display:flex;gap:10px;">
              <a onclick="marcarNotifLidas()">Marcar lidas</a>
              <a onclick="limparNotificacoes()" style="color:var(--err)">Limpar</a>
            </div>
          </div>
          <div id="notifList"><div class="notif-vazia">Carregando…</div></div>
        </div>
        <a class="av-link" href="perfil.html" id="avTopo" title="Meu perfil"></a>
      </div>
    </div>

    <div class="pbody">

      <!-- Stories — amigos que logaram hoje -->
      <div class="stories-wrap">
        <div class="stories-lbl">Ativos hoje</div>
        <div class="stories" id="storiesRow">
          <div style="color:var(--t2);font-size:11px;padding:18px 4px;">Carregando…</div>
        </div>
      </div>

      <!-- Feed label -->
      <div class="sec-lbl">Atividades recentes</div>

      <!-- CARDS — renderizados por JS -->
      <div id="feed"></div>

    </div>

    <!-- Nav -->
    <nav class="nav">
      <a class="nit active" href="index.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <div class="nlbl">Início</div>
      </a>
      <a class="nit" href="lobby.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <div class="nlbl">Jogar</div>
      </a>

function userColor(id) { return PALETTE[(id || 0) % PALETTE.length]; }

function fmtM2(v) {
  v = parseFloat(v) || 0;
  return v >= 1000 ? (v / 1000).toFixed(1) + 'k' : String(Math.round(v));
}

function tempoRelativo(isoStr) {
  const diff = (Date.now() - new Date(isoStr)) / 3600000;
  if (diff < 1)   return 'agora';
  if (diff < 24)  return Math.round(diff) + 'h atrás';
  if (diff < 48)  return 'ontem';
  return Math.round(diff / 24) + ' dias';
}

function fmtDuracao(seg) {
  const m = Math.floor(seg / 60), s = seg % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

  if(p===3) return '<span class="result-badge bronze">🥉 3º Lugar</span>';

}

function renderFeed(posts) {
  const feedEl = document.getElementById('feed');
  feedEl.innerHTML = '';
  if (!posts.length) {
    feedEl.innerHTML = '<p style="text-align:center;color:var(--t2);padding:40px 0;">Nenhuma corrida ainda. Seja o primeiro!</p>';
    return;
  }
  posts.forEach((p, i) => { feedEl.innerHTML += buildCard(p, i); });
}

/* converte resposta da API para o formato dos cards */
function apiParaPost(c, meId) {
  const nome    = c.nome || '';
  const iniciais = nome.trim().split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
  return {
    id:      c.id,
    user_id: c.user_id,
    uid:     iniciais,
    nome,
    lv:      c.nivel,
    local:   c.cidade || 'Brasil',
    tempo:   tempoRelativo(c.criada_em),
    pos:     c.posicao,
    area:    fmtM2(c.m2),
    km:      parseFloat(c.km).toFixed(1),
    dur:     fmtDuracao(parseInt(c.duracao)),
    likes:   c.curtidas || 0,
    liked:   !!c.curtida_por_mim,
    comentarios: c.comentarios || 0,
    pts:     '+' + (c.xp_ganho || 0) + ' XP',
    rota_svg: c.rota_svg || null,
    isMe:    c.user_id === meId,
  };
}

/* Toggle curtida — chama API se autenticado, senão só visual */
async function toggleLike(idx) {
  const post = POSTS[idx];
  const token = RC.getToken();
  const btn   = document.getElementById(`like-${idx}`);

  if (token && post.id) {
    const method = post.liked ? 'DELETE' : 'POST';
    try {
      const res = await fetch(`/api/corridas/${post.id}/curtir`, {
        method,
        headers: { Authorization: 'Bearer ' + token },
      });
      if (res.ok) {
        const data = await res.json();
        post.liked  = !post.liked;
        post.likes  = data.curtidas;
      }
    } catch {}
  } else {
    post.liked  = !post.liked;
    post.likes += post.liked ? 1 : -1;
  }

  btn.classList.toggle('liked', post.liked);
  document.getElementById(`like-count-${idx}`).textContent = post.likes;
}

/* Carrega o feed */
async function carregarFeed() {
  const meId  = RC.getUser()?.id ?? null;
  const token = RC.getToken();
  const headers = token ? { Authorization: 'Bearer ' + token } : {};

  try {
    const res = await fetch('/api/corridas/feed', { headers });
    if (res.ok) {
      const items = await res.json();
      if (items.length === 0 && token) {
        document.getElementById('feed').innerHTML = `
          <div style="text-align:center;padding:48px 24px 32px;">
            <div style="font-size:36px;margin-bottom:14px;">🏃</div>
            <div style="color:var(--t1);font-weight:700;font-size:15px;margin-bottom:8px;">Seu feed está vazio</div>
            <div style="color:var(--t2);font-size:13px;line-height:1.6;margin-bottom:20px;">Adicione amigos para ver as corridas deles aqui!</div>
            <a href="ranking.html" style="display:inline-block;padding:10px 24px;background:var(--p);color:#fff;border-radius:12px;font-size:13px;font-weight:700;text-decoration:none;">Descobrir corredores</a>
          </div>`;
        return;
      }
      POSTS = items.map(c => apiParaPost(c, meId));
      renderFeed(POSTS);
      return;
    }
  } catch {}

  if (!token) {
    // Sem login — exibe mock como demonstração
    POSTS = POSTS_MOCK;
    renderFeed(POSTS);
  } else {
    document.getElementById('feed').innerHTML =
      '<p style="text-align:center;color:var(--t2);padding:40px 0;">Erro ao carregar o feed. Tente novamente.</p>';
  }
}

/* Comentários */
const _cmtAbertos = new Set();

async function toggleComentarios(idx, corridaId) {
  const panel = document.getElementById(`cmt-panel-${idx}`);
  const aberto = _cmtAbertos.has(idx);
  if (aberto) {
    panel.style.display = 'none';
    _cmtAbertos.delete(idx);
  } else {
    panel.style.display = 'block';
    _cmtAbertos.add(idx);
    if (corridaId) await carregarComentarios(idx, corridaId);
  }
}

async function carregarComentarios(idx, corridaId) {
  const lista = document.getElementById(`cmt-list-${idx}`);
  lista.innerHTML = '<div class="cmt-vazia">Carregando…</div>';
  try {
    const token = RC.getToken();
    const meId  = RC.getUser()?.id ?? null;
    const headers = token ? { Authorization: 'Bearer ' + token } : {};
    const res = await fetch(`/api/corridas/${corridaId}/comentarios`, { headers });
    if (!res.ok) throw new Error();
    const cmts = await res.json();
    if (!cmts.length) {
      lista.innerHTML = '<div class="cmt-vazia">Nenhum comentário ainda. Seja o primeiro!</div>';
      return;
    }
    lista.innerHTML = cmts.map(c => {
      const ini    = (c.nome || '').trim().split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
      const cor    = userColor(c.user_id);
      const tempo  = tempoRelativo(c.criado_em);
      const isAutor = meId && c.user_id === meId;
      const curtido = !!c.curtido_por_mim;
      const nCurtidas = c.curtidas || 0;

      const likeBtn = `
        <button class="cmt-like-btn${curtido ? ' liked' : ''}"
                onclick="curtirComentario(${corridaId}, ${c.id}, this)"
                data-liked="${curtido}" data-count="${nCurtidas}">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="${curtido ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
          <span>${nCurtidas > 0 ? nCurtidas : ''}</span>
        </button>`;

      const autorBtns = isAutor ? `
        <button class="cmt-act-btn" onclick="iniciarEdicao(${c.id})" title="Editar">Editar</button>
        <button class="cmt-act-btn del" onclick="excluirComentario(${corridaId}, ${c.id}, ${idx})" title="Excluir">Excluir</button>` : '';

      return `
        <div class="cmt-item" id="cmt-item-${c.id}">
          <a href="perfil.html?user=${c.user_id}" style="text-decoration:none">
            <div class="cmt-av" style="background:${cor}18;color:${cor};border-color:${cor}50;">${ini}</div>
          </a>
          <div class="cmt-body">
            <div class="cmt-author">${c.nome}${c.username ? ' <span style="color:var(--t2);font-weight:400;">@'+c.username+'</span>' : ''}</div>
            <div class="cmt-text" id="cmt-text-${c.id}">${c.texto.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
            <div class="cmt-edit-form" id="cmt-edit-${c.id}">
              <input class="cmt-edit-input" id="cmt-edit-input-${c.id}" value="${c.texto.replace(/"/g,'&quot;')}" maxlength="300">
              <button class="cmt-edit-save" onclick="salvarEdicao(${corridaId}, ${c.id}, ${idx})">Salvar</button>
              <button class="cmt-edit-cancel" onclick="cancelarEdicao(${c.id})">✕</button>
            </div>
            <div class="cmt-actions">
              <span class="cmt-time">${tempo}</span>
              ${likeBtn}
              ${autorBtns}
            </div>
          </div>
        </div>`;
    }).join('');
    lista.scrollTop = lista.scrollHeight;
  } catch {
    lista.innerHTML = '<div class="cmt-vazia">Erro ao carregar comentários.</div>';
  }
}

async function curtirComentario(corridaId, cmtId, btn) {
  const token = RC.getToken();
  if (!token) { showToast('Faça login para curtir'); return; }

  const curtido = btn.dataset.liked === 'true';
  const method  = curtido ? 'DELETE' : 'POST';
  try {
    const res = await fetch(`/api/corridas/${corridaId}/comentarios/${cmtId}/curtir`, {
      method,
      headers: { Authorization: 'Bearer ' + token },
    });
    if (!res.ok) throw new Error();
    const data = await res.json();
    const novo = !curtido;
    btn.dataset.liked = String(novo);
    btn.classList.toggle('liked', novo);
    btn.querySelector('svg').setAttribute('fill', novo ? 'currentColor' : 'none');
    btn.querySelector('span').textContent = data.curtidas > 0 ? data.curtidas : '';
  } catch {
    showToast('Erro ao curtir');
  }
}

function iniciarEdicao(cmtId) {
  document.getElementById(`cmt-text-${cmtId}`).style.display = 'none';
  const form = document.getElementById(`cmt-edit-${cmtId}`);
  form.classList.add('show');
  document.getElementById(`cmt-edit-input-${cmtId}`).focus();
}

function cancelarEdicao(cmtId) {
  document.getElementById(`cmt-text-${cmtId}`).style.display = '';
  document.getElementById(`cmt-edit-${cmtId}`).classList.remove('show');
}

async function salvarEdicao(corridaId, cmtId, idx) {
  const token = RC.getToken();
  if (!token) return;
  const input = document.getElementById(`cmt-edit-input-${cmtId}`);
  const texto = input.value.trim();
  if (!texto) return;

  try {
    const res = await fetch(`/api/corridas/${corridaId}/comentarios/${cmtId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ texto }),
    });
    if (!res.ok) { showToast('Erro ao editar'); return; }
    const data = await res.json();
    document.getElementById(`cmt-text-${cmtId}`).textContent = data.texto;
    cancelarEdicao(cmtId);
  } catch {
    showToast('Sem conexão');
  }
}

async function excluirComentario(corridaId, cmtId, idx) {
  const token = RC.getToken();
  if (!token) return;
  try {
    const res = await fetch(`/api/corridas/${corridaId}/comentarios/${cmtId}`, {
      method: 'DELETE',
      headers: { Authorization: 'Bearer ' + token },
    });
    if (!res.ok) { showToast('Erro ao excluir'); return; }
    document.getElementById(`cmt-item-${cmtId}`)?.remove();
    // Decrementa contador
    const countEl = document.getElementById(`cmt-count-${idx}`);
    if (countEl) countEl.textContent = Math.max(0, parseInt(countEl.textContent || 0) - 1);
    showToast('Comentário removido.');
  } catch {
    showToast('Sem conexão');
  }
}

async function enviarComentario(idx, corridaId) {
  const token = RC.getToken();
  if (!token) { showToast('Faça login para comentar'); return; }
  if (!corridaId) return;

  const input = document.getElementById(`cmt-input-${idx}`);
  const texto = input.value.trim();
  if (!texto) return;

  const btn = input.nextElementSibling;
  btn.disabled = true;
  input.disabled = true;

  try {
    const res = await fetch(`/api/corridas/${corridaId}/comentarios`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ texto }),
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      showToast(d.erro || 'Erro ao comentar');
      return;
    }
    input.value = '';
    // Atualiza contador
    const countEl = document.getElementById(`cmt-count-${idx}`);
    if (countEl) countEl.textContent = parseInt(countEl.textContent || 0) + 1;
    // Recarrega lista
    await carregarComentarios(idx, corridaId);
  } catch {
    showToast('Sem conexão');
  } finally {
    btn.disabled = false;
    input.disabled = false;
    input.focus();
  }
}

/* Compartilhar */
/* Excluir atividade */
const _delConfirm = {};
async function excluirPost(idx) {
  const post = POSTS[idx];
  if (!post?.id) return;
  const now = Date.now();
  const btn = document.getElementById(`del-${idx}`);
  if (!_delConfirm[idx] || now - _delConfirm[idx] > 3000) {
    _delConfirm[idx] = now;
    if (btn) { btn.style.color = 'var(--err)'; btn.childNodes[btn.childNodes.length - 1].textContent = ' Confirmar?'; }
    showToast('Toque novamente para confirmar exclusão');
    setTimeout(() => {
      if (btn) { btn.style.color = 'var(--t2)'; btn.childNodes[btn.childNodes.length - 1].textContent = ' Excluir'; }
    }, 3000);
    return;
  }
  delete _delConfirm[idx];
  const token = RC.getToken();
  if (!token) return;
  try {
    const res = await fetch(`/api/corridas/${post.id}`, {
      method: 'DELETE',
      headers: { Authorization: 'Bearer ' + token },
    });
    if (res.ok) {
      document.querySelector(`[data-id="${post.id}"]`)?.remove();
      POSTS[idx] = null;
      showToast('Atividade removida');
    } else {
      showToast('Erro ao excluir');
    }
  } catch {
    showToast('Sem conexão');
  }
}

async function compartilhar(userId, nome, area) {
  const url = location.origin + '/perfil.html' + (userId ? '?user=' + userId : '');
  const text = `${nome} conquistou ${area} m² no RunCity!`;
  if (navigator.share) {
    try { await navigator.share({ title: 'RunCity', text, url }); return; } catch {}
  }
  try {
    await navigator.clipboard.writeText(url);
    showToast('Link copiado!');
  } catch {
    showToast('Não foi possível copiar o link');
  }
}

/* Busca */
let _searchAberto = false;
let _searchTimer  = null;

function toggleSearchPanel() {
  const panel = document.getElementById('searchPanel');
  _searchAberto = !_searchAberto;
  panel.style.display = _searchAberto ? 'block' : 'none';
  if (_searchAberto) {
    _notifAberto = false;
    document.getElementById('notifPanel').style.display = 'none';
    setTimeout(() => document.getElementById('searchInput').focus(), 50);
  }
}

function onSearchInput(val) {
  clearTimeout(_searchTimer);
  const q = val.trim();
  if (q.length < 2) {
    document.getElementById('searchResults').innerHTML = '<div class="search-vazia">Digite para buscar</div>';
    return;
  }
  document.getElementById('searchResults').innerHTML = '<div class="search-vazia">Buscando…</div>';
  _searchTimer = setTimeout(() => executarBusca(q), 350);
}

async function executarBusca(q) {
  const token = RC.getToken();
  if (!token) {
    document.getElementById('searchResults').innerHTML = '<div class="search-vazia">Faça login para buscar</div>';
    return;
  }
  try {
    const res = await fetch(`/api/users/buscar?q=${encodeURIComponent(q)}`, {
      headers: { Authorization: 'Bearer ' + token }
    });
    if (!res.ok) throw new Error();
    const users = await res.json();
    renderSearchResults(users);
  } catch {
    document.getElementById('searchResults').innerHTML = '<div class="search-vazia">Erro ao buscar</div>';
  }
}

function renderSearchResults(users) {
  const el = document.getElementById('searchResults');
  if (!users.length) {
    el.innerHTML = '<div class="search-vazia">Nenhum usuário encontrado</div>';
    return;
  }
  el.innerHTML = users.map(u => {
    const ini = u.nome.trim().split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
    const cor = userColor(u.id);
    const jaAmigo = u.amizade_status === 'aceite';
    const pendente = u.amizade_status === 'pendente' || u.amizade_status === 'enviado';
    const addBtn = jaAmigo
      ? `<button class="search-add" disabled title="Já são amigos" style="color:var(--ok);border-color:rgba(34,197,94,.3);">✓</button>`
      : pendente
        ? `<button class="search-add" disabled title="Pedido enviado" style="color:var(--t2);">…</button>`
        : `<button class="search-add" onclick="searchAddFriend(${u.id},this)" title="Adicionar amigo">+</button>`;
    return `
      <a class="search-item" href="perfil.html?user=${u.id}" onclick="toggleSearchPanel()">
        <div class="search-av" style="background:${cor}18;color:${cor};border-color:${cor}50;">${ini}</div>
        <div class="search-info">
          <div class="search-name">${u.nome}</div>
          <div class="search-user">@${u.username}</div>
          <div class="search-city">${(u.cidade || 'Brasil').split(',')[0]} · Nível ${u.nivel}</div>
        </div>
        ${addBtn}
      </a>`;
  }).join('');
}

async function searchAddFriend(id, btn) {
  const token = RC.getToken();
  if (!token) return;
  btn.disabled = true;
  btn.textContent = '…';
  try {
    const res = await fetch(`/api/amigos/${id}`, {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token }
    });
    if (res.ok) {
      btn.textContent = '✓';
      btn.style.color = 'var(--ok)';
      btn.style.borderColor = 'rgba(34,197,94,.3)';
      showToast('Pedido de amizade enviado!');
    } else {
      const d = await res.json().catch(() => ({}));
      showToast(d.erro || 'Erro ao enviar pedido');
      btn.disabled = false;
      btn.textContent = '+';
    }
  } catch {
    showToast('Sem conexão');
    btn.disabled = false;
    btn.textContent = '+';
  }
}

/* Notificações */
let _notifAberto = false;

function toggleNotifPanel() {
  const panel = document.getElementById('notifPanel');
  _notifAberto = !_notifAberto;
  panel.style.display = _notifAberto ? 'block' : 'none';
  if (_notifAberto) {
    _searchAberto = false;
    document.getElementById('searchPanel').style.display = 'none';
    carregarNotificacoes();
  }
}

document.addEventListener('click', e => {
  const sb = document.getElementById('searchBtn');
  const sp = document.getElementById('searchPanel');
  const nb = document.getElementById('notifBtn');
  const np = document.getElementById('notifPanel');
  if (_searchAberto && !sb.contains(e.target) && !sp.contains(e.target)) {
    _searchAberto = false;
    sp.style.display = 'none';
  }
  if (_notifAberto && !nb.contains(e.target) && !np.contains(e.target)) {
    _notifAberto = false;
    np.style.display = 'none';
  }
});

async function carregarNotificacoes() {
  const token = RC.getToken();
  const list  = document.getElementById('notifList');
  if (!token) {
    list.innerHTML = '<div class="notif-vazia">Faça login para ver notificações</div>';
    return;
  }
  try {
    const res = await fetch('/api/notificacoes', { headers: { Authorization: 'Bearer ' + token } });
    if (res.ok) {
      const { notificacoes, nao_lidas } = await res.json();
      document.getElementById('notifDot').style.display = nao_lidas > 0 ? 'block' : 'none';
      if (!notificacoes.length) {
        list.innerHTML = '<div class="notif-vazia">Nenhuma notificação ainda</div>';
        return;
      }
      list.innerHTML = notificacoes.map(n => {
        const acoes = (n.tipo === 'amizade_pedido' && n.ref_id)
          ? `<div class="notif-acoes">
               <button class="notif-btn-aceitar" onclick="responderAmizade(${n.ref_id}, 'aceitar', ${n.id}, this)">Aceitar</button>
               <button class="notif-btn-recusar" onclick="responderAmizade(${n.ref_id}, 'recusar', ${n.id}, this)">Recusar</button>
             </div>`
          : '';
        return `
          <div class="notif-item${n.lida ? '' : ' nao-lida'}" id="notif-${n.id}">
            ${n.mensagem}
            ${acoes}
            <div class="notif-item-sub">${new Date(n.criado_em).toLocaleDateString('pt-BR', { day:'2-digit', month:'short' })}</div>
          </div>`;
      }).join('');
      return;
    }
  } catch {}
  list.innerHTML = '<div class="notif-vazia">Nenhuma notificação ainda</div>';
}

async function responderAmizade(solicitanteId, acao, notifId, btn) {
  const token = RC.getToken();
  if (!token) return;
  btn.closest('.notif-acoes').querySelectorAll('button').forEach(b => b.disabled = true);
  try {
    if (acao === 'aceitar') {
      const res = await fetch(`/api/amigos/${solicitanteId}/aceitar`, {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + token },
      });
      if (!res.ok) throw new Error();
      showToast('Amizade aceita!');
    } else {
      const res = await fetch(`/api/amigos/${solicitanteId}`, {
        method: 'DELETE',
        headers: { Authorization: 'Bearer ' + token },
      });
      if (!res.ok) throw new Error();
      showToast('Pedido recusado.');
    }
    const item = document.getElementById(`notif-${notifId}`);
    if (item) {
      item.querySelector('.notif-acoes')?.remove();
      item.classList.remove('nao-lida');
    }
  } catch {
    showToast('Erro ao processar. Tente novamente.');
    btn.closest('.notif-acoes').querySelectorAll('button').forEach(b => b.disabled = false);
  }
}

async function limparNotificacoes() {
  const token = RC.getToken();
  if (!token) return;
  try {
    await fetch('/api/notificacoes', { method:'DELETE', headers:{ Authorization:'Bearer '+token } });
    document.getElementById('notifList').innerHTML = '<div class="notif-vazia">Nenhuma notificação ainda</div>';
    document.getElementById('notifDot').style.display = 'none';
  } catch {}
}

async function marcarNotifLidas() {
  const token = RC.getToken();
  if (!token) return;
  try {
    await fetch('/api/notificacoes/ler', { method:'PATCH', headers:{ Authorization:'Bearer '+token } });
    document.getElementById('notifDot').style.display = 'none';
    document.querySelectorAll('.notif-item.nao-lida').forEach(el => el.classList.remove('nao-lida'));
  } catch {}
}

async function initNotifDot() {
  const token = RC.getToken();
  if (!token) return;
  try {
    const res = await fetch('/api/notificacoes', { headers: { Authorization: 'Bearer ' + token } });
    if (res.ok) {
      const { nao_lidas } = await res.json();
      if (nao_lidas > 0) document.getElementById('notifDot').style.display = 'block';
    }
  } catch {}
}

/* Amigos ativos hoje */
async function carregarAmigosAtivos() {
  const row   = document.getElementById('storiesRow');
  const token = RC.getToken();
  const meId  = RC.getUser()?.id ?? null;

  if (!token) {
    row.innerHTML = '<div style="color:var(--t2);font-size:11px;padding:18px 4px;">Faça login para ver amigos ativos</div>';
    return;
  }

  try {
    const res = await fetch('/api/amigos/ativos', {
      headers: { Authorization: 'Bearer ' + token }
    });

    if (!res.ok) throw new Error();

    const amigos = await res.json();

    if (!amigos.length) {
      row.innerHTML = '<div style="color:var(--t2);font-size:11px;padding:18px 4px;">Nenhum amigo ativo hoje ainda</div>';
      return;
    }

    row.innerHTML = amigos.map(a => {
      const nome   = a.nome || '';
      const ini    = nome.trim().split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
      const cor    = userColor(a.id);
      const isMe   = a.id === meId;
      // Último login nas últimas 2h = anel roxo ativo; antes disso = ouro; o próprio user = gold
      const mins   = (Date.now() - new Date(a.ultimo_login)) / 60000;
      const ringCls = isMe ? 'gold-ring' : (mins <= 120 ? 'active' : 'gold-ring');
      return `
        <a class="story" href="perfil.html?user=${a.id}">
          <div class="story-ring ${ringCls}">
            <div class="story-av" style="background:${cor}18;color:${cor};border-color:${cor}40;">${ini}</div>
          </div>
          <div class="story-name">${nome.split(' ')[0]}</div>
        </a>`;
    }).join('');

  } catch {
    row.innerHTML = '<div style="color:var(--t2);font-size:11px;padding:18px 4px;">Não foi possível carregar</div>';
  }
}
