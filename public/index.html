<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RunCity — Feed</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --p:#7c5cfc; --p-l:#a084fd; --p-ll:#c4b5fd; --p-d:#5b3fd8;
      --p-dim:rgba(124,92,252,.1); --p-mid:rgba(124,92,252,.22); --p-glow:rgba(124,92,252,.38);
      --gold:#e8a020; --ok:#22c55e; --err:#ef4444;
      --bg:#08061a; --c0:#100e24; --c1:#170f32; --brd:#231848; --brd2:#190e38;
      --t1:#ede8ff; --t2:#5e5280; --t3:#9488c0;
      --ff-d:'Bebas Neue',sans-serif; --ff-b:'Outfit',sans-serif;
    }
    [data-theme="light"] {
      --bg:#f8f7ff; --c0:#eeebff; --c1:#e4dfff; --brd:#cdc5f0; --brd2:#d8d0f8;
      --t1:#160f38; --t2:#6e60a0; --t3:#453880;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:#050410;font-family:var(--ff-b);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;}
    [data-theme="light"] body{background:#eae7f8;}

    /* PHONE */
    .phone{width:390px;height:844px;background:var(--bg);border-radius:46px;border:1.5px solid var(--brd);overflow:hidden;position:relative;box-shadow:0 0 0 1px rgba(124,92,252,.05),0 40px 100px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.04);animation:slideUp .5s cubic-bezier(.08,.82,.17,1) both;flex-shrink:0;}
    .pscroll{width:100%;height:100%;overflow-y:auto;overflow-x:hidden;}
    .pscroll::-webkit-scrollbar{width:2px;}
    .pscroll::-webkit-scrollbar-thumb{background:var(--brd);border-radius:2px;}
    .pbody{padding-bottom:84px;}

    /* STATUS BAR */
    .sbar{display:flex;justify-content:space-between;align-items:center;padding:14px 24px 6px;color:var(--t1);}
    .sbar-time{font-size:15px;font-weight:700;}
    .sbar-right{display:flex;align-items:center;gap:6px;}

    /* HEADER */
    .hdr{
      display:flex;align-items:center;justify-content:space-between;
      padding:6px 20px 12px;
      position:sticky;top:0;z-index:50;
      background:var(--bg);border-bottom:1px solid var(--brd2);
      transition:background .3s;
    }
    @supports (backdrop-filter:blur(1px)){
      .hdr{backdrop-filter:blur(24px);background:color-mix(in srgb,var(--bg) 88%,transparent);}
    }
    .marca{font-family:var(--ff-d);font-size:24px;letter-spacing:2.5px;color:var(--t1);}
    .marca span{color:var(--p-l);}
    .hdr-actions{display:flex;align-items:center;gap:10px;}
    .notif-btn{
      width:36px;height:36px;border-radius:50%;background:var(--c0);border:1px solid var(--brd);
      display:flex;align-items:center;justify-content:center;color:var(--t2);
      cursor:pointer;transition:all .2s;position:relative;
    }
    .notif-btn:hover{border-color:var(--p-mid);color:var(--p-l);}
    .notif-dot{
      position:absolute;top:7px;right:7px;width:7px;height:7px;
      border-radius:50%;background:#ef4444;border:1.5px solid var(--bg);
    }
    .av-link{
      width:36px;height:36px;border-radius:50%;background:var(--p-dim);border:2px solid var(--p);
      display:flex;align-items:center;justify-content:center;
      font-family:var(--ff-d);font-size:13px;color:var(--p-l);
      cursor:pointer;transition:all .2s;text-decoration:none;
    }
    .av-link:hover{box-shadow:0 0 14px var(--p-glow);transform:scale(1.06);}

    /* STORIES */
    .stories-wrap{padding:14px 20px 10px;}
    .stories-lbl{font-size:10px;font-weight:800;color:var(--t2);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;}
    .stories{display:flex;gap:14px;overflow-x:auto;padding-bottom:4px;}
    .stories::-webkit-scrollbar{display:none;}
    .story{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;flex-shrink:0;text-decoration:none;}
    .story-ring{
      width:54px;height:54px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      transition:transform .2s;
    }
    .story-ring.active{background:conic-gradient(var(--p) 0%,var(--p-l) 50%,var(--p) 100%);}
    .story-ring.inactive{background:var(--brd);}
    .story-ring.gold-ring{background:conic-gradient(var(--gold) 0%,#f5c842 60%,var(--gold) 100%);}
    .story:hover .story-ring{transform:scale(1.06);}
    .story-av{
      width:46px;height:46px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-family:var(--ff-d);font-size:15px;border:2px solid var(--bg);
    }
    .story-name{font-size:9px;font-weight:700;color:var(--t2);letter-spacing:.3px;max-width:54px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

    /* SECTION LABEL */
    .sec-lbl{padding:14px 20px 10px;font-size:10px;font-weight:800;color:var(--t2);letter-spacing:1.5px;text-transform:uppercase;}

    /* FEED CARD */
    .card{
      margin:0 0 14px;border-top:1px solid var(--brd2);border-bottom:1px solid var(--brd2);
      background:var(--bg);transition:background .3s;
      animation:fadeIn .4s ease both;
    }
    .card.mine{background:color-mix(in srgb,var(--p-dim) 40%,var(--bg));}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

    /* card header */
    .card-head{display:flex;align-items:center;gap:10px;padding:12px 20px 10px;}
    .card-av{
      width:40px;height:40px;border-radius:50%;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
      font-family:var(--ff-d);font-size:14px;border:2px solid;
    }
    .card-meta{flex:1;min-width:0;}
    .card-nome{font-size:14px;font-weight:700;color:var(--t1);display:flex;align-items:center;gap:6px;}
    .card-lv{font-size:9px;font-weight:800;padding:1px 6px;border-radius:4px;background:var(--p-dim);color:var(--p-ll);border:1px solid var(--p-mid);}
    .card-sub{font-size:11px;color:var(--t2);margin-top:2px;display:flex;align-items:center;gap:5px;}
    .card-tempo{font-size:11px;color:var(--t2);flex-shrink:0;}
    .badge{
      display:inline-flex;align-items:center;gap:4px;
      font-size:9px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
      padding:2px 8px;border-radius:5px;
    }
    .badge.partida{background:rgba(232,160,32,.12);color:var(--gold);border:1px solid rgba(232,160,32,.3);}

    /* route map */
    .card-map{
      width:100%;height:140px;
      background:var(--c0);
      position:relative;overflow:hidden;
    }
    .card-map svg{width:100%;height:100%;}
    .map-overlay{
      position:absolute;bottom:8px;left:12px;
      background:rgba(8,6,26,.75);backdrop-filter:blur(6px);
      border:1px solid var(--brd);border-radius:8px;
      padding:4px 10px;
      font-size:10px;font-weight:700;color:var(--t3);
      display:flex;align-items:center;gap:5px;
    }

    /* result banner */
    .card-result{
      padding:10px 20px 0;
      display:flex;align-items:center;gap:8px;
    }
    .result-badge{
      display:inline-flex;align-items:center;gap:5px;
      font-family:var(--ff-d);font-size:16px;letter-spacing:.8px;
    }
    .result-badge.gold{color:var(--gold);}
    .result-badge.silver{color:#8ca0b8;}
    .result-badge.bronze{color:#a0724a;}
    .result-badge.other{color:var(--t3);}
    .result-pts{
      margin-left:auto;font-size:11px;font-weight:700;
      color:var(--ok);background:rgba(34,197,94,.1);
      border:1px solid rgba(34,197,94,.25);border-radius:6px;
      padding:2px 8px;
    }

    /* stats row */
    .card-stats{
      display:grid;grid-template-columns:repeat(3,1fr);gap:0;
      padding:10px 20px 12px;border-bottom:1px solid var(--brd2);
    }
    .cs{text-align:center;position:relative;}
    .cs+.cs::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:1px;background:var(--brd2);}
    .cs-val{font-family:var(--ff-d);font-size:20px;letter-spacing:.5px;color:var(--t1);line-height:1;}
    .cs-lbl{font-size:9px;font-weight:700;color:var(--t2);margin-top:4px;letter-spacing:.6px;text-transform:uppercase;}

    /* reactions */
    .card-react{display:flex;align-items:center;gap:0;padding:8px 14px;}
    .react-btn{
      display:flex;align-items:center;gap:5px;
      padding:6px 10px;border-radius:8px;
      font-size:12px;font-weight:600;color:var(--t2);
      cursor:pointer;transition:all .18s;background:none;border:none;
      font-family:var(--ff-b);
    }
    .react-btn:hover{color:var(--p-l);background:var(--p-dim);}
    .react-btn.liked{color:var(--err);}
    .react-btn.liked svg{fill:var(--err);stroke:var(--err);}
    .react-sep{flex:1;}

    /* NAV */
    .nav{position:absolute;bottom:0;left:0;right:0;height:78px;background:var(--bg);border-top:1px solid var(--brd);display:flex;z-index:100;transition:background .3s,border-color .3s;}
    @supports (backdrop-filter:blur(1px)){.nav{backdrop-filter:blur(24px);background:color-mix(in srgb,var(--bg) 90%,transparent);}}
    .nit{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;transition:color .2s;color:var(--t2);position:relative;text-decoration:none;}
    .nit::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:2px;background:var(--p);border-radius:0 0 2px 2px;transition:width .22s;}
    .nit.active{color:var(--p-l);}
    .nit.active::after{width:22px;}
    .nit:hover{color:var(--t3);}
    .nlbl{font-size:9px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;}

    /* TOAST */
    .toast{position:fixed;bottom:36px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--c1);border:1px solid var(--p-mid);color:var(--p-ll);padding:10px 22px;border-radius:30px;font-size:12px;font-weight:600;z-index:9999;white-space:nowrap;pointer-events:none;opacity:0;transition:all .28s;box-shadow:0 8px 30px rgba(0,0,0,.5);}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

    @keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;}}
    @media (max-width:440px){.phone{width:100vw;height:100vh;border-radius:0;border:none;}body{padding:0;}}
  </style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="phone">

    <!-- Header -->

  </div>
</div>

function posLabel(p){
  if(p===1) return '<span class="result-badge gold">🥇 1º Lugar</span>';
  if(p===2) return '<span class="result-badge silver">🥈 2º Lugar</span>';
  if(p===3) return '<span class="result-badge bronze">🥉 3º Lugar</span>';
  return `<span class="result-badge other">${p}º Lugar</span>`;
}

function buildCard(post, idx){
  const c = AV_C[post.uid]||'#a084fd';
  const isMe = post.isMe;
  return `
  <div class="card${isMe?' mine':''}" style="animation-delay:${idx*80}ms">
    <div class="card-head">
      <a href="perfil.html?user=${post.uid}" style="text-decoration:none">
        <div class="card-av" style="background:${c}18;color:${c};border-color:${c}50;">${post.uid}</div>
      </a>
      <div class="card-meta">
        <div class="card-nome">
          <a href="perfil.html?user=${post.uid}" style="color:inherit;text-decoration:none">${post.nome}</a>
          ${isMe?'<span class="card-lv">Você</span>':'<span class="card-lv">Nv '+post.lv+'</span>'}
        </div>
        <div class="card-sub">
          ${locIco}
          ${post.local}
          &nbsp;·&nbsp;
          <span class="badge partida">Partida</span>
        </div>
      </div>
      <div class="card-tempo">${post.tempo}</div>
    </div>

    <!-- Mapa da rota -->
    <div class="card-map">
      ${ROTAS[post.uid]||ROTAS['JS']}
      <div class="map-overlay">
        ${locIco} ${post.local.split(',')[0]}
      </div>
    </div>

    <!-- Resultado -->
    <div class="card-result">
      ${posLabel(post.pos)}
      <span class="result-pts">${post.pts}</span>
    </div>

    <!-- Stats -->
    <div class="card-stats">
      <div class="cs">
        <div class="cs-val">${post.area}</div>
        <div class="cs-lbl">m² área</div>
      </div>
      <div class="cs">
        <div class="cs-val">${post.km} km</div>
        <div class="cs-lbl">distância</div>
      </div>
      <div class="cs">
        <div class="cs-val">${post.dur}</div>
        <div class="cs-lbl">tempo</div>
      </div>
    </div>

    <!-- Reações -->
    <div class="card-react">
      <button class="react-btn" id="like-${idx}" onclick="toggleLike(${idx})">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
        <span id="like-count-${idx}">${post.likes}</span>
      </button>
      <button class="react-btn" onclick="showToast('Comentários em breve!')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        ${post.coms}
      </button>
      <div class="react-sep"></div>
      <button class="react-btn" onclick="showToast('Link copiado!')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        Compartilhar
      </button>
    </div>
  </div>`;
}

/* Renderiza feed */
const feedEl = document.getElementById('feed');
POSTS.forEach((p,i) => { feedEl.innerHTML += buildCard(p,i); });

/* Toggle curtida */
function toggleLike(idx){
  const post = POSTS[idx];
  post.liked = !post.liked;
  post.likes += post.liked ? 1 : -1;
  const btn = document.getElementById(`like-${idx}`);
  btn.classList.toggle('liked', post.liked);
  document.getElementById(`like-count-${idx}`).textContent = post.likes;
}

/* Toast */
let _tt;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(_tt); _tt=setTimeout(()=>t.classList.remove('show'),2200);
}

/* Relógio */
function tick(){
  const d=new Date();
  document.getElementById('relogio').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
tick(); setInterval(tick,30000);

try{ if(localStorage.getItem('rc_theme')==='light') document.documentElement.setAttribute('data-theme','light'); }catch(e){}
</script>
