<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RunCity — Feed</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>

<div class="toast" id="toast"></div>

<div class="phone">
  <div class="pscroll">

    <!-- Status bar -->
    <!-- Header -->
    <div class="hdr">
      <div class="marca">RUN<span>CITY</span></div>
      <div class="hdr-actions">
        <!-- Busca -->
        <div class="notif-btn" id="searchBtn" onclick="toggleSearchPanel()" title="Buscar usuários">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </div>
        <div class="search-panel" id="searchPanel" style="display:none">
          <div class="search-panel-hdr">
            <input class="search-input" id="searchInput" type="text" placeholder="Buscar por nome ou @username" autocomplete="off" oninput="onSearchInput(this.value)">
          </div>
          <div class="search-results" id="searchResults">
            <div class="search-vazia">Digite para buscar</div>
          </div>
        </div>

        <div class="notif-btn" id="notifBtn" onclick="toggleNotifPanel()">
          <div class="notif-dot" id="notifDot"></div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 01-3.46 0"/>
          </svg>
        </div>
        <div class="notif-panel" id="notifPanel" style="display:none">
          <div class="notif-panel-hdr">
            Notificações
            <div style="display:flex;gap:10px;">
              <a onclick="marcarNotifLidas()">Marcar lidas</a>
              <a onclick="limparNotificacoes()" style="color:var(--err)">Limpar</a>
            </div>
          </div>
          <div id="notifList"><div class="notif-vazia">Carregando…</div></div>
        </div>
        <a class="av-link" href="perfil.html" id="avTopo" title="Meu perfil"></a>
      </div>
    </div>

    <div class="pbody">

      <!-- Stories — amigos que logaram hoje -->
      <div class="stories-wrap">
        <div class="stories-lbl">Ativos hoje</div>
        <div class="stories" id="storiesRow">
          <div style="color:var(--t2);font-size:11px;padding:18px 4px;">Carregando…</div>
        </div>
      </div>

      <!-- Feed label -->
      <div class="sec-lbl">Atividades recentes</div>

      <!-- CARDS — renderizados por JS -->
      <div id="feed"></div>

    </div>

    <!-- Nav -->
    <nav class="nav">
      <a class="nit active" href="index.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <div class="nlbl">Início</div>
      </a>
      <a class="nit" href="lobby.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <div class="nlbl">Jogar</div>
      </a>
      <a class="nit" href="ranking.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <div class="nlbl">Ranking</div>
      </a>
      <a class="nit" href="perfil.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <div class="nlbl">Perfil</div>
      </a>
    </nav>

  </div>
</div>

<script src="auth.js"></script>
<script>
/* ── DADOS DO FEED ── */
const AV_C = {
  AC:'#e8a020', JS:'#a084fd', TB:'#38bdf8',
  PL:'#fb923c', CM:'#c084fc', FG:'#f97316', LP:'#2dd4bf'
};


const locIco = `<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>`;

/* ── HELPERS ── */
const PALETTE = ['#a084fd','#e8a020','#fb923c','#38bdf8','#c084fc','#f97316','#2dd4bf','#ef4444','#f472b6','#22c55e'];
function userColor(id) { return PALETTE[(id || 0) % PALETTE.length]; }

function fmtM2(v) {
  v = parseFloat(v) || 0;
  return v >= 1000 ? (v / 1000).toFixed(1) + 'k' : String(Math.round(v));
}

function tempoRelativo(isoStr) {
  const diff = (Date.now() - new Date(isoStr)) / 3600000;
  if (diff < 1)   return 'agora';
  if (diff < 24)  return Math.round(diff) + 'h atrás';
  if (diff < 48)  return 'ontem';
  return Math.round(diff / 24) + ' dias';
}

function fmtDuracao(seg) {
  const m = Math.floor(seg / 60), s = seg % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

/* Posts armazenados (API ou mock) */
let POSTS = [];

function posLabel(p){
  if(p===1) return '<span class="result-badge gold">🥇 1º Lugar</span>';
  if(p===2) return '<span class="result-badge silver">🥈 2º Lugar</span>';
  if(p===3) return '<span class="result-badge bronze">🥉 3º Lugar</span>';
  return `<span class="result-badge other">${p}º Lugar</span>`;
}

function buildCard(post, idx){
  const c    = AV_C[post.uid] || userColor(post.user_id);
  const isMe = !!post.isMe;
  const href = post.user_id ? `perfil.html?user=${post.user_id}` : `perfil.html?user=${post.uid}`;
  const mapa = post.rota_svg || '';
  return `
  <div class="card${isMe?' mine':''}" style="animation-delay:${idx*80}ms" data-id="${post.id||''}">
    <div class="card-head">
      <a href="${href}" style="text-decoration:none">
        <div class="card-av" style="background:${c}18;color:${c};border-color:${c}50;">${post.uid}</div>
      </a>
      <div class="card-meta">
        <div class="card-nome">
          <a href="${href}" style="color:inherit;text-decoration:none">${post.nome}</a>
          ${isMe?'<span class="card-lv">Você</span>':'<span class="card-lv">Nv '+post.lv+'</span>'}
        </div>
        <div class="card-sub">
          ${locIco}
          ${post.local}
          &nbsp;·&nbsp;
          <span class="badge partida">Partida</span>
        </div>
      </div>
      <div class="card-tempo">${post.tempo}</div>
    </div>

    <div class="card-map">
      ${mapa}
      <div class="map-overlay">${locIco} ${post.local.split(',')[0]}</div>
    </div>

    <div class="card-result">
      ${posLabel(post.pos)}
      <span class="result-pts">${post.pts}</span>
    </div>

    <div class="card-stats">
      <div class="cs"><div class="cs-val">${post.area}</div><div class="cs-lbl">m² área</div></div>
      <div class="cs"><div class="cs-val">${post.km} km</div><div class="cs-lbl">distância</div></div>
      <div class="cs"><div class="cs-val">${post.dur}</div><div class="cs-lbl">tempo</div></div>
    </div>

    <div class="card-react">
      <button class="react-btn${post.liked?' liked':''}" id="like-${idx}" onclick="toggleLike(${idx})">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="${post.liked?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
        <span id="like-count-${idx}">${post.likes}</span>
      </button>
      <button class="react-btn" id="cmtBtn-${idx}" onclick="toggleComentarios(${idx}, ${post.id || 0})">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        <span id="cmt-count-${idx}">${post.comentarios || 0}</span>
      </button>
      <div class="react-sep"></div>
      <button class="react-btn" onclick="compartilhar(${post.user_id || 0}, '${post.nome.replace(/'/g, "\\'")}', '${post.area}')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        Compartilhar
      </button>
      ${isMe && post.id ? `<button class="react-btn" id="del-${idx}" onclick="excluirPost(${idx})" style="color:var(--t2);">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        Excluir
      </button>` : ''}
    </div>
    <div class="cmt-panel" id="cmt-panel-${idx}" style="display:none">
      <div class="cmt-list" id="cmt-list-${idx}">
        <div class="cmt-vazia">Carregando…</div>
      </div>
      <div class="cmt-form">
        <input class="cmt-input" id="cmt-input-${idx}" type="text" placeholder="Escreva um comentário…" maxlength="300" onkeydown="if(event.key==='Enter')enviarComentario(${idx},${post.id || 0})">
        <button class="cmt-send" onclick="enviarComentario(${idx}, ${post.id || 0})" title="Enviar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </div>`;
}

function renderFeed(posts) {
  const feedEl = document.getElementById('feed');
  feedEl.innerHTML = '';
  if (!posts.length) {
    feedEl.innerHTML = '<p style="text-align:center;color:var(--t2);padding:40px 0;">Nenhuma corrida ainda. Seja o primeiro!</p>';
    return;
  }
  posts.forEach((p, i) => { feedEl.innerHTML += buildCard(p, i); });
}

/* converte resposta da API para o formato dos cards */
function apiParaPost(c, meId) {
  const nome    = c.nome || '';
  const iniciais = nome.trim().split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
  return {
    id:      c.id,
    user_id: c.user_id,
    uid:     iniciais,
    nome,
    lv:      c.nivel,
    local:   c.cidade || 'Brasil',
    tempo:   tempoRelativo(c.criada_em),
    pos:     c.posicao,
    area:    fmtM2(c.m2),
    km:      parseFloat(c.km).toFixed(1),
    dur:     fmtDuracao(parseInt(c.duracao)),
    likes:   c.curtidas || 0,
    liked:   !!c.curtida_por_mim,
    comentarios: c.comentarios || 0,
    pts:     '+' + (c.xp_ganho || 0) + ' XP',
    rota_svg: c.rota_svg || null,
    isMe:    c.user_id === meId,
  };
}

/* Toggle curtida — chama API se autenticado, senão só visual */
async function toggleLike(idx) {
  const post = POSTS[idx];
  const token = RC.getToken();
  const btn   = document.getElementById(`like-${idx}`);

  if (token && post.id) {
    const method = post.liked ? 'DELETE' : 'POST';
    try {
      const res = await fetch(`/api/corridas/${post.id}/curtir`, {
        method,
        headers: { Authorization: 'Bearer ' + token },
      });
      if (res.ok) {
        const data = await res.json();
        post.liked  = !post.liked;
        post.likes  = data.curtidas;
      }
    } catch {}
  } else {
    post.liked  = !post.liked;
    post.likes += post.liked ? 1 : -1;
  }

  btn.classList.toggle('liked', post.liked);
  document.getElementById(`like-count-${idx}`).textContent = post.likes;
}


/* Carrega o feed */
async function carregarFeed() {
  const meId  = RC.getUser()?.id ?? null;
  const token = RC.getToken();
  const headers = token ? { Authorization: 'Bearer ' + token } : {};

  try {
    const res = await fetch('/api/corridas/feed', { headers });
    if (res.ok) {
      const items = await res.json();
      if (items.length === 0 && token) {
        document.getElementById('feed').innerHTML = `
          <div style="text-align:center;padding:48px 24px 32px;">
            <div style="font-size:36px;margin-bottom:14px;">🏃</div>
            <div style="color:var(--t1);font-weight:700;font-size:15px;margin-bottom:8px;">Seu feed está vazio</div>
            <div style="color:var(--t2);font-size:13px;line-height:1.6;margin-bottom:20px;">Adicione amigos para ver as corridas deles aqui!</div>
            <a href="ranking.html" style="display:inline-block;padding:10px 24px;background:var(--p);color:#fff;border-radius:12px;font-size:13px;font-weight:700;text-decoration:none;">Descobrir corredores</a>
          </div>`;
        return;
      }
      POSTS = items.map(c => apiParaPost(c, meId));
      renderFeed(POSTS);
      return;
    }
  } catch {}

  document.getElementById('feed').innerHTML =
    '<p style="text-align:center;color:var(--t2);padding:40px 0;">Erro ao carregar o feed. Tente novamente.</p>';
}

/* Comentários */
const _cmtAbertos = new Set();

async function toggleComentarios(idx, corridaId) {
  const panel = document.getElementById(`cmt-panel-${idx}`);
  const aberto = _cmtAbertos.has(idx);
  if (aberto) {
    panel.style.display = 'none';
    _cmtAbertos.delete(idx);
  } else {
    panel.style.display = 'block';
    _cmtAbertos.add(idx);
    if (corridaId) await carregarComentarios(idx, corridaId);
  }
}

async function carregarComentarios(idx, corridaId) {
  const lista = document.getElementById(`cmt-list-${idx}`);
  lista.innerHTML = '<div class="cmt-vazia">Carregando…</div>';
  try {
    const token = RC.getToken();
    const meId  = RC.getUser()?.id ?? null;
    const headers = token ? { Authorization: 'Bearer ' + token } : {};
    const res = await fetch(`/api/corridas/${corridaId}/comentarios`, { headers });
    if (!res.ok) throw new Error();
    const cmts = await res.json();
    if (!cmts.length) {
      lista.innerHTML = '<div class="cmt-vazia">Nenhum comentário ainda. Seja o primeiro!</div>';
      return;
    }
    lista.innerHTML = cmts.map(c => {
      const ini    = (c.nome || '').trim().split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
      const cor    = userColor(c.user_id);
      const tempo  = tempoRelativo(c.criado_em);
      const isAutor = meId && c.user_id === meId;
      const curtido = !!c.curtido_por_mim;
      const nCurtidas = c.curtidas || 0;

      const likeBtn = `
        <button class="cmt-like-btn${curtido ? ' liked' : ''}"
                onclick="curtirComentario(${corridaId}, ${c.id}, this)"
                data-liked="${curtido}" data-count="${nCurtidas}">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="${curtido ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
          <span>${nCurtidas > 0 ? nCurtidas : ''}</span>
        </button>`;

      const autorBtns = isAutor ? `
        <button class="cmt-act-btn" onclick="iniciarEdicao(${c.id})" title="Editar">Editar</button>
        <button class="cmt-act-btn del" onclick="excluirComentario(${corridaId}, ${c.id}, ${idx})" title="Excluir">Excluir</button>` : '';

      return `
        <div class="cmt-item" id="cmt-item-${c.id}">
          <a href="perfil.html?user=${c.user_id}" style="text-decoration:none">
            <div class="cmt-av" style="background:${cor}18;color:${cor};border-color:${cor}50;">${ini}</div>
          </a>
          <div class="cmt-body">
            <div class="cmt-author">${c.nome}${c.username ? ' <span style="color:var(--t2);font-weight:400;">@'+c.username+'</span>' : ''}</div>
            <div class="cmt-text" id="cmt-text-${c.id}">${c.texto.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
            <div class="cmt-edit-form" id="cmt-edit-${c.id}">
              <input class="cmt-edit-input" id="cmt-edit-input-${c.id}" value="${c.texto.replace(/"/g,'&quot;')}" maxlength="300">
              <button class="cmt-edit-save" onclick="salvarEdicao(${corridaId}, ${c.id}, ${idx})">Salvar</button>
              <button class="cmt-edit-cancel" onclick="cancelarEdicao(${c.id})">✕</button>
            </div>
            <div class="cmt-actions">
              <span class="cmt-time">${tempo}</span>
              ${likeBtn}
              ${autorBtns}
            </div>
          </div>
        </div>`;
    }).join('');
    lista.scrollTop = lista.scrollHeight;
  } catch {
    lista.innerHTML = '<div class="cmt-vazia">Erro ao carregar comentários.</div>';
  }
}

async function curtirComentario(corridaId, cmtId, btn) {
  const token = RC.getToken();
  if (!token) { showToast('Faça login para curtir'); return; }

  const curtido = btn.dataset.liked === 'true';
  const method  = curtido ? 'DELETE' : 'POST';
  try {
    const res = await fetch(`/api/corridas/${corridaId}/comentarios/${cmtId}/curtir`, {
      method,
      headers: { Authorization: 'Bearer ' + token },
    });
    if (!res.ok) throw new Error();
    const data = await res.json();
    const novo = !curtido;
    btn.dataset.liked = String(novo);
    btn.classList.toggle('liked', novo);
    btn.querySelector('svg').setAttribute('fill', novo ? 'currentColor' : 'none');
    btn.querySelector('span').textContent = data.curtidas > 0 ? data.curtidas : '';
  } catch {
    showToast('Erro ao curtir');
  }
}

function iniciarEdicao(cmtId) {
  document.getElementById(`cmt-text-${cmtId}`).style.display = 'none';
  const form = document.getElementById(`cmt-edit-${cmtId}`);
  form.classList.add('show');
  document.getElementById(`cmt-edit-input-${cmtId}`).focus();
}

function cancelarEdicao(cmtId) {
  document.getElementById(`cmt-text-${cmtId}`).style.display = '';
  document.getElementById(`cmt-edit-${cmtId}`).classList.remove('show');
}

async function salvarEdicao(corridaId, cmtId, idx) {
  const token = RC.getToken();
  if (!token) return;
  const input = document.getElementById(`cmt-edit-input-${cmtId}`);
  const texto = input.value.trim();
  if (!texto) return;

  try {
    const res = await fetch(`/api/corridas/${corridaId}/comentarios/${cmtId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ texto }),
    });
    if (!res.ok) { showToast('Erro ao editar'); return; }
    const data = await res.json();
    document.getElementById(`cmt-text-${cmtId}`).textContent = data.texto;
    cancelarEdicao(cmtId);
  } catch {
    showToast('Sem conexão');
  }
}

async function excluirComentario(corridaId, cmtId, idx) {
  const token = RC.getToken();
  if (!token) return;
  try {
    const res = await fetch(`/api/corridas/${corridaId}/comentarios/${cmtId}`, {
      method: 'DELETE',
      headers: { Authorization: 'Bearer ' + token },
    });
    if (!res.ok) { showToast('Erro ao excluir'); return; }
    document.getElementById(`cmt-item-${cmtId}`)?.remove();
    // Decrementa contador
    const countEl = document.getElementById(`cmt-count-${idx}`);
    if (countEl) countEl.textContent = Math.max(0, parseInt(countEl.textContent || 0) - 1);
    showToast('Comentário removido.');
  } catch {
    showToast('Sem conexão');
  }
}

async function enviarComentario(idx, corridaId) {
  const token = RC.getToken();
  if (!token) { showToast('Faça login para comentar'); return; }
  if (!corridaId) return;

  const input = document.getElementById(`cmt-input-${idx}`);
  const texto = input.value.trim();
  if (!texto) return;

  const btn = input.nextElementSibling;
  btn.disabled = true;
  input.disabled = true;

  try {
    const res = await fetch(`/api/corridas/${corridaId}/comentarios`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ texto }),
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      showToast(d.erro || 'Erro ao comentar');
      return;
    }
    input.value = '';
    // Atualiza contador
    const countEl = document.getElementById(`cmt-count-${idx}`);
    if (countEl) countEl.textContent = parseInt(countEl.textContent || 0) + 1;
    // Recarrega lista
    await carregarComentarios(idx, corridaId);
  } catch {
    showToast('Sem conexão');
  } finally {
    btn.disabled = false;
    input.disabled = false;
    input.focus();
  }
}

/* Compartilhar */
/* Excluir atividade */
const _delConfirm = {};
async function excluirPost(idx) {
  const post = POSTS[idx];
  if (!post?.id) return;
  const now = Date.now();
  const btn = document.getElementById(`del-${idx}`);
  if (!_delConfirm[idx] || now - _delConfirm[idx] > 3000) {
    _delConfirm[idx] = now;
    if (btn) { btn.style.color = 'var(--err)'; btn.childNodes[btn.childNodes.length - 1].textContent = ' Confirmar?'; }
    showToast('Toque novamente para confirmar exclusão');
    setTimeout(() => {
      if (btn) { btn.style.color = 'var(--t2)'; btn.childNodes[btn.childNodes.length - 1].textContent = ' Excluir'; }
    }, 3000);
    return;
  }
  delete _delConfirm[idx];
  const token = RC.getToken();
  if (!token) return;
  try {
    const res = await fetch(`/api/corridas/${post.id}`, {
      method: 'DELETE',
      headers: { Authorization: 'Bearer ' + token },
    });
    if (res.ok) {
      document.querySelector(`[data-id="${post.id}"]`)?.remove();
      POSTS[idx] = null;
      showToast('Atividade removida');
    } else {
      showToast('Erro ao excluir');
    }
  } catch {
    showToast('Sem conexão');
  }
}

async function compartilhar(userId, nome, area) {
  const url = location.origin + '/perfil.html' + (userId ? '?user=' + userId : '');
  const text = `${nome} conquistou ${area} m² no RunCity!`;
  if (navigator.share) {
    try { await navigator.share({ title: 'RunCity', text, url }); return; } catch {}
  }
  try {
    await navigator.clipboard.writeText(url);
    showToast('Link copiado!');
  } catch {
    showToast('Não foi possível copiar o link');
  }
}

/* Busca */
let _searchAberto = false;
let _searchTimer  = null;

function toggleSearchPanel() {
  const panel = document.getElementById('searchPanel');
  _searchAberto = !_searchAberto;
  panel.style.display = _searchAberto ? 'block' : 'none';
  if (_searchAberto) {
    _notifAberto = false;
    document.getElementById('notifPanel').style.display = 'none';
    setTimeout(() => document.getElementById('searchInput').focus(), 50);
  }
}

function onSearchInput(val) {
  clearTimeout(_searchTimer);
  const q = val.trim();
  if (q.length < 2) {
    document.getElementById('searchResults').innerHTML = '<div class="search-vazia">Digite para buscar</div>';
    return;
  }
  document.getElementById('searchResults').innerHTML = '<div class="search-vazia">Buscando…</div>';
  _searchTimer = setTimeout(() => executarBusca(q), 350);
}

async function executarBusca(q) {
  const token = RC.getToken();
  if (!token) {
    document.getElementById('searchResults').innerHTML = '<div class="search-vazia">Faça login para buscar</div>';
    return;
  }
  try {
    const res = await fetch(`/api/users/buscar?q=${encodeURIComponent(q)}`, {
      headers: { Authorization: 'Bearer ' + token }
    });
    if (!res.ok) throw new Error();
    const users = await res.json();
    renderSearchResults(users);
  } catch {
    document.getElementById('searchResults').innerHTML = '<div class="search-vazia">Erro ao buscar</div>';
  }
}

function renderSearchResults(users) {
  const el = document.getElementById('searchResults');
  if (!users.length) {
    el.innerHTML = '<div class="search-vazia">Nenhum usuário encontrado</div>';
    return;
  }
  el.innerHTML = users.map(u => {
    const ini = u.nome.trim().split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
    const cor = userColor(u.id);
    const jaAmigo = u.amizade_status === 'aceite';
    const pendente = u.amizade_status === 'pendente' || u.amizade_status === 'enviado';
    const addBtn = jaAmigo
      ? `<button class="search-add" disabled title="Já são amigos" style="color:var(--ok);border-color:rgba(34,197,94,.3);">✓</button>`
      : pendente
        ? `<button class="search-add" disabled title="Pedido enviado" style="color:var(--t2);">…</button>`
        : `<button class="search-add" onclick="searchAddFriend(${u.id},this)" title="Adicionar amigo">+</button>`;
    return `
      <a class="search-item" href="perfil.html?user=${u.id}" onclick="toggleSearchPanel()">
        <div class="search-av" style="background:${cor}18;color:${cor};border-color:${cor}50;">${ini}</div>
        <div class="search-info">
          <div class="search-name">${u.nome}</div>
          <div class="search-user">@${u.username}</div>
          <div class="search-city">${(u.cidade || 'Brasil').split(',')[0]} · Nível ${u.nivel}</div>
        </div>
        ${addBtn}
      </a>`;
  }).join('');
}

async function searchAddFriend(id, btn) {
  const token = RC.getToken();
  if (!token) return;
  btn.disabled = true;
  btn.textContent = '…';
  try {
    const res = await fetch(`/api/amigos/${id}`, {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token }
    });
    if (res.ok) {
      btn.textContent = '✓';
      btn.style.color = 'var(--ok)';
      btn.style.borderColor = 'rgba(34,197,94,.3)';
      showToast('Pedido de amizade enviado!');
    } else {
      const d = await res.json().catch(() => ({}));
      showToast(d.erro || 'Erro ao enviar pedido');
      btn.disabled = false;
      btn.textContent = '+';
    }
  } catch {
    showToast('Sem conexão');
    btn.disabled = false;
    btn.textContent = '+';
  }
}

/* Notificações */
let _notifAberto = false;

function toggleNotifPanel() {
  const panel = document.getElementById('notifPanel');
  _notifAberto = !_notifAberto;
  panel.style.display = _notifAberto ? 'block' : 'none';
  if (_notifAberto) {
    _searchAberto = false;
    document.getElementById('searchPanel').style.display = 'none';
    carregarNotificacoes();
  }
}

document.addEventListener('click', e => {
  const sb = document.getElementById('searchBtn');
  const sp = document.getElementById('searchPanel');
  const nb = document.getElementById('notifBtn');
  const np = document.getElementById('notifPanel');
  if (_searchAberto && !sb.contains(e.target) && !sp.contains(e.target)) {
    _searchAberto = false;
    sp.style.display = 'none';
  }
  if (_notifAberto && !nb.contains(e.target) && !np.contains(e.target)) {
    _notifAberto = false;
    np.style.display = 'none';
  }
});

async function carregarNotificacoes() {
  const token = RC.getToken();
  const list  = document.getElementById('notifList');
  if (!token) {
    list.innerHTML = '<div class="notif-vazia">Faça login para ver notificações</div>';
    return;
  }
  try {
    const res = await fetch('/api/notificacoes', { headers: { Authorization: 'Bearer ' + token } });
    if (res.ok) {
      const { notificacoes, nao_lidas } = await res.json();
      document.getElementById('notifDot').style.display = nao_lidas > 0 ? 'block' : 'none';
      if (!notificacoes.length) {
        list.innerHTML = '<div class="notif-vazia">Nenhuma notificação ainda</div>';
        return;
      }
      list.innerHTML = notificacoes.map(n => {
        const acoes = (n.tipo === 'amizade_pedido' && n.ref_id)
          ? `<div class="notif-acoes">
               <button class="notif-btn-aceitar" onclick="responderAmizade(${n.ref_id}, 'aceitar', ${n.id}, this)">Aceitar</button>
               <button class="notif-btn-recusar" onclick="responderAmizade(${n.ref_id}, 'recusar', ${n.id}, this)">Recusar</button>
             </div>`
          : '';
        return `
          <div class="notif-item${n.lida ? '' : ' nao-lida'}" id="notif-${n.id}">
            ${n.mensagem}
            ${acoes}
            <div class="notif-item-sub">${new Date(n.criado_em).toLocaleDateString('pt-BR', { day:'2-digit', month:'short' })}</div>
          </div>`;
      }).join('');
      return;
    }
  } catch {}
  list.innerHTML = '<div class="notif-vazia">Nenhuma notificação ainda</div>';
}

async function responderAmizade(solicitanteId, acao, notifId, btn) {
  const token = RC.getToken();
  if (!token) return;
  btn.closest('.notif-acoes').querySelectorAll('button').forEach(b => b.disabled = true);
  try {
    if (acao === 'aceitar') {
      const res = await fetch(`/api/amigos/${solicitanteId}/aceitar`, {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + token },
      });
      if (!res.ok) throw new Error();
      showToast('Amizade aceita!');
    } else {
      const res = await fetch(`/api/amigos/${solicitanteId}`, {
        method: 'DELETE',
        headers: { Authorization: 'Bearer ' + token },
      });
      if (!res.ok) throw new Error();
      showToast('Pedido recusado.');
    }
    const item = document.getElementById(`notif-${notifId}`);
    if (item) {
      item.querySelector('.notif-acoes')?.remove();
      item.classList.remove('nao-lida');
    }
  } catch {
    showToast('Erro ao processar. Tente novamente.');
    btn.closest('.notif-acoes').querySelectorAll('button').forEach(b => b.disabled = false);
  }
}

async function limparNotificacoes() {
  const token = RC.getToken();
  if (!token) return;
  try {
    await fetch('/api/notificacoes', { method:'DELETE', headers:{ Authorization:'Bearer '+token } });
    document.getElementById('notifList').innerHTML = '<div class="notif-vazia">Nenhuma notificação ainda</div>';
    document.getElementById('notifDot').style.display = 'none';
  } catch {}
}

async function marcarNotifLidas() {
  const token = RC.getToken();
  if (!token) return;
  try {
    await fetch('/api/notificacoes/ler', { method:'PATCH', headers:{ Authorization:'Bearer '+token } });
    document.getElementById('notifDot').style.display = 'none';
    document.querySelectorAll('.notif-item.nao-lida').forEach(el => el.classList.remove('nao-lida'));
  } catch {}
}

async function initNotifDot() {
  const token = RC.getToken();
  if (!token) return;
  try {
    const res = await fetch('/api/notificacoes', { headers: { Authorization: 'Bearer ' + token } });
    if (res.ok) {
      const { nao_lidas } = await res.json();
      if (nao_lidas > 0) document.getElementById('notifDot').style.display = 'block';
    }
  } catch {}
}

/* Amigos ativos hoje */
async function carregarAmigosAtivos() {
  const row   = document.getElementById('storiesRow');
  const token = RC.getToken();
  const meId  = RC.getUser()?.id ?? null;

  if (!token) {
    row.innerHTML = '<div style="color:var(--t2);font-size:11px;padding:18px 4px;">Faça login para ver amigos ativos</div>';
    return;
  }

  try {
    const res = await fetch('/api/amigos/ativos', {
      headers: { Authorization: 'Bearer ' + token }
    });

    if (!res.ok) throw new Error();

    const amigos = await res.json();

    if (!amigos.length) {
      row.innerHTML = '<div style="color:var(--t2);font-size:11px;padding:18px 4px;">Nenhum amigo ativo hoje ainda</div>';
      return;
    }

    row.innerHTML = amigos.map(a => {
      const nome   = a.nome || '';
      const ini    = nome.trim().split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
      const cor    = userColor(a.id);
      const isMe   = a.id === meId;
      // Último login nas últimas 2h = anel roxo ativo; antes disso = ouro; o próprio user = gold
      const mins   = (Date.now() - new Date(a.ultimo_login)) / 60000;
      const ringCls = isMe ? 'gold-ring' : (mins <= 120 ? 'active' : 'gold-ring');
      return `
        <a class="story" href="perfil.html?user=${a.id}">
          <div class="story-ring ${ringCls}">
            <div class="story-av" style="background:${cor}18;color:${cor};border-color:${cor}40;">${ini}</div>
          </div>
          <div class="story-name">${nome.split(' ')[0]}</div>
        </a>`;
    }).join('');

  } catch {
    row.innerHTML = '<div style="color:var(--t2);font-size:11px;padding:18px 4px;">Não foi possível carregar</div>';
  }
}

carregarAmigosAtivos();
