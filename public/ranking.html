<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RunCity — Ranking</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --p:      #7c5cfc;
      --p-l:    #a084fd;
      --p-ll:   #c4b5fd;
      --p-d:    #5b3fd8;
      --p-dim:  rgba(124,92,252,.1);
      --p-mid:  rgba(124,92,252,.22);
      --p-glow: rgba(124,92,252,.38);
      --gold:   #e8a020;
      --silver: #8ca0b8;
      --bronze: #a0724a;
      --ok:     #22c55e;
      --err:    #ef4444;
      --bg:     #08061a;
      --c0:     #100e24;
      --c1:     #170f32;
      --brd:    #231848;
      --brd2:   #190e38;
      --t1:     #ede8ff;
      --t2:     #5e5280;
      --t3:     #9488c0;
      --ff-d:   'Bebas Neue', sans-serif;
      --ff-b:   'Outfit', sans-serif;
    }

    [data-theme="light"] {
      --bg:  #f8f7ff;
      --c0:  #eeebff;
      --c1:  #e4dfff;
      --brd: #cdc5f0;
      --brd2:#d8d0f8;
      --t1:  #160f38;
      --t2:  #6e60a0;
      --t3:  #453880;
    }

    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

    body {
      background: #050410;
      font-family: var(--ff-b);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    [data-theme="light"] body { background: #eae7f8; }

    /* ── PHONE ── */
    .phone {
      width: 390px;
      height: 844px;
      background: var(--bg);
      border-radius: 46px;
      border: 1.5px solid var(--brd);
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 0 1px rgba(124,92,252,.05), 0 40px 100px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.04);
      animation: slideUp .5s cubic-bezier(.08,.82,.17,1) both;
      flex-shrink: 0;
      transition: border-color .3s;
    }

    .pscroll { width:100%; height:100%; overflow-y:auto; overflow-x:hidden; }
    .pscroll::-webkit-scrollbar { width:2px; }
    .pscroll::-webkit-scrollbar-thumb { background:var(--brd); border-radius:2px; }
    .pbody { padding-bottom:84px; }

    /* ── STATUS BAR ── */
    .sbar { display:flex; justify-content:space-between; align-items:center; padding:14px 24px 6px; color:var(--t1); }
    .sbar-time { font-size:15px; font-weight:700; }
    .sbar-right { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:700; }

    /* ── SCREEN HEADER ── */
    .shdr {
      display:flex; align-items:center; gap:12px;
      padding:10px 20px 14px;
      position:sticky; top:0; z-index:50;
      background:var(--bg); border-bottom:1px solid var(--brd2);
      transition: background .3s, border-color .3s;
    }
    @supports (backdrop-filter:blur(1px)) {
      .shdr { backdrop-filter:blur(24px); background:color-mix(in srgb,var(--bg) 85%,transparent); }
    }

    .back {
      width:36px; height:36px; border-radius:50%;
      background:var(--c0); border:1px solid var(--brd);
      display:flex; align-items:center; justify-content:center;
      text-decoration:none; color:var(--t1); transition:all .22s; flex-shrink:0;
    }
    .back:hover { background:var(--p-dim); border-color:var(--p-mid); color:var(--p-l); transform:translateX(-2px); }

    .shdr-title { font-family:var(--ff-d); font-size:22px; letter-spacing:2px; color:var(--t1); flex:1; }

    .icon-btn {
      width:36px; height:36px; border-radius:50%;
      background:var(--c0); border:1px solid var(--brd);
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; color:var(--t3); transition:all .2s;
    }
    .icon-btn:hover { border-color:var(--p-mid); color:var(--p-l); }

    /* ── SEGMENTED CONTROL ── */
    .seg-wrap { padding:12px 20px 8px; }
    .seg { display:flex; background:var(--c0); border-radius:10px; padding:3px; border:1px solid var(--brd2); gap:2px; }
    .seg-opt { flex:1; text-align:center; padding:8px 4px; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer; transition:all .2s; color:var(--t2); border:1px solid transparent; }
    .seg-opt.active { background:var(--p-dim); color:var(--p-ll); border-color:var(--p-mid); }

    /* ── PILLS ── */
    .pills { display:flex; gap:7px; padding:6px 20px 16px; overflow-x:auto; }
    .pills::-webkit-scrollbar { display:none; }
    .pill { flex-shrink:0; padding:6px 14px; border-radius:20px; font-size:11px; font-weight:700; cursor:pointer; transition:all .2s; border:1px solid var(--brd); color:var(--t2); }
    .pill.active { background:var(--p); border-color:var(--p); color:#fff; }

    /* ── PÓDIO ── */
    .podium-wrap { padding:0 20px 18px; }
    .podium {
      display:flex; align-items:flex-end; gap:4px;
      background:linear-gradient(170deg,var(--c1) 0%,var(--c0) 40%,var(--bg) 100%);
      border:1px solid var(--brd2); border-radius:20px;
      padding:24px 10px 0; position:relative; overflow:hidden;
    }

    .pd { flex:1; display:flex; flex-direction:column; align-items:center; }
    .pd-av { width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--ff-d); font-size:16px; border:2px solid; }
    .pd-name { font-size:11px; font-weight:700; color:var(--t1); margin:8px 0 3px; text-align:center; line-height:1.2; }
    .pd-score { font-family:var(--ff-d); font-size:13px; text-align:center; margin-bottom:8px; line-height:1; }
    .pd-score small { font-family:var(--ff-b); font-size:9px; color:var(--t2); display:block; margin-top:2px; }
    .pd-plat { width:100%; border-radius:6px 6px 0 0; display:flex; align-items:center; justify-content:center; }
    .pd-num { font-family:var(--ff-d); font-size:24px; }

    .p1 { transform:translateY(-14px); }
    .p1 .pd-av { width:60px; height:60px; font-size:20px; background:rgba(232,160,32,.12); color:var(--gold); border-color:var(--gold); box-shadow:0 0 20px rgba(232,160,32,.28); }
    .p1 .pd-score { color:var(--gold); font-size:15px; }
    .p1 .pd-num { color:var(--gold); font-size:30px; }
    .p1 .pd-plat { height:68px; background:linear-gradient(180deg,rgba(232,160,32,.18),rgba(232,160,32,.03)); }
    .p2 .pd-av { background:rgba(140,160,184,.1); color:var(--silver); border-color:var(--silver); }
    .p2 .pd-score { color:var(--silver); }
    .p2 .pd-num { color:var(--silver); }
    .p2 .pd-plat { height:50px; background:linear-gradient(180deg,rgba(140,160,184,.14),rgba(140,160,184,.02)); }
    .p3 .pd-av { background:rgba(160,114,74,.1); color:var(--bronze); border-color:var(--bronze); }
    .p3 .pd-score { color:var(--bronze); }
    .p3 .pd-num { color:var(--bronze); }
    .p3 .pd-plat { height:38px; background:linear-gradient(180deg,rgba(160,114,74,.14),rgba(160,114,74,.02)); }

    /* ── RANK LIST ── */
    .rlst { padding:0 20px; display:flex; flex-direction:column; gap:6px; }
    .ritem {
      display:flex; align-items:center; gap:10px; padding:12px 14px;
      background:var(--c0); border-radius:13px; border:1px solid var(--brd2);
      cursor:pointer; transition:all .2s; position:relative; overflow:hidden;
      animation:itemIn .35s cubic-bezier(.08,.82,.17,1) both;
    }
    .ritem::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:transparent; transition:background .2s; }
    .ritem:hover { border-color:var(--brd); transform:translateX(3px); }
    .ritem:hover::before { background:var(--p); }
    .ritem.me { border-color:var(--p-mid); background:var(--p-dim); }
    .ritem.me::before { background:var(--p); }

    .rpos { font-family:var(--ff-d); font-size:20px; color:var(--t2); width:24px; text-align:center; flex-shrink:0; }
    .rav  { width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--ff-d); font-size:13px; flex-shrink:0; border:2px solid; transition:transform .2s; }
    .ritem:hover .rav { transform:scale(1.08); }
    .rinfo { flex:1; min-width:0; }
    .rname { font-size:14px; font-weight:700; color:var(--t1); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .rsub  { font-size:11px; color:var(--t2); margin-top:1px; display:flex; align-items:center; gap:5px; }
    .rmeta { text-align:right; flex-shrink:0; }
    .rm2   { font-family:var(--ff-d); font-size:16px; letter-spacing:.4px; color:var(--p-l); }
    .rkm   { font-size:10px; color:var(--t2); margin-top:1px; }
    .you-tag { background:var(--p); color:#fff; font-size:9px; font-weight:800; letter-spacing:.6px; padding:2px 6px; border-radius:4px; vertical-align:middle; margin-left:5px; }
    .trend { font-size:11px; font-weight:800; margin-left:2px; }
    .trend.up { color:var(--ok); }
    .trend.dn { color:var(--err); }

    .mypos { padding:14px 20px 0; }
    .mypos-lbl { font-size:10px; font-weight:700; letter-spacing:1.8px; text-transform:uppercase; color:var(--t2); margin-bottom:8px; }

    /* paginador */
    .paginador {
      display: flex; align-items: center; justify-content: center;
      gap: 14px;
      padding: 14px 20px 4px;
    }
    .pag-btn {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--c0);
      border: 1px solid var(--brd);
      color: var(--t2);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all .2s;
    }
    .pag-btn:hover:not(:disabled) { color: var(--p-l); border-color: var(--p-mid); }
    .pag-btn:disabled { opacity: .35; cursor: not-allowed; }
    .pag-info {
      font-size: 11px; font-weight: 700;
      color: var(--t3);
      letter-spacing: .5px;
    }

    /* ── NAV ── */
    .nav { position:absolute; bottom:0; left:0; right:0; height:78px; background:var(--bg); border-top:1px solid var(--brd); display:flex; z-index:100; transition:background .3s, border-color .3s; }
    @supports (backdrop-filter:blur(1px)) { .nav { backdrop-filter:blur(24px); background:color-mix(in srgb,var(--bg) 90%,transparent); } }
    .nit { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; cursor:pointer; transition:color .2s; color:var(--t2); position:relative; text-decoration:none; }
    .nit::after { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:0; height:2px; background:var(--p); border-radius:0 0 2px 2px; transition:width .22s; }
    .nit.active { color:var(--p-l); }
    .nit.active::after { width:22px; }
    .nit:hover { color:var(--t3); }
    .nlbl { font-size:9px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; }

    /* ── TOAST ── */
    .toast { position:fixed; bottom:36px; left:50%; transform:translateX(-50%) translateY(10px); background:var(--c1); border:1px solid var(--p-mid); color:var(--p-ll); padding:10px 22px; border-radius:30px; font-size:12px; font-weight:600; z-index:9999; white-space:nowrap; pointer-events:none; opacity:0; transition:all .28s; box-shadow:0 8px 30px rgba(0,0,0,.5); }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* ── ANIMAÇÕES ── */
    @keyframes slideUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
    @keyframes itemIn  { from{opacity:0;transform:translateX(-12px)} to{opacity:1;transform:translateX(0)} }

    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; }
    }

    @media (max-width:440px) {
      .phone { width:100vw; height:100vh; border-radius:0; border:none; }
      body { padding:0; }
    }

    @media print {
      body { background:#fff; padding:0; }
      .phone { box-shadow:none; border:1px solid #ccc; }
      .toast { display:none; }
    }
  </style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="phone">
  <div class="pscroll">

    <!-- Status bar -->
    <div class="sbar">
      <span class="sbar-time" id="relogio">--:--</span>
      <div class="sbar-right">
        <svg width="16" height="12" viewBox="0 0 24 18" fill="currentColor">
          <rect x="0" y="10" width="4" height="8" rx="1"/>
          <rect x="6.5" y="7" width="4" height="11" rx="1"/>
          <rect x="13" y="3" width="4" height="15" rx="1"/>
          <rect x="19.5" y="0" width="4" height="18" rx="1" opacity=".35"/>
        </svg>
        <svg width="22" height="11" viewBox="0 0 33 18" fill="currentColor">
          <rect x="0" y="0" width="29" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <rect x="30" y="5" width="3" height="8" rx="1"/>
          <rect x="2" y="2" width="19" height="14" rx="2"/>
        </svg>
      </div>
    </div>

    <div class="pbody">

      <!-- Header -->
      <div class="shdr">
        <a class="back" href="index.html" title="Início">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5"/><path d="M12 5l-7 7 7 7"/>
          </svg>
        </a>
        <div class="shdr-title">Ranking</div>
        <div class="icon-btn" onclick="showToast('Link copiado!')" title="Compartilhar">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
          </svg>
        </div>
      </div>

      <!-- Escopo -->
      <div class="seg-wrap">
        <div class="seg" id="scopeG">
          <div class="seg-opt active" onclick="seg('scopeG',this)">Cidade</div>
          <div class="seg-opt" onclick="seg('scopeG',this)">Global</div>
          <div class="seg-opt" onclick="seg('scopeG',this)">Amigos</div>
        </div>
      </div>

      <!-- Período -->
      <div class="pills">
        <div class="pill active" onclick="pill(this)">Esta semana</div>
        <div class="pill" onclick="pill(this)">Este mês</div>
        <div class="pill" onclick="pill(this)">Total</div>
      </div>

      <!-- Pódio -->
      <div class="podium-wrap">
        <div class="podium">
          <div class="pd p2">
            <div class="pd-av">PL</div>
            <div class="pd-name">Pedro<br>Lopes</div>
            <div class="pd-score">98.2k<small>m²</small></div>
            <div class="pd-plat"><span class="pd-num">2</span></div>
          </div>
          <div class="pd p1">
            <div style="position:relative;display:inline-block;">
              <div style="position:absolute;top:-12px;left:50%;transform:translateX(-50%);">
                <svg width="22" height="14" viewBox="0 0 36 22" fill="var(--gold)">
                  <polygon points="2,22 8,4 18,14 28,4 34,22"/>
                  <circle cx="2" cy="4" r="2.5"/><circle cx="18" cy="2" r="2.5"/><circle cx="34" cy="4" r="2.5"/>
                </svg>
              </div>
              <div class="pd-av" style="margin-top:8px;">AC</div>
            </div>
            <div class="pd-name" style="font-size:12px;font-weight:800;">Ana<br>Costa</div>
            <div class="pd-score">127.4k<small>m²</small></div>
            <div class="pd-plat"><span class="pd-num">1</span></div>
          </div>
          <div class="pd p3">
            <div class="pd-av" style="background:var(--p-dim);color:var(--p-l);border-color:var(--p);">JS</div>
            <div class="pd-name">João<br>Silva</div>
            <div class="pd-score" style="color:var(--bronze);">48.3k<small>m²</small></div>
            <div class="pd-plat"><span class="pd-num">3</span></div>
          </div>
        </div>
      </div>

      <!-- Lista paginada (4 em diante) -->
      <div class="rlst" id="rankList"></div>

      <div class="paginador">
        <button class="pag-btn" id="btnPrev" onclick="paginaPrev()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <span class="pag-info" id="pagInfo">Página 1 de 1</span>
        <button class="pag-btn" id="btnNext" onclick="paginaNext()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>

      <!-- Minha posição -->
      <div class="mypos">
        <div class="mypos-lbl">Sua posição</div>
        <div class="ritem me">
          <div class="rpos" style="color:var(--p-l);">3</div>
          <div class="rav" id="meuAv" style="background:var(--p-dim);color:var(--p-l);border-color:var(--p);">--</div>
          <div class="rinfo">
            <div class="rname"><span id="meuNome">--</span> <span class="you-tag">Você</span></div>
            <div class="rsub">
              <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>

            </div>
          </div>

            <div class="rm2">48.3k m²</div>
            <div class="rkm">87 km</div>
          </div>
          <div class="trend up">↑</div>
        </div>
      </div>

    </div>

    <!-- Nav bar -->
    <nav class="nav">
      <a class="nit" href="index.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <div class="nlbl">Início</div>
      </a>
      <a class="nit" href="#" onclick="showToast('Em breve')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <div class="nlbl">Correr</div>
      </a>
      <a class="nit" href="lobby.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <div class="nlbl">Jogar</div>
      </a>
      <a class="nit active" href="ranking.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <div class="nlbl">Ranking</div>
      </a>
      <a class="nit" href="perfil.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <div class="nlbl">Perfil</div>
      </a>
    </nav>

  </div>
</div>

<script src="auth.js"></script>
<script>
  /* preenche o bloco "Sua posição" com o usuário logado */
  (async () => {
    const u = await RC.requerLogin();
    if (!u) return;
    const nome = u.nome || 'Você';
    const iniciais = nome.trim().split(/\s+/).map(s => s[0]).slice(0,2).join('').toUpperCase() || '?';
    document.getElementById('meuNome').textContent = nome;
    document.getElementById('meuAv').textContent   = iniciais;
  })();

  /* ── Dados (mock — virão do backend depois) ── */
  const dados = [
    { id:"u-mariana",  pos:4,  n:"Mariana Rocha",  city:"BH", m2:"45.1k", km:134, wins:12, av:"MR", c:"#f97316", t:"up" },
    { id:"u-carlos",   pos:5,  n:"Carlos Melo",    city:"SP", m2:"39.8k", km:98,  wins:7,  av:"CM", c:"#38bdf8", t:"up" },

  ];

  const POR_PAGINA = 5;
  let pagina = 0;

  function renderizarPagina() {
    const list = document.getElementById('rankList');
    list.innerHTML = '';
    const slice = dados.slice(pagina * POR_PAGINA, (pagina + 1) * POR_PAGINA);
    slice.forEach((r, i) => {
      const el = document.createElement('div');
      el.className = 'ritem';
      el.style.animationDelay = `${i * 55}ms`;
      el.innerHTML = `
        <div class="rpos">${r.pos}</div>
        <div class="rav" style="background:${r.c}18;color:${r.c};border-color:${r.c}65;">${r.av}</div>
        <div class="rinfo">
          <div class="rname">${r.n}</div>
          <div class="rsub">
            <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
            ${r.city} · ${r.wins} vitórias
          </div>
        </div>
        <div class="rmeta">
          <div class="rm2">${r.m2} m²</div>
          <div class="rkm">${r.km} km</div>
        </div>
        <div class="trend ${r.t}">${r.t==='up'?'↑':'↓'}</div>
      `;
      el.addEventListener('click', () => {
        window.location.href = 'perfil.html?id=' + encodeURIComponent(r.id);
      });
      list.appendChild(el);
    });

    // controles de paginação
    const totalPaginas = Math.ceil(dados.length / POR_PAGINA);
    document.getElementById('pagInfo').textContent = `Página ${pagina + 1} de ${totalPaginas}`;
    document.getElementById('btnPrev').disabled = pagina === 0;
    document.getElementById('btnNext').disabled = pagina >= totalPaginas - 1;
  }

  function paginaPrev() { if (pagina > 0) { pagina--; renderizarPagina(); } }
  function paginaNext() {
    const total = Math.ceil(dados.length / POR_PAGINA);
    if (pagina < total - 1) { pagina++; renderizarPagina(); }
  }

  renderizarPagina();

  /* ── Filtros ── */
  function seg(id, el) {
    document.querySelectorAll(`#${id} .seg-opt`).forEach(o => o.classList.remove('active'));
    el.classList.add('active');
  }

  function pill(el) {
    el.closest('.pills').querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    el.classList.add('active');
  }

  /* ── Toast ── */
  let _tt;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(_tt); _tt = setTimeout(() => t.classList.remove('show'), 2200);
  }

  /* ── Relógio ── */
  function tick() {
    const d = new Date();
    document.getElementById('relogio').textContent =
      String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }
  tick(); setInterval(tick, 30000);

  /* ── Lê o tema salvo pelo perfil ── */
  try {
    if (localStorage.getItem('rc_theme') === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  } catch(e) {}
</script>
