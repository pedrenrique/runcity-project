<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RunCity — Ranking</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --p:#7c5cfc; --p-l:#a084fd; --p-ll:#c4b5fd; --p-d:#5b3fd8;
      --p-dim:rgba(124,92,252,.1); --p-mid:rgba(124,92,252,.22); --p-glow:rgba(124,92,252,.38);
      --gold:#e8a020; --silver:#8ca0b8; --bronze:#a0724a; --ok:#22c55e; --err:#ef4444;
      --bg:#08061a; --c0:#100e24; --c1:#170f32; --brd:#231848; --brd2:#190e38;
      --t1:#ede8ff; --t2:#5e5280; --t3:#9488c0;
      --ff-d:'Bebas Neue',sans-serif; --ff-b:'Outfit',sans-serif;
    }
    [data-theme="light"]{--bg:#f8f7ff;--c0:#eeebff;--c1:#e4dfff;--brd:#cdc5f0;--brd2:#d8d0f8;--t1:#160f38;--t2:#6e60a0;--t3:#453880;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:#050410;font-family:var(--ff-b);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;}
    [data-theme="light"] body{background:#eae7f8;}

    /* PHONE */
    .phone{width:390px;height:844px;background:var(--bg);border-radius:46px;border:1.5px solid var(--brd);overflow:hidden;position:relative;box-shadow:0 0 0 1px rgba(124,92,252,.05),0 40px 100px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.04);animation:slideUp .5s cubic-bezier(.08,.82,.17,1) both;flex-shrink:0;transition:border-color .3s;}
    .pscroll{width:100%;height:100%;overflow-y:auto;overflow-x:hidden;}
    .pscroll::-webkit-scrollbar{width:2px;}
    .pscroll::-webkit-scrollbar-thumb{background:var(--brd);border-radius:2px;}
    .pbody{padding-bottom:84px;}

    /* HEADER */
    .shdr{display:flex;align-items:center;gap:12px;padding:10px 20px 14px;position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--brd2);transition:background .3s,border-color .3s;}
    @supports (backdrop-filter:blur(1px)){.shdr{backdrop-filter:blur(24px);background:color-mix(in srgb,var(--bg) 85%,transparent);}}
    .back{width:36px;height:36px;border-radius:50%;background:var(--c0);border:1px solid var(--brd);display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--t1);transition:all .22s;flex-shrink:0;}
    .back:hover{background:var(--p-dim);border-color:var(--p-mid);color:var(--p-l);transform:translateX(-2px);}
    .shdr-title{font-family:var(--ff-d);font-size:22px;letter-spacing:2px;color:var(--t1);flex:1;}

    /* SEGMENTED */
    .seg-wrap{padding:12px 20px 8px;}
    .seg{display:flex;background:var(--c0);border-radius:10px;padding:3px;border:1px solid var(--brd2);gap:2px;}
    .seg-opt{flex:1;text-align:center;padding:8px 4px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;color:var(--t2);border:1px solid transparent;}
    .seg-opt.active{background:var(--p-dim);color:var(--p-ll);border-color:var(--p-mid);}

    /* PILLS — centralizadas, com wrap */
    .pills{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;padding:6px 20px 14px;}
    .pill{flex-shrink:0;padding:6px 16px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;transition:all .2s;border:1px solid var(--brd);color:var(--t2);}
    .pill.active{background:var(--p);border-color:var(--p);color:#fff;}
    .pill:hover:not(.active){border-color:var(--p-mid);color:var(--p-l);}

    /* SCOPE LABEL */
    .scope-label{text-align:center;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--t2);padding:0 20px 10px;}

    /* PÓDIO */
    .podium-wrap{padding:0 20px 18px;}
    .podium{display:flex;align-items:flex-end;gap:4px;background:linear-gradient(170deg,var(--c1) 0%,var(--c0) 40%,var(--bg) 100%);border:1px solid var(--brd2);border-radius:20px;padding:24px 10px 0;position:relative;overflow:hidden;transition:opacity .25s;}
    .podium.fading{opacity:0;}
    .pd{flex:1;display:flex;flex-direction:column;align-items:center;}
    .pd-av{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--ff-d);font-size:16px;border:2px solid;}
    .pd-name{font-size:11px;font-weight:700;color:var(--t1);margin:8px 0 3px;text-align:center;line-height:1.2;}
    .pd-score{font-family:var(--ff-d);font-size:13px;text-align:center;margin-bottom:8px;line-height:1;}
    .pd-score small{font-family:var(--ff-b);font-size:9px;color:var(--t2);display:block;margin-top:2px;}
    .pd-plat{width:100%;border-radius:6px 6px 0 0;display:flex;align-items:center;justify-content:center;}
    .pd-num{font-family:var(--ff-d);font-size:24px;}
    .p1{transform:translateY(-14px);}
    .p1 .pd-av{width:60px;height:60px;font-size:20px;background:rgba(232,160,32,.12);color:var(--gold);border-color:var(--gold);box-shadow:0 0 20px rgba(232,160,32,.28);}
    .p1 .pd-score{color:var(--gold);font-size:15px;}
    .p1 .pd-num{color:var(--gold);font-size:30px;}
    .p1 .pd-plat{height:68px;background:linear-gradient(180deg,rgba(232,160,32,.18),rgba(232,160,32,.03));}
    .p2 .pd-av{background:rgba(140,160,184,.1);color:var(--silver);border-color:var(--silver);}
    .p2 .pd-score{color:var(--silver);}
    .p2 .pd-num{color:var(--silver);}
    .p2 .pd-plat{height:50px;background:linear-gradient(180deg,rgba(140,160,184,.14),rgba(140,160,184,.02));}
    .p3 .pd-av{background:rgba(160,114,74,.1);color:var(--bronze);border-color:var(--bronze);}
    .p3 .pd-score{color:var(--bronze);}
    .p3 .pd-num{color:var(--bronze);}
    .p3 .pd-plat{height:38px;background:linear-gradient(180deg,rgba(160,114,74,.14),rgba(160,114,74,.02));}

    /* RANK LIST */
    .rlst{padding:0 20px;display:flex;flex-direction:column;gap:6px;}
    .ritem{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--c0);border-radius:13px;border:1px solid var(--brd2);cursor:pointer;transition:all .2s;position:relative;overflow:hidden;animation:itemIn .35s cubic-bezier(.08,.82,.17,1) both;text-decoration:none;}
    .ritem::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;transition:background .2s;}
    .ritem:hover{border-color:var(--brd);transform:translateX(3px);}
    .ritem:hover::before{background:var(--p);}
    .ritem.me{border-color:var(--p-mid);background:var(--p-dim);}
    .ritem.me::before{background:var(--p);}
    .rpos{font-family:var(--ff-d);font-size:20px;color:var(--t2);width:24px;text-align:center;flex-shrink:0;}
    .rav{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--ff-d);font-size:13px;flex-shrink:0;border:2px solid;transition:transform .2s;}
    .ritem:hover .rav{transform:scale(1.08);}
    .rinfo{flex:1;min-width:0;}
    .rname{font-size:14px;font-weight:700;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .rsub{font-size:11px;color:var(--t2);margin-top:1px;display:flex;align-items:center;gap:5px;}
    .rusername{font-size:10px;color:var(--p-l);margin-top:1px;}
    .rmeta{text-align:right;flex-shrink:0;}
    .rm2{font-family:var(--ff-d);font-size:16px;letter-spacing:.4px;color:var(--p-l);}
    .rkm{font-size:10px;color:var(--t2);margin-top:1px;}
    .you-tag{background:var(--p);color:#fff;font-size:9px;font-weight:800;letter-spacing:.6px;padding:2px 6px;border-radius:4px;vertical-align:middle;margin-left:5px;}
    .trend{font-size:11px;font-weight:800;margin-left:2px;}
    .trend.up{color:var(--ok);}
    .trend.dn{color:var(--err);}
    .radd{width:26px;height:26px;border-radius:50%;background:transparent;border:1.5px solid var(--brd);color:var(--t2);font-size:16px;line-height:1;cursor:pointer;flex-shrink:0;transition:all .2s;display:flex;align-items:center;justify-content:center;margin-left:2px;padding:0;}
    .radd:hover{border-color:var(--p-mid);color:var(--p-l);background:var(--p-dim);}
    .radd:disabled{border-color:rgba(34,197,94,.3);color:var(--ok);cursor:default;background:transparent;}
    .mypos{padding:14px 20px 0;}
    .mypos-lbl{font-size:10px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--t2);margin-bottom:8px;}

    /* NAV */
    .nav{position:absolute;bottom:0;left:0;right:0;height:78px;background:var(--bg);border-top:1px solid var(--brd);display:flex;z-index:100;transition:background .3s,border-color .3s;}
    @supports (backdrop-filter:blur(1px)){.nav{backdrop-filter:blur(24px);background:color-mix(in srgb,var(--bg) 90%,transparent);}}
    .nit{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;transition:color .2s;color:var(--t2);position:relative;text-decoration:none;}
    .nit::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:2px;background:var(--p);border-radius:0 0 2px 2px;transition:width .22s;}
    .nit.active{color:var(--p-l);}
    .nit.active::after{width:22px;}
    .nit:hover{color:var(--t3);}
    .nlbl{font-size:9px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;}

    /* TOAST */
    .toast{position:fixed;bottom:36px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--c1);border:1px solid var(--p-mid);color:var(--p-ll);padding:10px 22px;border-radius:30px;font-size:12px;font-weight:600;z-index:9999;white-space:nowrap;pointer-events:none;opacity:0;transition:all .28s;box-shadow:0 8px 30px rgba(0,0,0,.5);}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

    @keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
    @keyframes itemIn {from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;}}
    @media (max-width:440px){.phone{width:100vw;height:100vh;border-radius:0;border:none;}body{padding:0;}}
  </style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="phone">
  <div class="pscroll">

    <div class="pbody">

      <div class="shdr">
        <a class="back" href="index.html" title="Início">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 5l-7 7 7 7"/></svg>
        </a>
        <div class="shdr-title">Ranking</div>
      </div>

      <!-- Escopo -->
      <div class="seg-wrap">
        <div class="seg" id="scopeG">
          <div class="seg-opt active" onclick="changeScope('cidade',this)">Cidade</div>
          <div class="seg-opt" onclick="changeScope('global',this)">Global</div>
          <div class="seg-opt" onclick="changeScope('amigos',this)">Amigos</div>
        </div>
      </div>

      <!-- Período — centralizado, com Diário -->
      <div class="pills" id="pillsRow">
        <div class="pill active" onclick="pill(this,'diario')">Diário</div>
        <div class="pill" onclick="pill(this,'semana')">Esta semana</div>
        <div class="pill" onclick="pill(this,'mes')">Este mês</div>
        <div class="pill" onclick="pill(this,'total')">Total</div>
      </div>

      <div class="scope-label" id="scopeLabel">São Paulo, SP</div>

      <div class="podium-wrap">
        <div class="podium" id="podium"></div>
      </div>

      <div class="rlst" id="rankList"></div>

      <div class="mypos">
        <div class="mypos-lbl">Sua posição</div>
        <div id="myPosItem"></div>
      </div>

    </div>

    <nav class="nav">
      <a class="nit" href="index.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><div class="nlbl">Início</div></a>
      <a class="nit" href="lobby.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><div class="nlbl">Jogar</div></a>
      <a class="nit active" href="ranking.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><div class="nlbl">Ranking</div></a>
      <a class="nit" href="perfil.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><div class="nlbl">Perfil</div></a>
    </nav>

  </div>
</div>

<script src="auth.js"></script>
<script>
/* ── COR DOS AVATARES ── */
const AV_C = { JS:'#a084fd',AC:'#e8a020',PL:'#fb923c',TB:'#38bdf8',CM:'#c084fc',FG:'#f97316',LP:'#2dd4bf',KS:'#ef4444',MR:'#f472b6',RT:'#f97316',LN:'#2dd4bf',MS:'#f472b6',BC:'#a78bfa',SA:'#38bdf8',ML:'#c084fc',DP:'#38bdf8' };

/* ── DATASETS ──
   Cada escopo tem variantes por período (diario / semana / mes / total).
   Para manter o exemplo manejável os dados variam principalmente em m² e posição.
─────────────────────────────────────────────────────────────────────────────── */
function mkCidade(period){
  const mult = {diario:.12, semana:1, mes:4.2, total:18};
  const m = mult[period]||1;
  const fmt = v => v>=1000 ? (v/1000).toFixed(1)+'k' : v+'';
  return {
    label:'São Paulo, SP',
    podium:[
      {av:'PL',name:'Pedro\nLopes', score:fmt(Math.round(98200*m)), city:'SP', isMe:false, uid:'PL'},
      {av:'AC',name:'Ana\nCosta',   score:fmt(Math.round(127400*m)),city:'SP', isMe:false, uid:'AC'},
      {av:'JS',name:'João\nSilva',  score:fmt(Math.round(48300*m)), city:'SP', isMe:true,  uid:'JS'}
    ],
    list:[
      {pos:4,n:'Carlos Melo',   uid:'CM',city:'SP',m2:fmt(Math.round(39800*m)),km:Math.round(98*m) ,wins:Math.round(7*m) ,av:'CM',t:'up', username:'carlosmelo'},
      {pos:5,n:'Rafael Torres', uid:'RT',city:'SP',m2:fmt(Math.round(28400*m)),km:Math.round(65*m) ,wins:Math.round(4*m) ,av:'RT',t:'dn', username:'rafaeltorres'},
      {pos:6,n:'Luiza Neves',   uid:'LN',city:'SP',m2:fmt(Math.round(21000*m)),km:Math.round(52*m) ,wins:Math.round(3*m) ,av:'LN',t:'up', username:'luizaneves'},
      {pos:7,n:'Marina Santos', uid:'MS',city:'SP',m2:fmt(Math.round(18200*m)),km:Math.round(44*m) ,wins:Math.round(2*m) ,av:'MS',t:'dn', username:'marinasantos'},
      {pos:8,n:'Bruno Carvalho',uid:'BC',city:'SP',m2:fmt(Math.round(15600*m)),km:Math.round(38*m) ,wins:Math.round(2*m) ,av:'BC',t:'up', username:'brunocarvalho'},
    ],
    myPos:3, myTrend:'up'
  };
}

function mkGlobal(period){
  const mult = {diario:.05, semana:1, mes:4.2, total:18};
  const m = mult[period]||1;
  const fmt = v => v>=1000 ? (v/1000).toFixed(1)+'k' : v+'';
  return {
    label:'Mundo todo',
    podium:[
      {av:'SA',name:'Sofia\nAndrade', score:fmt(Math.round(341700*m)),city:'Lisboa',  isMe:false,uid:'SA'},
      {av:'KS',name:'Kim\nSung-jin',  score:fmt(Math.round(482100*m)),city:'Seul',    isMe:false,uid:'KS'},
      {av:'ML',name:'Mei\nLin',       score:fmt(Math.round(298400*m)),city:'Xangai',  isMe:false,uid:'ML'}
    ],
    list:[
      {pos:4, n:'Ana Costa',    uid:'AC',city:'SP',      m2:fmt(Math.round(127400*m)),km:Math.round(312*m),wins:Math.round(45*m),av:'AC',t:'up', username:'anacosta'},
      {pos:5, n:'David Park',   uid:'DP',city:'Nova York',m2:fmt(Math.round(118200*m)),km:Math.round(290*m),wins:Math.round(38*m),av:'DP',t:'dn', username:'davidpark'},
      {pos:6, n:'Emma Weber',   uid:'EW',city:'Berlim',  m2:fmt(Math.round(109600*m)),km:Math.round(270*m),wins:Math.round(31*m),av:'EW',t:'up', username:'emmaweber'},
      {pos:7, n:'Pedro Lopes',  uid:'PL',city:'SP',      m2:fmt(Math.round(98200*m)), km:Math.round(241*m),wins:Math.round(27*m),av:'PL',t:'dn', username:'pedrolopes'},
      {pos:8, n:'Yuki Tanaka',  uid:'YT',city:'Tóquio', m2:fmt(Math.round(91000*m)), km:Math.round(218*m),wins:Math.round(24*m),av:'YT',t:'up', username:'yukitanaka'},
    ],
    myPos:21, myTrend:'up'
  };
}

function mkAmigos(period){
  const mult = {diario:.12, semana:1, mes:4.2, total:18};
  const m = mult[period]||1;
  const fmt = v => v>=1000 ? (v/1000).toFixed(1)+'k' : v+'';
  return {
    label:'Seus amigos',
    podium:[
      {av:'CM',name:'Carla\nMendes', score:fmt(Math.round(72800*m)),city:'SP',isMe:false,uid:'CM'},
      {av:'TB',name:'Thiago\nBrum',  score:fmt(Math.round(95200*m)),city:'SP',isMe:false,uid:'TB'},
      {av:'JS',name:'João\nSilva',   score:fmt(Math.round(48300*m)),city:'SP',isMe:true, uid:'JS'}
    ],
    list:[
      {pos:4,n:'Felipe Gomes',uid:'FG',city:'SP',m2:fmt(Math.round(34700*m)),km:Math.round(82*m),wins:Math.round(5*m),av:'FG',t:'up', username:'felipegomes'},
      {pos:5,n:'Lucas Pinto', uid:'LP',city:'RJ',m2:fmt(Math.round(27100*m)),km:Math.round(64*m),wins:Math.round(3*m),av:'LP',t:'dn', username:'lucaspinto'},
      {pos:6,n:'Ana Costa',   uid:'AC',city:'SP',m2:fmt(Math.round(19300*m)),km:Math.round(45*m),wins:Math.round(2*m),av:'AC',t:'up', username:'anacosta'},
    ],
    myPos:3, myTrend:'up'
  };
}

const BUILDERS = { cidade:mkCidade, global:mkGlobal, amigos:mkAmigos };

const PALETTE = ['#a084fd','#e8a020','#fb923c','#38bdf8','#c084fc','#f97316','#2dd4bf','#ef4444','#f472b6','#22c55e'];
function userColor(id){ return PALETTE[(id||0) % PALETTE.length]; }
function fmtM2(v){ return v >= 1000 ? (v/1000).toFixed(1)+'k' : String(Math.round(v)); }
const SCOPE_LABELS = { cidade:'São Paulo, SP', global:'Mundo todo', amigos:'Seus amigos' };

let currentScope  = 'cidade';
let currentPeriod = 'diario';

/* ── RENDER PÓDIO ── */
const ME_STYLE = `background:var(--p-dim);color:var(--p-l);border-color:var(--p);`;
const crown = `<div style="position:absolute;top:-12px;left:50%;transform:translateX(-50%);"><svg width="22" height="14" viewBox="0 0 36 22" fill="var(--gold)"><polygon points="2,22 8,4 18,14 28,4 34,22"/><circle cx="2" cy="4" r="2.5"/><circle cx="18" cy="2" r="2.5"/><circle cx="34" cy="4" r="2.5"/></svg></div>`;

function avStyle(uid, col){
  const c = col || AV_C[uid] || '#a084fd';
  return `background:${c}1e;color:${c};border-color:${c}65;`;
}

function renderPodium(list){
  // list[0]=2nd, list[1]=1st, list[2]=3rd
  const [sec,fst,thd] = list;
  document.getElementById('podium').innerHTML = `
    <div class="pd p2" onclick="goProfile('${sec.uid}')">
      <div class="pd-av" style="${sec.isMe?ME_STYLE:avStyle(sec.av,sec.col)}">${sec.av}</div>
      <div class="pd-name">${sec.name.replace('\n','<br>')}</div>
      <div class="pd-score">${sec.score}<small>m²</small></div>
      <div class="pd-plat"><span class="pd-num">2</span></div>
    </div>
    <div class="pd p1" onclick="goProfile('${fst.uid}')">
      <div style="position:relative;display:inline-block;">${crown}
        <div class="pd-av" style="margin-top:8px;${fst.isMe?ME_STYLE:avStyle(fst.av,fst.col)}">${fst.av}</div>
      </div>
      <div class="pd-name" style="font-size:12px;font-weight:800;">${fst.name.replace('\n','<br>')}</div>
      <div class="pd-score">${fst.score}<small>m²</small></div>
      <div class="pd-plat"><span class="pd-num">1</span></div>
    </div>
    <div class="pd p3" onclick="goProfile('${thd.uid}')">
      <div class="pd-av" style="${thd.isMe?ME_STYLE:avStyle(thd.av,thd.col)}">${thd.av}</div>
      <div class="pd-name">${thd.name.replace('\n','<br>')}</div>
      <div class="pd-score" style="color:var(--bronze);">${thd.score}<small>m²</small></div>
      <div class="pd-plat"><span class="pd-num">3</span></div>
    </div>`;
}

/* ── RENDER LISTA ── */
const locIco=`<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>`;

function renderList(listData){
  const c=document.getElementById('rankList');
  c.innerHTML='';
  listData.forEach((r,i)=>{
    const col = r.col || AV_C[r.av] || '#a084fd';
    const href = r.id ? `perfil.html?user=${r.id}` : `perfil.html?user=${r.uid||r.av}`;
    const addBtn = (r.id && !r.isMe && !r.ehAmigo)
      ? `<button class="radd" onclick="event.preventDefault();event.stopPropagation();addFriend(${r.id},this)" title="Adicionar amigo">+</button>`
      : '';
    const sublbl = r.id ? `${r.wins} corridas` : `${r.wins} vitórias`;
    const usernameHtml = r.username ? `<div class="rusername">@${r.username}</div>` : '';
    const el=document.createElement('a');
    el.className='ritem' + (r.isMe ? ' me' : '');
    el.href = href;
    el.style.animationDelay=`${i*55}ms`;
    el.innerHTML=`
      <div class="rpos">${r.pos}</div>
      <div class="rav" style="background:${col}1e;color:${col};border-color:${col}65;">${r.av}</div>
      <div class="rinfo">
        <div class="rname">${r.n}${r.isMe?' <span class="you-tag">Você</span>':''}</div>
        ${usernameHtml}
        <div class="rsub">${locIco} ${r.city} · ${sublbl}</div>
      </div>
      <div class="rmeta">
        <div class="rm2">${r.m2} m²</div>
        <div class="rkm">${r.km} km</div>
      </div>
      <div class="trend ${r.t}">${r.t==='up'?'↑':'↓'}</div>
      ${addBtn}`;
    c.appendChild(el);
  });
}

/* ── RENDER MINHA POSIÇÃO (mock fallback) ── */
function renderMyPos(pos,trend){
  const u = (typeof RC !== 'undefined') ? RC.getUser() : null;
  const ini = u ? u.nome.trim().split(' ').filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase() : 'JS';
  const nome = u ? u.nome : 'João Silva';
  const usernameHtml = u?.username ? `<div class="rusername">@${u.username}</div>` : '';
  document.getElementById('myPosItem').innerHTML=`
    <a class="ritem me" href="perfil.html">
      <div class="rpos" style="color:var(--p-l);">${pos}</div>
      <div class="rav" style="background:var(--p-dim);color:var(--p-l);border-color:var(--p);">${ini}</div>
      <div class="rinfo">
        <div class="rname">${nome} <span class="you-tag">Você</span></div>
        ${usernameHtml}
        <div class="rsub">${locIco} ${u?.cidade||'São Paulo'} · 0 corridas</div>
      </div>
      <div class="rmeta">
        <div class="rm2">0 m²</div>
        <div class="rkm">0 km</div>
      </div>
      <div class="trend ${trend}">${trend==='up'?'↑':'↓'}</div>
    </a>`;
}

/* ── RENDER MINHA POSIÇÃO (dados reais) ── */
function renderMyPosReal(myItem){
  const ion = document.getElementById('myPosItem');
  if (!myItem) {
    const u = (typeof RC !== 'undefined') ? RC.getUser() : null;
    if (!u) { ion.innerHTML = ''; return; }
    const ini = u.nome.trim().split(' ').filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase();
    ion.innerHTML=`
      <div class="ritem me" style="cursor:default;">
        <div class="rpos" style="color:var(--p-l);">—</div>
        <div class="rav" style="background:var(--p-dim);color:var(--p-l);border-color:var(--p);">${ini}</div>
        <div class="rinfo">
          <div class="rname">${u.nome} <span class="you-tag">Você</span></div>
          ${u.username ? `<div class="rusername">@${u.username}</div>` : ''}
          <div class="rsub">${locIco} Brasil · 0 corridas</div>
        </div>
        <div class="rmeta"><div class="rm2">0 m²</div><div class="rkm">0 km</div></div>
        <div class="trend up">—</div>
      </div>`;
    return;
  }
  ion.innerHTML=`
    <a class="ritem me" href="perfil.html">
      <div class="rpos" style="color:var(--p-l);">${myItem.pos}</div>
      <div class="rav" style="background:var(--p-dim);color:var(--p-l);border-color:var(--p);">${myItem.iniciais}</div>
      <div class="rinfo">
        <div class="rname">${myItem.nome} <span class="you-tag">Você</span></div>
        ${myItem.username ? `<div class="rusername">@${myItem.username}</div>` : ''}
        <div class="rsub">${locIco} ${myItem.cidade} · ${myItem.corridas} corridas</div>
      </div>
      <div class="rmeta">
        <div class="rm2">${fmtM2(myItem.m2)} m²</div>
        <div class="rkm">${Math.round(myItem.km)} km</div>
      </div>
      <div class="trend up">↑</div>
    </a>`;
}

/* ── NAVEGAR PARA PERFIL ── */
function goProfile(uid){
  window.location.href=`perfil.html?user=${uid}`;
}

/* ── CARREGAR RANKING DA API ── */
async function carregarRankingAPI(scope, period){
  const token = (typeof RC !== 'undefined') ? RC.getToken() : null;
  const headers = token ? { Authorization: 'Bearer ' + token } : {};
  try {
    const params = new URLSearchParams({ escopo: scope, periodo: period });
    const res = await fetch(`/api/ranking?${params}`, { headers });
    if (res.ok) return await res.json();
  } catch {}
  return null;
}

/* ── ADICIONAR AMIGO ── */
async function addFriend(id, btn){
  const token = (typeof RC !== 'undefined') ? RC.getToken() : null;
  if (!token) { showToast('Faça login para adicionar amigos'); return; }
  btn.disabled = true;
  btn.textContent = '…';
  try {
    const res = await fetch(`/api/amigos/${id}`, {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token }
    });
    if (res.ok) {
      btn.textContent = '✓';
      btn.style.color = 'var(--ok)';
      btn.style.borderColor = 'rgba(34,197,94,.3)';
      showToast('Pedido de amizade enviado!');
    } else {
      const d = await res.json().catch(()=>({}));
      showToast(d.erro || 'Erro ao enviar pedido');
      btn.disabled = false;
      btn.textContent = '+';
    }
  } catch {
    showToast('Sem conexão');
    btn.disabled = false;
    btn.textContent = '+';
  }
}

/* ── RENDER RANKING (escopo + período) ── */
async function renderRanking(scope, period){
  const podium = document.getElementById('podium');
  podium.classList.add('fading');

  const token = (typeof RC !== 'undefined') ? RC.getToken() : null;
  const [apiItems] = await Promise.all([
    carregarRankingAPI(scope, period),
    new Promise(r => setTimeout(r, 200))
  ]);

  if (apiItems !== null) {
    // Temos resposta da API — usa sempre, independente de quantos itens
    let scopeLabelText = SCOPE_LABELS[scope] || scope;
    if (scope === 'cidade') {
      // Usa a cidade do usuário logado, ou do primeiro item disponível
      const me = apiItems.find(r => r.isMe);
      const cidade = me?.cidade || apiItems[0]?.cidade || null;
      if (cidade) scopeLabelText = cidade;
    }
    document.getElementById('scopeLabel').textContent = scopeLabelText;

    const toItem = r => ({
      id:       r.id,
      uid:      String(r.id),
      av:       r.iniciais,
      n:        r.nome,
      name:     r.nome.replace(/\s+/, '\n'),
      score:    fmtM2(r.m2),
      city:     r.cidade,
      m2:       fmtM2(r.m2),
      km:       Math.round(r.km),
      wins:     r.corridas,
      pos:      r.pos,
      t:        'up',
      isMe:     r.isMe,
      ehAmigo:  r.ehAmigo,
      col:      userColor(r.id),
      username: r.username || null,
    });

    if (apiItems.length === 0) {
      // Ranking vazio — mensagem contextual
      const msgs = {
        cidade:  'Nenhum corredor na sua cidade ainda. Seja o primeiro!',
        amigos:  'Você ainda não tem amigos no ranking. Adicione alguém!',
        global:  'Nenhuma corrida registrada ainda.',
      };
      document.getElementById('podium').innerHTML = '';
      document.getElementById('rankList').innerHTML =
        `<p style="text-align:center;color:var(--t2);padding:32px 0;font-size:13px;">${msgs[scope] || 'Nenhum resultado.'}</p>`;
      renderMyPosReal(null);
    } else if (apiItems.length < 3) {
      // Menos de 3 — renderiza lista simples sem pódio
      document.getElementById('podium').innerHTML = '';
      renderList(apiItems.map(toItem));
      renderMyPosReal(apiItems.find(r => r.isMe) || null);
    } else {
      const top3 = apiItems.slice(0, 3).map(toItem);
      const rest = apiItems.slice(3).map(toItem);
      renderPodium([top3[1] || top3[0], top3[0], top3[2] || top3[0]]);
      renderList(rest);
      renderMyPosReal(apiItems.find(r => r.isMe) || null);
    }
  } else if (!token) {
    // Sem login e sem resposta — exibe mock como demonstração
    const data = BUILDERS[scope](period);
    document.getElementById('scopeLabel').textContent = data.label;
    renderPodium(data.podium);
    renderList(data.list);
    renderMyPos(data.myPos, data.myTrend);
  } else {
    // Erro de rede com login — mensagem de erro
    document.getElementById('podium').innerHTML = '';
    document.getElementById('rankList').innerHTML =
      '<p style="text-align:center;color:var(--t2);padding:32px 0;font-size:13px;">Erro ao carregar ranking. Tente novamente.</p>';
    renderMyPosReal(null);
  }

  podium.classList.remove('fading');
}

/* ── CHANGE SCOPE ── */
function changeScope(scope, el){
  if(scope===currentScope) return;
  currentScope=scope;
  document.querySelectorAll('#scopeG .seg-opt').forEach(o=>o.classList.remove('active'));
  el.classList.add('active');
  renderRanking(scope, currentPeriod);
}

/* ── PILL (período) ── */
function pill(el, period){
  document.querySelectorAll('#pillsRow .pill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  currentPeriod=period;
  renderRanking(currentScope, period);
}

/* ── TOAST ── */
let _tt;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(_tt); _tt=setTimeout(()=>t.classList.remove('show'),2200);
}

(function(){
  renderRanking('cidade','diario');
})();

try{
  if(localStorage.getItem('rc_theme')==='light'){
    document.documentElement.setAttribute('data-theme','light');
  }
}catch(e){}
