<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RunCity — Perfil</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --p:#7c5cfc; --p-l:#a084fd; --p-ll:#c4b5fd; --p-d:#5b3fd8;
      --p-dim:rgba(124,92,252,.1); --p-mid:rgba(124,92,252,.22); --p-glow:rgba(124,92,252,.38);
      --gold:#e8a020; --ok:#22c55e;
      --bg:#08061a; --c0:#100e24; --c1:#170f32; --brd:#231848; --brd2:#190e38;
      --t1:#ede8ff; --t2:#5e5280; --t3:#9488c0;
      --ff-d:'Bebas Neue',sans-serif; --ff-b:'Outfit',sans-serif;
    }
    [data-theme="light"] {
      --bg:#f8f7ff; --c0:#eeebff; --c1:#e4dfff; --brd:#cdc5f0; --brd2:#d8d0f8;
      --t1:#160f38; --t2:#6e60a0; --t3:#453880;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:#050410;font-family:var(--ff-b);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;}
    [data-theme="light"] body{background:#eae7f8;}

    /* PHONE */
    .phone{width:390px;height:844px;background:var(--bg);border-radius:46px;border:1.5px solid var(--brd);overflow:hidden;position:relative;box-shadow:0 0 0 1px rgba(124,92,252,.05),0 40px 100px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.04);animation:slideUp .5s cubic-bezier(.08,.82,.17,1) both;flex-shrink:0;transition:border-color .3s;}
    .pscroll{width:100%;height:100%;overflow-y:auto;overflow-x:hidden;}
    .pscroll::-webkit-scrollbar{width:2px;}
    .pscroll::-webkit-scrollbar-thumb{background:var(--brd);border-radius:2px;}
    .pbody{padding-bottom:84px;}

    /* HEADER */
    .shdr{display:flex;align-items:center;gap:10px;padding:10px 20px 14px;position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--brd2);transition:background .3s,border-color .3s;}
    @supports (backdrop-filter:blur(1px)){.shdr{backdrop-filter:blur(24px);background:color-mix(in srgb,var(--bg) 85%,transparent);}}
    .back{width:36px;height:36px;border-radius:50%;background:var(--c0);border:1px solid var(--brd);display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--t1);transition:all .22s;flex-shrink:0;}
    .back:hover{background:var(--p-dim);border-color:var(--p-mid);color:var(--p-l);transform:translateX(-2px);}
    .shdr-title{font-family:var(--ff-d);font-size:22px;letter-spacing:2px;color:var(--t1);flex:1;}
    .hdr-btn{width:36px;height:36px;border-radius:50%;background:var(--c0);border:1px solid var(--brd);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t1);transition:all .22s;flex-shrink:0;text-decoration:none;}
    .hdr-btn:hover{background:var(--p-dim);border-color:var(--p-mid);color:var(--p-l);}
    .logout-btn:hover{background:rgba(239,68,68,.12)!important;border-color:rgba(239,68,68,.35)!important;color:#ef4444!important;transform:translateX(2px);}

    /* HERO */
    .p-hero{padding:20px 20px 16px;text-align:center;position:relative;}
    .p-hero::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:280px;height:200px;background:radial-gradient(ellipse,var(--p-glow) 0%,transparent 68%);opacity:.12;pointer-events:none;}
    .av-wrap{display:inline-block;position:relative;margin-bottom:16px;}
    .av{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--ff-d);font-size:26px;background:var(--p-dim);color:var(--p-l);border:3px solid var(--p);box-shadow:0 0 0 5px var(--p-dim),0 0 30px var(--p-glow);animation:glow 3s ease-in-out infinite;}
    @keyframes glow{0%,100%{box-shadow:0 0 0 5px var(--p-dim),0 0 26px rgba(124,92,252,.3);}50%{box-shadow:0 0 0 8px var(--p-dim),0 0 42px rgba(124,92,252,.55);}}
    .lv{position:absolute;bottom:0;right:-8px;background:var(--p);color:#fff;font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;border:2px solid var(--bg);white-space:nowrap;letter-spacing:.3px;}
    .p-name{font-family:var(--ff-d);font-size:28px;letter-spacing:2px;color:var(--t1);margin-bottom:4px;}
    .p-username{font-size:13px;font-weight:600;color:var(--p-l);margin-bottom:5px;letter-spacing:.3px;}
    .p-role{font-size:12px;font-weight:600;color:var(--t3);margin-bottom:8px;letter-spacing:.3px;}
    .p-loc{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--t2);font-weight:500;}

    /* XP */
    .xp{padding:0 20px 16px;}
    .xp-hdr{display:flex;justify-content:space-between;margin-bottom:7px;}
    .xp-l{font-size:11px;font-weight:700;color:var(--t2);letter-spacing:.5px;}
    .xp-v{font-size:11px;font-weight:700;color:var(--p-l);}
    .xp-track{height:5px;background:var(--c0);border-radius:3px;overflow:hidden;border:1px solid var(--brd2);}
    .xp-fill{height:100%;width:0;background:linear-gradient(90deg,var(--p-d),var(--p-l));border-radius:3px;position:relative;overflow:hidden;transition:width 1s cubic-bezier(.08,.82,.17,1);}
    .xp-fill::after{content:'';position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shim 2.4s ease-in-out infinite;}
    @keyframes shim{from{left:-80%}to{left:180%}}

    /* STATS GRID */
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 20px 14px;}
    .stile{background:var(--c0);border:1px solid var(--brd2);border-radius:12px;padding:12px 6px;text-align:center;cursor:default;transition:all .2s;}
    .stile:hover{border-color:var(--p-mid);transform:translateY(-2px);}
    .sv{font-family:var(--ff-d);font-size:18px;letter-spacing:.4px;color:var(--p-l);line-height:1;}
    .sl{font-size:9px;font-weight:700;color:var(--t2);margin-top:5px;text-transform:uppercase;letter-spacing:.5px;}

    /* ABAS */
    .ptabs{display:flex;padding:10px 20px;gap:4px;position:sticky;top:64px;z-index:40;background:var(--bg);transition:background .3s;}
    @supports (backdrop-filter:blur(1px)){.ptabs{backdrop-filter:blur(20px);background:color-mix(in srgb,var(--bg) 88%,transparent);}}
    .ptab{flex:1;text-align:center;padding:9px 4px;border-radius:9px;font-size:10px;font-weight:700;letter-spacing:.3px;cursor:pointer;transition:all .2s;color:var(--t2);text-transform:uppercase;border:1px solid transparent;}
    .ptab.active{background:var(--p-dim);color:var(--p-ll);border-color:var(--p-mid);}

    .tbody{padding:0 20px;}
    .pane{display:none;animation:paneIn .25s ease;}
    .pane.active{display:block;}
    @keyframes paneIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

    /* STATS PANE */
    .bcard{background:var(--c0);border:1px solid var(--brd2);border-radius:14px;padding:16px;margin-bottom:8px;}
    .bc-lbl{font-size:10px;font-weight:700;color:var(--t2);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:7px;}
    .bc-val{font-family:var(--ff-d);font-size:32px;letter-spacing:1px;color:var(--p-l);line-height:1;}
    .bc-sub{font-size:11px;color:var(--t2);margin-top:5px;}
    .card-row{display:flex;gap:8px;margin-bottom:8px;}
    .card-row .bcard{flex:1;margin-bottom:0;}
    .card-row .bc-val{font-size:24px;}
    .map-btn{width:100%;background:var(--p-dim);border:1.5px solid var(--p-mid);color:var(--p-ll);padding:13px;border-radius:13px;font-size:13px;font-weight:700;font-family:var(--ff-b);cursor:pointer;letter-spacing:.4px;transition:all .22s;display:flex;align-items:center;justify-content:center;gap:8px;}
    .map-btn:hover{background:var(--p-mid);transform:translateY(-1px);}

    /* CONQUISTAS */
    .ach-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
    .ach{background:var(--c0);border:1px solid var(--brd2);border-radius:13px;padding:14px 8px;text-align:center;transition:all .22s;}
    .ach.on{border-color:var(--p-mid);background:var(--p-dim);}
    .ach.on:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(124,92,252,.2);}
    .ach.off{opacity:.35;}
    .ach-ico{margin-bottom:8px;display:flex;justify-content:center;}
    .ach-name{font-size:10px;font-weight:700;color:var(--t1);line-height:1.3;}
    .ach-foot{text-align:center;font-size:11px;color:var(--t2);padding-bottom:4px;}

    /* HISTÓRICO */
    .hist{display:flex;flex-direction:column;gap:7px;}
    .hitem{background:var(--c0);border:1px solid var(--brd2);border-radius:13px;padding:12px 14px;display:flex;gap:12px;align-items:center;transition:all .2s;}
    .hitem:hover{border-color:var(--brd);}
    .hico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .hico.partida{background:rgba(232,160,32,.1);color:var(--gold);}
    .hinfo{flex:1;}
    .htype{font-size:10px;font-weight:800;color:var(--t3);letter-spacing:1px;text-transform:uppercase;}
    .hdate{font-size:11px;color:var(--t2);margin-top:1px;}
    .hmeta{text-align:right;flex-shrink:0;}
    .hm2{font-family:var(--ff-d);font-size:17px;letter-spacing:.4px;color:var(--p-l);}
    .rtag{display:inline-block;margin-top:3px;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:800;}
    .rtag.gold  {background:rgba(232,160,32,.12);color:var(--gold);border:1px solid rgba(232,160,32,.28);}
    .rtag.silver{background:rgba(140,160,184,.12);color:#8ca0b8;border:1px solid rgba(140,160,184,.28);}
    .rtag.purple{background:var(--p-dim);color:var(--p-ll);border:1px solid var(--p-mid);}

    /* AMIGOS */
    .friends-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-top:2px;}
    .friends-count{font-size:11px;font-weight:700;color:var(--t2);letter-spacing:.8px;}
    .friends-count span{color:var(--p-l);}
    .friend-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--c0);border:1px solid var(--brd2);border-radius:13px;margin-bottom:7px;cursor:pointer;transition:all .22s;text-decoration:none;position:relative;overflow:hidden;}
    .friend-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;transition:background .2s;}
    .friend-item:hover{border-color:var(--brd);transform:translateX(3px);}
    .friend-item:hover::before{background:var(--p);}
    .f-av{width:42px;height:42px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--ff-d);font-size:14px;border:2px solid;transition:transform .2s;}
    .friend-item:hover .f-av{transform:scale(1.08);}
    .f-info{flex:1;min-width:0;}
    .f-name{font-size:14px;font-weight:700;color:var(--t1);}
    .f-username{font-size:11px;color:var(--p-l);margin-top:1px;}
    .f-sub{font-size:11px;color:var(--t2);margin-top:2px;display:flex;align-items:center;gap:5px;}
    .f-meta{text-align:right;flex-shrink:0;}
    .f-m2{font-family:var(--ff-d);font-size:15px;color:var(--p-l);}
    .f-wins{font-size:10px;color:var(--t2);margin-top:2px;}
    .f-arrow{color:var(--t2);flex-shrink:0;transition:transform .2s,color .2s;margin-left:2px;}
    .friend-item:hover .f-arrow{transform:translateX(4px);color:var(--p-l);}
    .online-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex-shrink:0;box-shadow:0 0 6px rgba(34,197,94,.5);}
    .f-remove{width:28px;height:28px;border-radius:50%;background:transparent;border:1.5px solid var(--brd);color:var(--t2);font-size:14px;cursor:pointer;flex-shrink:0;transition:all .2s;display:flex;align-items:center;justify-content:center;padding:0;margin-left:4px;}
    .f-remove:hover{border-color:rgba(239,68,68,.4);color:#ef4444;background:rgba(239,68,68,.08);}

    /* NAV */
    .nav{position:absolute;bottom:0;left:0;right:0;height:78px;background:var(--bg);border-top:1px solid var(--brd);display:flex;z-index:100;transition:background .3s,border-color .3s;}
    @supports (backdrop-filter:blur(1px)){.nav{backdrop-filter:blur(24px);background:color-mix(in srgb,var(--bg) 90%,transparent);}}
    .nit{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;transition:color .2s;color:var(--t2);position:relative;text-decoration:none;}
    .nit::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:2px;background:var(--p);border-radius:0 0 2px 2px;transition:width .22s;}
    .nit.active{color:var(--p-l);}
    .nit.active::after{width:22px;}
    .nit:hover{color:var(--t3);}
    .nlbl{font-size:9px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;}

    /* TOAST */
    .toast{position:fixed;bottom:36px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--c1);border:1px solid var(--p-mid);color:var(--p-ll);padding:10px 22px;border-radius:30px;font-size:12px;font-weight:600;z-index:9999;white-space:nowrap;pointer-events:none;opacity:0;transition:all .28s;box-shadow:0 8px 30px rgba(0,0,0,.5);}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

    @keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;}}
    @media (max-width:440px){.phone{width:100vw;height:100vh;border-radius:0;border:none;}body{padding:0;}}
  </style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="phone">
  <div class="pscroll">

    <div class="pbody">

      <div class="shdr">
        <a class="back" href="javascript:history.back()" title="Voltar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 5l-7 7 7 7"/></svg>
        </a>
        <div class="shdr-title" id="shdrTitle">Perfil</div>
        <button class="hdr-btn" onclick="toggleTheme()" title="Alternar tema">
          <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
          </svg>
        </button>
        <button class="hdr-btn" id="friendBtn" style="display:none" onclick="acaoAmizade()" title="Amizade"></button>
        <a class="hdr-btn logout-btn" id="logoutBtn" href="login.html" title="Sair" onclick="return confirmLogout()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </a>
      </div>

      <!-- Hero -->
      <div class="p-hero">
        <div class="av-wrap">
          <div class="av" id="heroAv"></div>
          <div class="lv" id="heroLv"></div>
        </div>
        <div class="p-name" id="heroName"></div>
        <div class="p-username" id="heroUsername"></div>
        <div class="p-role" id="heroRole"></div>
        <div class="p-loc">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
          <span id="heroCity"></span>
        </div>
      </div>

      <!-- XP -->
      <div class="xp">
        <div class="xp-hdr">
          <span class="xp-l" id="xpLabel"></span>
          <span class="xp-v" id="xpVal"></span>
        </div>
        <div class="xp-track"><div class="xp-fill" id="xpFill"></div></div>
      </div>

      <!-- Stats -->
      <div class="stats" id="statsGrid"></div>

      <!-- Abas (injetadas por JS) -->
      <div class="ptabs" id="tabsRow"></div>

      <div class="tbody">

        <div class="pane active" id="pane-stats">
          <div class="bcard">
            <div class="bc-lbl">Melhor partida</div>
            <div class="bc-val" id="bestGame"></div>
            <div class="bc-sub" id="bestGameSub"></div>
          </div>
          <div class="card-row">
            <div class="bcard">
              <div class="bc-lbl">Maior área ativa</div>
              <div class="bc-val" id="maxArea"></div>
              <div class="bc-sub" id="maxAreaSub"></div>
            </div>
            <div class="bcard">
              <div class="bc-lbl">Taxa de vitória</div>
              <div class="bc-val" id="winRate"></div>
              <div class="bc-sub" id="winRateSub"></div>
            </div>
          </div>
          <button class="map-btn" onclick="showToast('Abrindo mapa de território…')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
            Ver território na cidade
          </button>
        </div>

        <div class="pane" id="pane-conquistas">
          <div class="ach-grid">
            <div class="ach on"><div class="ach-ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg></div><div class="ach-name">1ª Vitória</div></div>
            <div class="ach off"><div class="ach-ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></div><div class="ach-name">5 em Sequência</div></div>
            <div class="ach on"><div class="ach-ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--p-l)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></div><div class="ach-name">10km rodados</div></div>
            <div class="ach off"><div class="ach-ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></div><div class="ach-name">Dono da Cidade</div></div>
            <div class="ach on"><div class="ach-ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--p-l)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="14 2 18 6 7 17 3 17 3 13 14 2"/><line x1="3" y1="22" x2="21" y2="22"/></svg></div><div class="ach-name">Roubo Épico</div></div>
            <div class="ach off"><div class="ach-ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></div><div class="ach-name">Maratonista</div></div>
          </div>
          <div class="ach-foot" id="achFoot"></div>
        </div>

        <div class="pane" id="pane-historico">
          <div class="hist" id="histList"></div>
        </div>

        <div class="pane" id="pane-amigos">
          <div class="friends-hdr">
            <div class="friends-count">Amigos: <span id="friendCount">0</span></div>
          </div>
          <div id="friendsList"></div>
        </div>

      </div>
    </div>

    <nav class="nav">

function toTitleCase(s){ return s.split(' ').map(w=>w[0]+w.slice(1).toLowerCase()).join(' '); }

function fmtM2(v) {
  v = parseFloat(v) || 0;
  return v >= 1000 ? (v / 1000).toFixed(1) + 'k' : String(Math.round(v));
}

function apiParaPerfil(d, isMe) {
  const iniciais = d.nome.trim().split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
  const lv    = d.nivel || 1;
  const total = d.corridas || 0;
  const wins  = d.vitorias || 0;
  const taxa  = total > 0 ? Math.round(wins / total * 100) + '%' : '—';

  const hist = (d.historico || []).map(h => {
    const dt   = new Date(h.criada_em).toLocaleDateString('pt-BR', { day:'2-digit', month:'short', year:'numeric' });
    const pos  = h.posicao;
    const cls  = pos === 1 ? 'gold' : pos === 2 ? 'silver' : 'purple';
    const txt  = pos <= 3 ? pos + 'º lugar' : pos + 'º lugar';
    return { data: dt, m2: fmtM2(h.m2) + ' m²', res: { txt, cls } };
  });

  return {
    id:    d.id,
    av:    iniciais,
    name:  d.nome.toUpperCase(),
    username: d.username || null,
    role:  'Corredor Urbano',
    city:  d.cidade || 'Brasil',
    lv,
    xpCur: d.xp || 0,
    xpMax: d.xp_max || lv * 1000,
    stats: {
      m2:       fmtM2(d.m2_total),
      corridas: total,
      vitorias: wins,
      km:       (parseFloat(d.km_total) || 0).toFixed(1) + ' km',
    },
    bestGame:    d.melhor_m2 > 0 ? fmtM2(d.melhor_m2) + ' m²' : '—',
    bestGameSub: d.melhor_m2 > 0 ? 'Melhor resultado' : 'Nenhuma partida ainda',
    maxArea:     d.melhor_m2 > 0 ? fmtM2(d.melhor_m2) + ' m²' : '—',
    maxAreaSub:  d.cidade || '—',
    winRate:     taxa,
    winRateSub:  total > 0 ? `${wins} de ${total} partidas` : 'Nenhuma partida ainda',
    historico:   hist,
    friends:     [],
    isMe,
  };
}

/* ── RESOLUÇÃO DO PERFIL ── */
const userParam = new URLSearchParams(location.search).get('user');

async function carregarPerfil() {
  // perfil próprio — sem parâmetro
  if (!userParam) {
    const sessao = RC.getUser();
    if (!sessao || !RC.getToken()) { window.location.replace('login.html'); return; }

    try {
      const res = await fetch('/api/users/me', {
        headers: { Authorization: 'Bearer ' + RC.getToken() },
      });
      if (res.ok) {
        renderProfile(apiParaPerfil(await res.json(), true));
        return;
      }
    } catch {}

    // sem banco — usa dados da sessão
    const iniciais = sessao.nome.trim().split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
    renderProfile({
      av: iniciais, name: sessao.nome.toUpperCase(),
      username: sessao.username || null,
      role: 'Corredor Urbano', city: sessao.cidade || 'Brasil',
      lv: sessao.nivel || 1, xpCur: sessao.xp || 0, xpMax: (sessao.nivel || 1) * 1000,
      stats: { m2: '0', corridas: 0, vitorias: 0, km: '0 km' },
      bestGame: '—', bestGameSub: 'Nenhuma partida ainda',
      maxArea: '—', maxAreaSub: '—', winRate: '—', winRateSub: '—',
      historico: [], friends: [], isMe: true,
    });
    return;
  }

  // perfil de outro utilizador — por ID numérico
  const numId = parseInt(userParam);
  if (!isNaN(numId)) {
    try {
      const res = await fetch('/api/users/' + numId);
      if (res.ok) {
        renderProfile(apiParaPerfil(await res.json(), false));
        carregarStatusAmizade(numId);
        return;
      }
    } catch {}
  }

  // fallback para dados mock (IDs antigos baseados em iniciais)
  const userId = userParam.toUpperCase();
  renderProfile(USERS[userId] || USERS['JS']);
}

  usernameEl.style.display = u.username ? 'block' : 'none';
  document.getElementById('heroRole').textContent = u.role;
  document.getElementById('heroCity').textContent = u.city;

  // XP

  document.getElementById('maxAreaSub').textContent  = u.maxAreaSub;

    hl.innerHTML = '<p style="text-align:center;color:var(--t2);padding:28px 0;font-size:13px;">Nenhuma partida ainda</p>';
  } else {
    u.historico.forEach(h => {
      const el = document.createElement('div');
      el.className = 'hitem';
      el.innerHTML = `
        <div class="hico partida">${icoPartida}</div>
        <div class="hinfo"><div class="htype">Partida</div><div class="hdate">${h.data}</div></div>
        <div class="hmeta"><div class="hm2">${h.m2}</div><span class="rtag ${h.res.cls}">${h.res.txt}</span></div>`;
      hl.appendChild(el);
    });

  // Abas
  const tabs = document.getElementById('tabsRow');
  if(u.isMe){
    tabs.innerHTML=`
      <div class="ptab active" onclick="mudarAba('stats',this)">Stats</div>

    tabs.innerHTML=`
      <div class="ptab active" onclick="mudarAba('stats',this)">Stats</div>

/* ── Amigos reais ── */
async function carregarAmigos() {
  const token = RC.getToken();
  const fl    = document.getElementById('friendsList');
  const locIco = `<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>`;
  const arrowIco = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>`;

  if (token) {
    try {
      const res = await fetch('/api/amigos', { headers: { Authorization: 'Bearer ' + token } });
      if (res.ok) {
        const amigos = await res.json();
        document.getElementById('friendCount').textContent = amigos.length;
        // Atualiza contador na aba
        const abaAmigos = document.querySelector('.ptab[onclick*="amigos"]');
        if (abaAmigos) abaAmigos.innerHTML = `Amigos&nbsp;<span style="opacity:.65;font-size:9px;">(${amigos.length})</span>`;
        fl.innerHTML = '';
        if (!amigos.length) {
          fl.innerHTML = '<p style="text-align:center;color:var(--t2);padding:28px 0;font-size:13px;">Nenhum amigo ainda</p>';
          return;
        }
        amigos.forEach(f => {
          const ini = f.nome.trim().split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
          const cor = AV_C[ini] || '#a084fd';
          const el  = document.createElement('div');
          el.className = 'friend-item';
          el.style.cursor = 'default';
          el.innerHTML = `
            <a href="perfil.html?user=${f.id}" style="display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-decoration:none;">
              <div class="f-av" style="background:${cor}1e;color:${cor};border-color:${cor};">${ini}</div>
              <div class="f-info">
                <div class="f-name">${f.nome}</div>
                ${f.username ? `<div class="f-username">@${f.username}</div>` : ''}
                <div class="f-sub">${locIco} ${(f.cidade || 'Brasil').split(',')[0]} · Nível ${f.nivel}</div>
              </div>
            </a>
            <button class="f-remove" onclick="removerAmigo(${f.id}, this)" title="Remover amigo">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
            </button>`;
          fl.appendChild(el);
        });
        return;
      }
    } catch {}
  }
  document.getElementById('friendCount').textContent = '0';
  fl.innerHTML = '<p style="text-align:center;color:var(--t2);padding:28px 0;font-size:13px;">Nenhum amigo ainda</p>';
}

async function removerAmigo(id, btn) {
  const token = RC.getToken();
  if (!token) return;
  btn.disabled = true;
  try {
    const res = await fetch(`/api/amigos/${id}`, {
      method: 'DELETE',
      headers: { Authorization: 'Bearer ' + token },
    });
    if (res.ok) {
      showToast('Amigo removido.');
      carregarAmigos();
    } else {
      showToast('Erro ao remover amigo.');
      btn.disabled = false;
    }
  } catch {
    showToast('Sem conexão.');
    btn.disabled = false;
  }
}

/* ── Botão de amizade (perfis de outros utilizadores) ── */
let _friendStatus = 'nenhuma';
let _friendTargetId = null;

async function carregarStatusAmizade(userId) {
  _friendTargetId = userId;
  const btn   = document.getElementById('friendBtn');
  const token = RC.getToken();
  if (!token) return;

  btn.style.display = 'flex';
  _renderFriendBtn('nenhuma');

  try {
    const res = await fetch(`/api/amigos/status/${userId}`, {
      headers: { Authorization: 'Bearer ' + token },
    });
    if (res.ok) {
      const { status } = await res.json();
      _friendStatus = status;
      _renderFriendBtn(status);
    }
  } catch {}
}

function _renderFriendBtn(status) {
  const btn = document.getElementById('friendBtn');
  const icons = {
    nenhuma: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>`,
    enviado: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></svg>`,
    pendente: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></svg>`,
    aceite: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>`,
  };
  btn.innerHTML = icons[status] || icons.nenhuma;
  btn.title = { nenhuma:'Adicionar amigo', enviado:'Pedido enviado', pendente:'Aceitar pedido', aceite:'Amigos' }[status] || 'Adicionar amigo';
}

async function acaoAmizade() {
  const token = RC.getToken();
  if (!token || !_friendTargetId) return;

  if (_friendStatus === 'nenhuma') {
    try {
      const res = await fetch(`/api/amigos/${_friendTargetId}`, {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + token },
      });
      if (res.ok || res.status === 409) {
        _friendStatus = 'enviado';
        _renderFriendBtn('enviado');
        showToast('Pedido de amizade enviado!');
      }
    } catch {}
  } else if (_friendStatus === 'pendente') {
    try {
      const res = await fetch(`/api/amigos/${_friendTargetId}/aceitar`, {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + token },
      });
      if (res.ok) {
        _friendStatus = 'aceite';
        _renderFriendBtn('aceite');
        showToast('Amizade aceite!');
      }
    } catch {}
  } else if (_friendStatus === 'aceite') {
    showToast('Já são amigos');
  } else {
    showToast('Pedido já enviado');
  }
}

function mudarAba(id,el){

  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('pane-'+id).classList.add('active');
}

function confirmLogout(){
  showToast('Saindo da conta…');
  RC.limparSessao();
  setTimeout(()=>{ window.location.replace('login.html'); },900);
  return false;
}

let _tt;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(_tt); _tt=setTimeout(()=>t.classList.remove('show'),2200);
}
