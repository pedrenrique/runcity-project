<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RunCity — Corrida</title>
  <link rel="stylesheet" href="libs/leaflet.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --p:      #7c5cfc;
      --p-l:    #a084fd;
      --p-ll:   #c4b5fd;
      --p-d:    #5b3fd8;
      --p-dim:  rgba(124,92,252,.1);
      --p-mid:  rgba(124,92,252,.22);
      --p-glow: rgba(124,92,252,.38);
      --gold:   #e8a020;
      --silver: #8ca0b8;
      --bronze: #a0724a;
      --ok:     #22c55e;
      --err:    #ef4444;
      --bg:     #08061a;
      --c0:     #100e24;
      --c1:     #170f32;
      --brd:    #231848;
      --brd2:   #190e38;
      --t1:     #ede8ff;
      --t2:     #5e5280;
      --t3:     #9488c0;
      --ff-d:   'Bebas Neue', sans-serif;
      --ff-b:   'Outfit', sans-serif;
    }

    [data-theme="light"] {
      --bg:  #f8f7ff;
      --c0:  #eeebff;
      --c1:  #e4dfff;
      --brd: #cdc5f0;
      --brd2:#d8d0f8;
      --t1:  #160f38;
      --t2:  #6e60a0;
      --t3:  #453880;
    }

    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

    body {
      background: #050410;
      font-family: var(--ff-b);
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 32px 20px;
    }
    [data-theme="light"] body { background: #eae7f8; }

    /* ── PHONE ── */
    .phone {
      width: 390px; height: 844px;
      background: var(--bg);
      border-radius: 46px;
      border: 1.5px solid var(--brd);
      overflow: hidden; position: relative;
      box-shadow: 0 0 0 1px rgba(124,92,252,.05), 0 40px 100px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.04);
      animation: slideUp .5s cubic-bezier(.08,.82,.17,1) both;
      flex-shrink: 0;
      display: flex; flex-direction: column;
    }

    /* ── STATUS BAR ── */
    .sbar { display:flex; justify-content:space-between; align-items:center; padding:14px 24px 6px; color:var(--t1); }
    .sbar-time { font-size:15px; font-weight:700; }
    .sbar-right svg { color: var(--t1); }

    /* ── HEADER COM CRONÔMETRO ── */
    .topbar {
      display:flex; align-items:center; justify-content:space-between;
      padding: 8px 18px 12px;
      gap: 14px;
    }
    .crono-wrap {
      display:flex; align-items:center; gap:10px;
      background: var(--c0);
      border: 1px solid var(--brd2);
      border-radius: 14px;
      padding: 8px 16px;
      flex: 1;
    }
    .pulse-dot {
      width:8px; height:8px; border-radius:50%;
      background: var(--err);
      box-shadow: 0 0 0 0 rgba(239,68,68,.6);
      animation: pulse 1.4s infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(239,68,68,.55); }
      70%  { box-shadow: 0 0 0 10px rgba(239,68,68,0); }
      100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
    }
    .crono {
      font-family: var(--ff-d);
      font-size: 26px;
      letter-spacing: 2px;
      color: var(--t1);
      line-height: 1;
    }
    .crono-lbl {
      font-size: 9px; font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      color: var(--t2);
      margin-top: 2px;
    }

    .quit {
      width:42px; height:42px; border-radius:50%;
      background: var(--c0);
      border: 1px solid var(--brd);
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; color: var(--t2); transition: all .22s;
      flex-shrink: 0;
    }
    .quit:hover { color: var(--err); border-color: rgba(239,68,68,.4); }

    /* ── MAPA ── */
    .map-wrap {
      position: relative;
      flex: 1;
      overflow: hidden;
      margin: 0 18px;
      border-radius: 18px;
      border: 1px solid var(--brd2);
      min-height: 240px;
    }
    #mapa { width:100%; height:100%; background: var(--c0); }
    /* tile escuro sem alterar muito a leitura do leaflet */
    [data-theme="dark"] .leaflet-container { background: #1a1530; }
    .leaflet-control-attribution {
      background: rgba(8,6,26,.75) !important;
      color: var(--t3) !important;
      font-size: 9px !important;
    }
    .leaflet-control-attribution a { color: var(--p-l) !important; }

    /* chip flutuante de posição */
    .pos-chip {
      position: absolute;
      top: 12px; right: 12px;
      background: rgba(8,6,26,.78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--p-mid);
      border-radius: 14px;
      padding: 8px 12px;
      display:flex; align-items:center; gap:8px;
      z-index: 500;
    }
    .pos-chip .num {
      font-family: var(--ff-d);
      font-size: 22px;
      color: var(--p-l);
      line-height: 1;
    }
    .pos-chip .lbl {
      font-size: 9px; font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--t3);
    }

    /* ── PAINEL INFERIOR ── */
    .panel {
      padding: 14px 18px 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .area-card {
      background: linear-gradient(135deg, var(--p-dim) 0%, var(--c0) 100%);
      border: 1px solid var(--p-mid);
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .area-val {
      font-family: var(--ff-d);
      font-size: 38px;
      letter-spacing: 1.5px;
      color: var(--p-l);
      line-height: 1;
    }
    .area-val small {
      font-family: var(--ff-b);
      font-size: 13px;
      color: var(--t2);
      margin-left: 4px;
      letter-spacing: 0;
    }
    .area-lbl {
      font-size: 10px; font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      color: var(--t3);
      margin-top: 4px;
    }
    .area-ico {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: var(--p);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 18px rgba(124,92,252,.4);
      flex-shrink: 0;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }
    .stat {
      background: var(--c0);
      border: 1px solid var(--brd2);
      border-radius: 12px;
      padding: 10px 6px;
      text-align: center;
    }
    .stat-val {
      font-family: var(--ff-d);
      font-size: 18px;
      color: var(--t1);
      letter-spacing: .4px;
      line-height: 1;
    }
    .stat-lbl {
      font-size: 9px; font-weight: 700;
      color: var(--t2);
      text-transform: uppercase;
      letter-spacing: .8px;
      margin-top: 5px;
    }

    /* ── RANKING AO VIVO ── */
    .live {
      background: var(--c0);
      border: 1px solid var(--brd2);
      border-radius: 14px;
      padding: 10px 12px;
    }
    .live-hdr {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom: 8px;
    }
    .live-titulo {
      font-size: 10px; font-weight: 800;
      color: var(--t2);
      letter-spacing: 1.6px;
      text-transform: uppercase;
    }
    .live-dot {
      display:inline-flex; align-items:center; gap:5px;
      font-size: 10px; font-weight: 700; color: var(--ok);
      letter-spacing: .5px;
    }
    .live-dot::before {
      content:''; width:6px; height:6px; border-radius:50%;
      background: var(--ok);
      box-shadow: 0 0 8px var(--ok);
      animation: blink 1.6s ease-in-out infinite;
    }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

    .live-lst { list-style:none; display:flex; flex-direction:column; gap:6px; }
    .live-lst li {
      display:flex; align-items:center; gap:10px;
      font-size: 12px;
    }
    .live-lst .pos {
      font-family: var(--ff-d);
      font-size: 14px;
      width: 18px; text-align:center;
      color: var(--t2);
    }
    .live-lst li.eu .pos { color: var(--p-l); }
    .live-lst .nome {
      flex: 1; color: var(--t1); font-weight: 600;
      white-space: nowrap; overflow:hidden; text-overflow: ellipsis;
    }
    .live-lst li.eu .nome { color: var(--p-ll); }
    .live-lst .ar {
      font-family: var(--ff-d);
      font-size: 13px;
      color: var(--p-l);
      letter-spacing: .3px;
    }

    /* ── BOTÕES DE AÇÃO ── */
    .actions { display:flex; gap:10px; margin-top: 4px; }
    .btn-pause {
      flex: 1;
      height: 50px;
      background: var(--c0);
      border: 1px solid var(--brd);
      border-radius: 13px;
      color: var(--t1);
      font-family: var(--ff-b);
      font-size: 13px; font-weight: 700;
      letter-spacing: .8px; text-transform: uppercase;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all .22s;
    }
    .btn-pause:hover { border-color: var(--p-mid); color: var(--p-l); }
    .btn-pause.retomar { color: var(--ok); border-color: rgba(34,197,94,.35); }

    .btn-stop {
      flex: 1.4;
      height: 50px;
      background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
      border: none;
      border-radius: 13px;
      color: #fff;
      font-family: var(--ff-b);
      font-size: 13px; font-weight: 800;
      letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 8px 24px rgba(239,68,68,.32);
      transition: all .15s;
    }
    .btn-stop:hover { transform: translateY(-1px); box-shadow: 0 12px 32px rgba(239,68,68,.45); }

    /* ── RESULTADO (overlay) ── */
    .overlay {
      position: absolute; inset: 0;
      background: rgba(5,4,16,.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      z-index: 1000;
      animation: fadeOver .35s ease;
    }
    @keyframes fadeOver { from { opacity: 0; } to { opacity: 1; } }

    .escondido { display: none !important; }

    .res-card {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--p-mid);
      border-radius: 22px;
      padding: 22px 18px;
      display: flex; flex-direction: column;
      gap: 16px;
      box-shadow: 0 30px 80px rgba(124,92,252,.25);
    }

    .res-head {
      display: flex; flex-direction: column; align-items: center;
      gap: 4px;
    }
    .res-flag {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: var(--p-dim);
      border: 2px solid var(--p);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 4px;
      box-shadow: 0 0 30px var(--p-glow);
    }
    .res-titulo {
      font-family: var(--ff-d);
      font-size: 26px;
      letter-spacing: 2px;
      color: var(--t1);
    }
    .res-sub {
      font-size: 11px;
      color: var(--t2);
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .vencedor {
      background: linear-gradient(135deg, rgba(232,160,32,.14) 0%, var(--c0) 100%);
      border: 1px solid rgba(232,160,32,.4);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex; align-items: center; gap: 12px;
    }
    .v-medal {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: rgba(232,160,32,.15);
      color: var(--gold);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--ff-d);
      font-size: 18px;
      border: 2px solid var(--gold);
    }
    .v-info { flex: 1; }
    .v-lbl {
      font-size: 9px; font-weight: 800;
      color: var(--gold); letter-spacing: 1.6px;
      text-transform: uppercase;
    }
    .v-nome {
      font-size: 16px; font-weight: 700;
      color: var(--t1);
      margin-top: 2px;
    }
    .v-area {
      font-family: var(--ff-d);
      font-size: 22px; color: var(--gold);
      letter-spacing: .6px;
    }
    .v-area small {
      font-family: var(--ff-b);
      font-size: 10px; color: var(--t2);
      margin-left: 2px;
    }

    .res-rank { display: flex; flex-direction: column; gap: 6px; }
    .res-rank .item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px;
      background: var(--c0);
      border: 1px solid var(--brd2);
      border-radius: 11px;
      font-size: 12px;
    }
    .res-rank .item.eu {
      background: var(--p-dim);
      border-color: var(--p-mid);
    }
    .res-rank .pos {
      font-family: var(--ff-d);
      font-size: 14px;
      width: 22px; text-align: center;
      color: var(--t3);
    }
    .res-rank .item.eu .pos { color: var(--p-l); }
    .res-rank .nome { flex: 1; color: var(--t1); font-weight: 600; }
    .res-rank .ar { font-family: var(--ff-d); color: var(--p-l); letter-spacing: .3px; }

    .btn-continuar {
      width: 100%;
      height: 50px;
      background: linear-gradient(135deg, var(--p) 0%, var(--p-d) 100%);
      border: none; border-radius: 13px;
      color: #fff;
      font-family: var(--ff-b);
      font-size: 13px; font-weight: 800;
      letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(124,92,252,.35);
      transition: transform .15s, box-shadow .2s;
      margin-top: 4px;
    }
    .btn-continuar:hover { transform: translateY(-1px); box-shadow: 0 12px 32px rgba(124,92,252,.5); }

    @keyframes slideUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }

    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; }
    }

    @media (max-width:440px) {
      .phone { width:100vw; height:100vh; border-radius:0; border:none; }
      body { padding:0; }
    }
  </style>
</head>
<body>

<div class="phone">

  <!-- Status bar -->
  <div class="sbar">
    <span class="sbar-time" id="relogio">--:--</span>
    <div class="sbar-right">
      <svg width="22" height="11" viewBox="0 0 33 18" fill="currentColor">
        <rect x="0" y="0" width="29" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <rect x="30" y="5" width="3" height="8" rx="1"/>
        <rect x="2" y="2" width="19" height="14" rx="2"/>
      </svg>
    </div>
  </div>

  <!-- Cronômetro + sair -->
  <div class="topbar">
    <div class="crono-wrap">
      <span class="pulse-dot"></span>
      <div>
        <div class="crono" id="cronometro">00:00</div>
        <div class="crono-lbl">tempo restante</div>
      </div>
    </div>
    <a class="quit" href="index.html" title="Voltar para o lobby">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </a>
  </div>

  <!-- Mapa -->
  <div class="map-wrap">
    <div id="mapa"></div>
    <div class="pos-chip">
      <span class="num" id="minha-pos">1º</span>
      <span class="lbl">sua posição</span>
    </div>
  </div>

  <!-- Painel inferior -->
  <div class="panel">

    <!-- Card grande de área -->
    <div class="area-card">
      <div>
        <div class="area-val"><span id="area">0</span><small>m²</small></div>
        <div class="area-lbl">Conquistados</div>
      </div>
      <div class="area-ico">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
          <line x1="8" y1="2" x2="8" y2="18"/>
          <line x1="16" y1="6" x2="16" y2="22"/>
        </svg>
      </div>
    </div>

    <!-- Stats menores -->
    <div class="stats-grid">
      <div class="stat">
        <div class="stat-val" id="ritmo-medio">--:--</div>
        <div class="stat-lbl">Pace /km</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="distancia">0,00</div>
        <div class="stat-lbl">km</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="kcal">0</div>
        <div class="stat-lbl">kcal</div>
      </div>
    </div>

    <!-- Ranking ao vivo -->
    <div class="live">
      <div class="live-hdr">
        <span class="live-titulo">Ranking ao vivo</span>
        <span class="live-dot">AO VIVO</span>
      </div>
      <ul class="live-lst" id="ranking-lista">
        <li class="eu"><span class="pos">1º</span><span class="nome">Você</span><span class="ar">0 m²</span></li>
        <li><span class="pos">2º</span><span class="nome">Jogador 2</span><span class="ar">0 m²</span></li>
        <li><span class="pos">3º</span><span class="nome">Jogador 3</span><span class="ar">0 m²</span></li>
      </ul>
    </div>

    <!-- Ações -->
    <div class="actions">
      <button class="btn-pause" id="btn-pause" onclick="alternarPause()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="4" width="4" height="16"/>
          <rect x="14" y="4" width="4" height="16"/>
        </svg>
        Pausar
      </button>
      <button class="btn-stop" onclick="encerrarCorrida()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="6" width="12" height="12" rx="1.5"/>
        </svg>
        Encerrar
      </button>
    </div>

  </div>

  <!-- Resultado -->
  <div id="overlay" class="overlay escondido">
    <div class="res-card">
      <div class="res-head">
        <div class="res-flag">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--p-l)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
            <line x1="4" y1="22" x2="4" y2="15"/>
          </svg>
        </div>
        <div class="res-titulo">CORRIDA ENCERRADA</div>
        <div class="res-sub">resultado final</div>
      </div>

      <div class="vencedor">
        <div class="v-medal">1º</div>
        <div class="v-info">
          <div class="v-lbl">Vencedor</div>
          <div class="v-nome" id="res-vencedor">Jogador 1</div>
        </div>
        <div class="v-area"><span id="res-vencedor-area">1.250</span><small>m²</small></div>
      </div>

      <div class="res-rank" id="res-rank"></div>

      <button class="btn-continuar" onclick="window.location.href='index.html'">Continuar</button>
    </div>
  </div>

</div>

<script src="libs/leaflet.js"></script>
<script src="auth.js"></script>
<script>
  RC.requerLogin();

  /* ── Cronômetro ── */
  const params = new URLSearchParams(window.location.search);
  const minutos = parseInt(params.get('tempo')) || 10;
  let segundosRestantes = minutos * 60;
  const totalSegundos = segundosRestantes;
  let pausado = false;

  function atualizarCronometro() {
    const m = Math.floor(segundosRestantes / 60).toString().padStart(2, '0');
    const s = (segundosRestantes % 60).toString().padStart(2, '0');
    document.getElementById('cronometro').textContent = `${m}:${s}`;

    if (segundosRestantes <= 0) {
      clearInterval(intervalo);
      mostrarResultado();
      return;
    }
    if (!pausado) segundosRestantes--;
  }

  atualizarCronometro();
  const intervalo = setInterval(atualizarCronometro, 1000);

  function alternarPause() {
    pausado = !pausado;
    const btn = document.getElementById('btn-pause');
    btn.classList.toggle('retomar', pausado);
    btn.innerHTML = pausado
      ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg> Retomar'
      : '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg> Pausar';
  }

  function encerrarCorrida() {
    clearInterval(intervalo);
    mostrarResultado();
  }

  /* ── Resultado ── */
  function mostrarResultado() {
    // mock — virão do backend depois
    const finais = [
      { nome: 'Você',      m2: 1420, eu: true },
      { nome: 'Jogador 2', m2: 980 },
      { nome: 'Jogador 3', m2: 640 },
    ].sort((a, b) => b.m2 - a.m2);

    const venc = finais[0];
    document.getElementById('res-vencedor').textContent = venc.nome;
    document.getElementById('res-vencedor-area').textContent = venc.m2.toLocaleString('pt-BR');

    const html = finais.map((j, i) => `
      <div class="item${j.eu ? ' eu' : ''}">
        <span class="pos">${i + 1}º</span>
        <span class="nome">${j.nome}</span>
        <span class="ar">${j.m2.toLocaleString('pt-BR')} m²</span>
      </div>
    `).join('');
    document.getElementById('res-rank').innerHTML = html;

    document.getElementById('overlay').classList.remove('escondido');
  }

  /* ── Mapa ── */
  const mapa = L.map('mapa', { zoomControl: false, attributionControl: true })
    .setView([-19.9167, -43.9345], 15);

  // tile escuro pra combinar com o tema
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap, © CARTO',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(mapa);

  // marcador simples no início da rota (o backend depois plota a rota real)
  const inicio = L.circleMarker([-19.9167, -43.9345], {
    radius: 7,
    color: '#fff',
    weight: 2,
    fillColor: '#7c5cfc',
    fillOpacity: 1
  }).addTo(mapa);

  /* ── Relógio status bar ── */
  function tick() {
    const d = new Date();
    document.getElementById('relogio').textContent =
      String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }
  tick(); setInterval(tick, 30000);

  /* ── Tema ── */
  try {
    if (localStorage.getItem('rc_theme') === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  } catch(e) {}
</script>

</body>
</html>
